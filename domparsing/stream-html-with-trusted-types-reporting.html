<!doctype html>
<html>
  <head>
    <script src="/resources/testharness.js"></script>
    <script src="/resources/testharnessreport.js"></script>
    <script src="/trusted-types/support/csp-violations.js"></script>

    <meta
      http-equiv="Content-Security-Policy"
      content="require-trusted-types-for 'script'; connect-src 'none';"
    />
  </head>
  <body>
    <div id="container"></div>
    <script>
      const container = document.getElementById("container");

      function createAttachedElement() {
        const d = document.createElement("div");
        container.appendChild(d);
        return d;
      }

      function createShadowRoot() {
        const host = document.createElement("div");
        container.appendChild(host);
        return host.attachShadow({ mode: "open" });
      }

      const testCases = [
        {
          target: "Element",
          method: "streamHTML",
          createReceiver: createAttachedElement,
        },
        {
          target: "Element",
          method: "streamAppendHTML",
          createReceiver: createAttachedElement,
        },
        {
          target: "Element",
          method: "streamPrependHTML",
          createReceiver: createAttachedElement,
        },
        {
          target: "ShadowRoot",
          method: "streamHTML",
          createReceiver: createShadowRoot,
        },
        {
          target: "ShadowRoot",
          method: "streamAppendHTML",
          createReceiver: createShadowRoot,
        },
        {
          target: "ShadowRoot",
          method: "streamPrependHTML",
          createReceiver: createShadowRoot,
        },
        {
          target: "ChildNode",
          method: "streamBeforeHTML",
          createReceiver: createAttachedElement,
        },
        {
          target: "ChildNode",
          method: "streamAfterHTML",
          createReceiver: createAttachedElement,
        },
        {
          target: "ChildNode",
          method: "streamReplaceWithHTML",
          createReceiver: createAttachedElement,
        },
      ];

      for (const testCase of testCases) {
        promise_test(async (t) => {
          t.add_cleanup(() => container.replaceChildren());
          await no_trusted_type_violation_for(async () => {
            const receiver = testCase.createReceiver();
            const stream = receiver[testCase.method]();
            assert_true(stream instanceof WritableStream);
            const writer = stream.getWriter();
            await writer.write("<p>safe text</p>");
            await writer.close();
          });
        }, `${testCase.target} ${testCase.method} in enforced mode does not trigger securitypolicyviolation`);

        const unsafeMethod = testCase.method + "Unsafe";
        const expectedSink = `${testCase.target} ${unsafeMethod}`;

        promise_test(async (t) => {
          t.add_cleanup(() => container.replaceChildren());
          const receiver = testCase.createReceiver();
          const violation = await trusted_type_violation_for(TypeError, () => {
            receiver[unsafeMethod]();
          });

          assert_equals(violation.disposition, "enforce", "Violation disposition should be 'enforce'");
          assert_equals(violation.effectiveDirective, "require-trusted-types-for", "effectiveDirective must be 'require-trusted-types-for'");
          assert_equals(violation.violatedDirective, "require-trusted-types-for", "violatedDirective must be 'require-trusted-types-for'");
          assert_equals(violation.blockedURI, "trusted-types-sink", "blockedURI must be 'trusted-types-sink'");
          assert_true(violation.sample.startsWith(`${expectedSink}|`), `sample '${violation.sample}' should start with '${expectedSink}|'`);
        }, `${testCase.target} ${unsafeMethod} in enforced TT mode reports securitypolicyviolation with correct metadata when throwing`);
      }
    </script>
  </body>
</html>
