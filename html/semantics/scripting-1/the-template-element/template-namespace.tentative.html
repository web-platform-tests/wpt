<!doctype html>
<meta charset="utf-8">
<title>HTML Templates: template contents namespace</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/#the-template-element">
<link rel="help" href="https://github.com/whatwg/html/pull/13100">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>

<template id="explicit-svg" contentnamespace="svg">
  <circle cx="10" cy="10" r="5" />
  <clippath><rect width="10" height="10" /></clippath>
  <text id="svg-cdata-explicit"><![CDATA[<raw>&text</raw>]]></text>
  <script id="svg-script-in-template">window.templateScriptExecuted = true;</script>
  <circle id="after-svg-script" cx="20" cy="20" r="5" />
  <foreignObject id="fo-in-svg-template"><tr><td>hello</td></tr></foreignObject>
</template>

<template id="explicit-mathml" contentnamespace="mathml">
  <msup><mi>a</mi><mn>2</mn></msup>
</template>

<svg><template id="explicit-html" contentnamespace="html">
  <a href="#">hello</a><tr><td>cell</td></tr>
</template></svg>

<svg>
  <template id="in-svg">
    <circle cx="10" cy="10" r="5" />
    <text id="svg-cdata-inherited"><![CDATA[<raw>&inherited</raw>]]></text>
    <template id="nested-in-svg">
      <rect width="10" height="10" />
    </template>
    <template id="override-html-in-svg" contentnamespace="html">
      <a href="#">html inside svg template</a>
    </template>
  </template>
  <foreignObject>
    <template id="in-foreign-object">
      <a href="#">inside foreignObject</a>
    </template>
  </foreignObject>
</svg>

<math>
  <template id="in-math">
    <mrow><mi>x</mi><mo>+</mo><mi>y</mi></mrow>
  </template>
  <mtext>
    <template id="in-mtext">
      <a href="#">inside mtext</a>
    </template>
  </mtext>
  <annotation-xml encoding="text/html">
    <template id="in-annotation-html">
      <a href="#">inside annotation-xml text/html</a>
    </template>
  </annotation-xml>
  <annotation-xml encoding="application/xhtml+xml">
    <template id="in-annotation-xhtml">
      <a href="#">inside annotation-xml application/xhtml+xml</a>
    </template>
  </annotation-xml>
  <annotation-xml encoding="application/mathml-presentation+xml">
    <template id="in-annotation-mathml">
      <mrow><mi>z</mi></mrow>
    </template>
  </annotation-xml>
</math>

<svg><?marker name="svg-slot"><g><?start name="svg-range"><text>old</text><?end></g></svg>
<template for="svg-slot"><circle id="patched-circle" cx="5" cy="5" r="2" /></template>
<template for="svg-range"><rect id="patched-rect" width="5" height="5" /><clippath id="patched-cp" /></template>

<math><?marker name="math-slot"></math>
<template for="math-slot"><msup id="patched-msup"><mi>x</mi><mn>2</mn></msup></template>

<svg><?marker name="svg-html-slot"></svg>
<template for="svg-html-slot" contentnamespace="html"><a id="patched-html-in-svg" href="#">html</a></template>

<template id="failed-for-in-body" for="nonexistent-slot"><circle /></template>

<div id="outer-div-for-stray-end-tag"><template id="stray-end-tag-svg" contentnamespace="svg"><g></div><circle id="circle-after-stray-div-end" /></g></template><span id="sibling-after-stray-div-end"></span></div>

<div id="outer-div-for-inherited-stray-end-tag"><svg><template id="stray-end-tag-in-svg"><g></div><circle id="circle-after-inherited-stray-div-end" /></g></template></svg><span id="sibling-after-inherited-stray-div-end"></span></div>

<template id="unclosed-foreign" contentnamespace="svg"><g id="unclosed-g"><circle id="unclosed-circle" r="5"></template><div id="after-unclosed-foreign"></div>

<template id="breakout-in-svg-template" contentnamespace="svg"><g id="breakout-g"><p id="breakout-p"><span id="inside-breakout-span">text</span></p><circle id="after-breakout-circle" /></g></template>

<div id="sr-host"><template shadowrootmode="open" contentnamespace="svg"><circle id="sr-direct-circle" /><?marker name="sr-root-slot"><template for="sr-root-slot"><a id="sr-root-patched" href="#">patched in shadow root</a></template></template></div>

<script>
const HTML_NS = "http://www.w3.org/1999/xhtml";
const SVG_NS = "http://www.w3.org/2000/svg";
const MATHML_NS = "http://www.w3.org/1998/Math/MathML";

test(() => {
  const t = document.createElement("template");
  assert_equals(t.contentNamespace, "");

  for (const val of ["html", "svg", "mathml"]) {
    t.contentNamespace = val;
    assert_equals(t.getAttribute("contentnamespace"), val);
    assert_equals(t.contentNamespace, val);

    t.setAttribute("contentnamespace", val.toUpperCase());
    assert_equals(t.contentNamespace, val);
  }

  t.setAttribute("contentnamespace", "invalid");
  assert_equals(t.contentNamespace, "");
}, "HTMLTemplateElement.contentNamespace reflection is limited to only known values");

test(() => {
  const t = document.getElementById("explicit-svg");
  assert_equals(t.namespaceURI, HTML_NS);
  assert_equals(t.contentNamespace, "svg");
  const circle = t.content.querySelector("circle");
  assert_not_equals(circle, null);
  assert_equals(circle.namespaceURI, SVG_NS);
  const clipPath = t.content.querySelector("clipPath");
  assert_not_equals(clipPath, null);
  assert_equals(clipPath.namespaceURI, SVG_NS);
  assert_equals(clipPath.localName, "clipPath");
}, "<template contentnamespace='svg'> parses contents in the SVG namespace");

test(() => {
  const t = document.getElementById("explicit-mathml");
  assert_equals(t.namespaceURI, HTML_NS);
  assert_equals(t.contentNamespace, "mathml");
  const msup = t.content.querySelector("msup");
  assert_not_equals(msup, null);
  assert_equals(msup.namespaceURI, MATHML_NS);
  assert_equals(msup.firstElementChild.namespaceURI, MATHML_NS);
}, "<template contentnamespace='mathml'> parses contents in the MathML namespace");

test(() => {
  const t = document.getElementById("explicit-html");
  assert_equals(t.namespaceURI, HTML_NS);
  assert_equals(t.contentNamespace, "html");
  assert_equals(t.content.firstElementChild.namespaceURI, HTML_NS);
  assert_equals(t.content.querySelector("tr").namespaceURI, HTML_NS);
}, "<template contentnamespace='html'> inside <svg> parses non-breakout and table contents in the HTML namespace");

test(() => {
  const t = document.getElementById("in-svg");
  assert_equals(t.namespaceURI, HTML_NS);
  assert_true(t instanceof HTMLTemplateElement);
  const circle = t.content.querySelector("circle");
  assert_not_equals(circle, null);
  assert_equals(circle.namespaceURI, SVG_NS);

  const nested = t.content.getElementById("nested-in-svg");
  assert_equals(nested.namespaceURI, HTML_NS);
  assert_equals(nested.content.firstElementChild.namespaceURI, SVG_NS);

  const overrideHtml = t.content.getElementById("override-html-in-svg");
  assert_equals(overrideHtml.namespaceURI, HTML_NS);
  assert_equals(overrideHtml.content.firstElementChild.namespaceURI, HTML_NS);

  const inForeignObject = document.getElementById("in-foreign-object");
  assert_equals(inForeignObject.namespaceURI, HTML_NS);
  assert_equals(inForeignObject.content.firstElementChild.namespaceURI, HTML_NS);
}, "<template> inside <svg> is an HTMLTemplateElement and inherits SVG namespace unless in foreignObject or overridden");

test(() => {
  const t = document.getElementById("in-math");
  assert_equals(t.namespaceURI, HTML_NS);
  assert_true(t instanceof HTMLTemplateElement);
  const mrow = t.content.querySelector("mrow");
  assert_not_equals(mrow, null);
  assert_equals(mrow.namespaceURI, MATHML_NS);

  const inMtext = document.getElementById("in-mtext");
  assert_equals(inMtext.namespaceURI, HTML_NS);
  assert_equals(inMtext.content.firstElementChild.namespaceURI, HTML_NS);

  const inAnnotationHtml = document.getElementById("in-annotation-html");
  assert_equals(inAnnotationHtml.namespaceURI, HTML_NS);
  assert_equals(inAnnotationHtml.content.firstElementChild.namespaceURI, HTML_NS);

  const inAnnotationXhtml = document.getElementById("in-annotation-xhtml");
  assert_equals(inAnnotationXhtml.namespaceURI, HTML_NS);
  assert_equals(inAnnotationXhtml.content.firstElementChild.namespaceURI, HTML_NS);

  const inAnnotationMathml = document.getElementById("in-annotation-mathml");
  assert_equals(inAnnotationMathml.namespaceURI, HTML_NS);
  assert_equals(inAnnotationMathml.content.firstElementChild.namespaceURI, MATHML_NS);
}, "<template> inside <math> is an HTMLTemplateElement and inherits MathML namespace unless in a MathML text or HTML integration point");

test(() => {
  const tSvg = document.getElementById("explicit-svg");
  const cdataExplicit = tSvg.content.getElementById("svg-cdata-explicit");
  assert_not_equals(cdataExplicit, null);
  assert_equals(cdataExplicit.textContent, "<raw>&text</raw>");

  const tInherited = document.getElementById("in-svg");
  const cdataInherited = tInherited.content.getElementById("svg-cdata-inherited");
  assert_not_equals(cdataInherited, null);
  assert_equals(cdataInherited.textContent, "<raw>&inherited</raw>");
}, "CDATA sections are supported inside SVG templates (both explicit contentnamespace='svg' and inherited)");

test(t => {
  t.add_cleanup(() => { delete window.templateScriptExecuted; });
  const tSvg = document.getElementById("explicit-svg");
  const script = tSvg.content.getElementById("svg-script-in-template");
  assert_not_equals(script, null);
  assert_equals(script.namespaceURI, SVG_NS);
  assert_true(script instanceof SVGScriptElement);
  assert_equals(window.templateScriptExecuted, undefined);

  const afterCircle = tSvg.content.getElementById("after-svg-script");
  assert_not_equals(afterCircle, null);
  assert_equals(afterCircle.namespaceURI, SVG_NS);
}, "<script> inside <template contentnamespace='svg'> is an inert SVGScriptElement and closes properly");

test(() => {
  const tSvg = document.getElementById("explicit-svg");
  const fo = tSvg.content.getElementById("fo-in-svg-template");
  assert_not_equals(fo, null);
  assert_equals(fo.namespaceURI, SVG_NS);
  assert_equals(fo.querySelector("tr"), null);
  assert_equals(fo.querySelector("td"), null);
  assert_equals(fo.textContent, "hello");
}, "<foreignObject> inside <template contentnamespace='svg'> uses 'in body' insertion mode rather than 'in template' for table tags");

test(() => {
  const circle = document.getElementById("patched-circle");
  assert_not_equals(circle, null);
  assert_equals(circle.namespaceURI, SVG_NS);

  const rect = document.getElementById("patched-rect");
  assert_not_equals(rect, null);
  assert_equals(rect.namespaceURI, SVG_NS);

  const cp = document.getElementById("patched-cp");
  assert_not_equals(cp, null);
  assert_equals(cp.namespaceURI, SVG_NS);
  assert_equals(cp.localName, "clipPath");

  const msup = document.getElementById("patched-msup");
  assert_not_equals(msup, null);
  assert_equals(msup.namespaceURI, MATHML_NS);

  const htmlInSvg = document.getElementById("patched-html-in-svg");
  assert_not_equals(htmlInSvg, null);
  assert_equals(htmlInSvg.namespaceURI, HTML_NS);

  const failedTemplate = document.getElementById("failed-for-in-body");
  assert_not_equals(failedTemplate, null);
  assert_equals(failedTemplate.content.firstElementChild.namespaceURI, HTML_NS);
}, "Successful <template for> inherits namespace from its target unless overridden by contentnamespace");

test(() => {
  const t = document.createElement("template");
  t.contentNamespace = "svg";
  t.innerHTML = "<g viewBox='0 0 10 10'><circle cx='1' cy='2' r='3'/></g>";
  const g = t.content.firstElementChild;
  assert_equals(g.namespaceURI, SVG_NS);
  assert_true(g.hasAttribute("viewBox"));
  assert_equals(g.firstElementChild.namespaceURI, SVG_NS);

  const svg = document.createElementNS(SVG_NS, "svg");
  svg.innerHTML = "<template><path d='M0 0'/></template>";
  const innerTemplate = svg.firstElementChild;
  assert_equals(innerTemplate.namespaceURI, HTML_NS);
  assert_equals(innerTemplate.content.firstElementChild.namespaceURI, SVG_NS);

  const svgPatch = document.createElementNS(SVG_NS, "svg");
  svgPatch.innerHTML = "<?marker name='frag-svg-slot'><template for='frag-svg-slot'><circle/></template>";
  assert_equals(svgPatch.firstElementChild.namespaceURI, SVG_NS);
}, "Fragment parsing (innerHTML) respects template namespace and ancestor SVG namespace");

test(() => {
  const svg = document.createElementNS(SVG_NS, "svg");
  const tInSvg = document.createElement("template");
  svg.appendChild(tInSvg);
  tInSvg.innerHTML = "<circle cx='5' cy='5' r='5'/>";
  assert_equals(tInSvg.content.firstElementChild.namespaceURI, SVG_NS);

  const math = document.createElementNS(MATHML_NS, "math");
  const tInMath = document.createElement("template");
  math.appendChild(tInMath);
  tInMath.innerHTML = "<mrow><mi>x</mi></mrow>";
  assert_equals(tInMath.content.firstElementChild.namespaceURI, MATHML_NS);

  const annotationHtml = document.createElementNS(MATHML_NS, "annotation-xml");
  annotationHtml.setAttribute("encoding", "text/html");
  const tInAnnotationHtml = document.createElement("template");
  annotationHtml.appendChild(tInAnnotationHtml);
  tInAnnotationHtml.innerHTML = "<a href='#'>html in dom annotation-xml</a>";
  assert_equals(tInAnnotationHtml.content.firstElementChild.namespaceURI, HTML_NS);
}, "DOM-created <template> appended to <svg> or <math> inherits parent namespace on innerHTML");

test(() => {
  const t = document.createElement("template");
  t.contentNamespace = "svg";
  t.innerHTML = "<circle/>";
  assert_equals(t.content.firstElementChild.namespaceURI, SVG_NS);

  t.contentNamespace = "mathml";
  t.innerHTML = "<mi>x</mi>";
  assert_equals(t.content.firstElementChild.namespaceURI, MATHML_NS);

  t.contentNamespace = "html";
  t.innerHTML = "<a href='#'></a>";
  assert_equals(t.content.firstElementChild.namespaceURI, HTML_NS);

  t.setHTMLUnsafe("<svg><template id='unsafe-in-svg'><rect/></template></svg>");
  const unsafeT = t.content.getElementById("unsafe-in-svg");
  assert_equals(unsafeT.namespaceURI, HTML_NS);
  assert_equals(unsafeT.content.firstElementChild.namespaceURI, SVG_NS);

  const tSvgUnsafe = document.createElement("template");
  tSvgUnsafe.contentNamespace = "svg";
  tSvgUnsafe.setHTMLUnsafe("<clippath/>");
  assert_equals(tSvgUnsafe.content.firstElementChild.namespaceURI, SVG_NS);
  assert_equals(tSvgUnsafe.content.firstElementChild.localName, "clipPath");
}, "Dynamic template.contentNamespace changes and setHTMLUnsafe respect template contents namespace");

test(() => {
  const tInSvg = document.getElementById("in-svg");
  const cloned = tInSvg.cloneNode(true);
  assert_equals(cloned.namespaceURI, HTML_NS);
  assert_equals(cloned.content.querySelector("circle").namespaceURI, SVG_NS);

  cloned.innerHTML = "<a href='#'>detached</a>";
  assert_equals(cloned.content.firstElementChild.namespaceURI, HTML_NS);

  const svg = document.createElementNS(SVG_NS, "svg");
  svg.appendChild(cloned);
  cloned.innerHTML = "<rect width='5' height='5'/>";
  assert_equals(cloned.content.firstElementChild.namespaceURI, SVG_NS);
}, "cloneNode(true) on a <template> parsed inside <svg> preserves parsed contents without retaining SVG namespace when detached");

test(() => {
  const outer1 = document.getElementById("outer-div-for-stray-end-tag");
  const t1 = document.getElementById("stray-end-tag-svg");
  const sibling1 = document.getElementById("sibling-after-stray-div-end");
  assert_equals(sibling1.parentNode, outer1);
  const circle1 = t1.content.getElementById("circle-after-stray-div-end");
  assert_not_equals(circle1, null);
  assert_equals(circle1.namespaceURI, SVG_NS);
  assert_equals(circle1.parentNode.localName, "g");
  assert_equals(circle1.parentNode.namespaceURI, SVG_NS);

  const outer2 = document.getElementById("outer-div-for-inherited-stray-end-tag");
  const t2 = document.getElementById("stray-end-tag-in-svg");
  const sibling2 = document.getElementById("sibling-after-inherited-stray-div-end");
  assert_equals(sibling2.parentNode, outer2);
  const circle2 = t2.content.getElementById("circle-after-inherited-stray-div-end");
  assert_not_equals(circle2, null);
  assert_equals(circle2.namespaceURI, SVG_NS);
  assert_equals(circle2.parentNode.localName, "g");
  assert_equals(circle2.parentNode.namespaceURI, SVG_NS);
}, "Stray end tag inside <template contentnamespace='svg'> or <svg><template> does not close an open HTML ancestor outside <template>");

test(() => {
  const t = document.getElementById("unclosed-foreign");
  const g = t.content.getElementById("unclosed-g");
  assert_not_equals(g, null);
  assert_equals(g.namespaceURI, SVG_NS);
  const circle = t.content.getElementById("unclosed-circle");
  assert_not_equals(circle, null);
  assert_equals(circle.namespaceURI, SVG_NS);
  assert_equals(circle.parentNode, g);

  const afterDiv = document.getElementById("after-unclosed-foreign");
  assert_not_equals(afterDiv, null);
  assert_equals(afterDiv.namespaceURI, HTML_NS);
  assert_equals(afterDiv.previousElementSibling, t);
}, "Unclosed foreign elements inside <template contentnamespace='svg'> are closed by </template>");

test(() => {
  const t = document.getElementById("breakout-in-svg-template");
  const g = t.content.getElementById("breakout-g");
  assert_not_equals(g, null);
  assert_equals(g.namespaceURI, SVG_NS);

  const p = t.content.getElementById("breakout-p");
  assert_not_equals(p, null);
  assert_equals(p.namespaceURI, HTML_NS);
  assert_equals(p.parentNode, t.content);

  const span = t.content.getElementById("inside-breakout-span");
  assert_not_equals(span, null);
  assert_equals(span.namespaceURI, HTML_NS);
  assert_equals(span.parentNode, p);

  const circle = t.content.getElementById("after-breakout-circle");
  assert_not_equals(circle, null);
  assert_equals(circle.namespaceURI, SVG_NS);
  assert_equals(circle.parentNode, t.content);
}, "Foreign-content HTML breakout tag inside <template contentnamespace='svg'> breaks out to the template root in HTML namespace");

test(() => {
  const srHost = document.getElementById("sr-host");
  assert_not_equals(srHost.shadowRoot, null);
  const directCircle = srHost.shadowRoot.getElementById("sr-direct-circle");
  assert_not_equals(directCircle, null);
  assert_equals(directCircle.namespaceURI, HTML_NS);
  const patchedLink = srHost.shadowRoot.getElementById("sr-root-patched");
  assert_not_equals(patchedLink, null);
  assert_equals(patchedLink.namespaceURI, HTML_NS);

  const host2 = document.createElement("div");
  const sr2 = host2.attachShadow({ mode: "open" });
  const svg = document.createElementNS(SVG_NS, "svg");
  svg.innerHTML = "<template><circle/></template>";
  const tFromSvg = svg.firstElementChild;
  assert_equals(tFromSvg.content.firstElementChild.namespaceURI, SVG_NS);

  sr2.appendChild(tFromSvg);
  tFromSvg.innerHTML = "<a href='#'>in shadow root</a>";
  assert_equals(tFromSvg.content.firstElementChild.namespaceURI, HTML_NS);
}, "<template shadowrootmode='open'> supersedes contentnamespace='svg' and uses the shadow host's namespace");

test(() => {
  const svg = document.createElementNS(SVG_NS, "svg");
  const domTemplate = document.createElement("template");
  svg.appendChild(domTemplate);
  domTemplate.innerHTML = "<circle cx='1' cy='1' r='1'/>";
  assert_equals(domTemplate.content.firstElementChild.namespaceURI, SVG_NS);

  const clonedFromDomInSvg = domTemplate.cloneNode(true);
  assert_equals(clonedFromDomInSvg.content.firstElementChild.namespaceURI, SVG_NS);
  clonedFromDomInSvg.innerHTML = "<a href='#'>detached clone defaults to HTML</a>";
  assert_equals(clonedFromDomInSvg.content.firstElementChild.namespaceURI, HTML_NS);

  domTemplate.remove();
  domTemplate.innerHTML = "<a href='#'>detached template defaults to HTML</a>";
  assert_equals(domTemplate.content.firstElementChild.namespaceURI, HTML_NS);

  domTemplate.contentNamespace = "svg";
  const clonedExplicit = domTemplate.cloneNode(false);
  clonedExplicit.innerHTML = "<rect width='2' height='2'/>";
  assert_equals(clonedExplicit.content.firstElementChild.namespaceURI, SVG_NS);
  clonedExplicit.removeAttribute("contentnamespace");
  clonedExplicit.innerHTML = "<a href='#'>auto after removing attribute</a>";
  assert_equals(clonedExplicit.content.firstElementChild.namespaceURI, HTML_NS);

  const svg2 = document.createElementNS(SVG_NS, "svg");
  svg2.innerHTML = "<template><path/></template>";
  const parserTemplate = svg2.firstElementChild;
  assert_equals(parserTemplate.content.firstElementChild.namespaceURI, SVG_NS);

  parserTemplate.remove();
  parserTemplate.innerHTML = "<a href='#'>html after detach</a>";
  assert_equals(parserTemplate.content.firstElementChild.namespaceURI, HTML_NS);

  const math = document.createElementNS(MATHML_NS, "math");
  math.appendChild(parserTemplate);
  parserTemplate.innerHTML = "<mi>x</mi>";
  assert_equals(parserTemplate.content.firstElementChild.namespaceURI, MATHML_NS);
}, "Auto template namespace is resolved only at parse time from live context and defaults to HTML when detached");

test(() => {
  const t = document.createElement("template");
  t.contentNamespace = "svg";
  t.innerHTML = "<g></g>";
  const g = t.content.firstElementChild;
  assert_equals(g.namespaceURI, SVG_NS);

  const range = document.createRange();
  range.selectNodeContents(t);
  const frag = range.createContextualFragment("<circle cx='3' cy='4' r='5'/><clippath/>");
  assert_equals(frag.firstElementChild.namespaceURI, SVG_NS);
  assert_equals(frag.lastElementChild.namespaceURI, SVG_NS);
  assert_equals(frag.lastElementChild.localName, "clipPath");
}, "Range.prototype.createContextualFragment with a context inside <template contentnamespace='svg'>");

test(() => {
  const outer = document.createElement("template");
  outer.contentNamespace = "svg";
  const inner = document.createElement("template");
  outer.content.appendChild(inner);
  inner.innerHTML = "<circle cx='1' cy='1' r='2'/>";
  assert_equals(inner.content.firstElementChild.namespaceURI, SVG_NS);

  const standaloneFrag = new DocumentFragment();
  standaloneFrag.appendChild(inner);
  inner.innerHTML = "<a href='#'>falls back to default HTML inherited namespace</a>";
  assert_equals(inner.content.firstElementChild.namespaceURI, HTML_NS);

  const svg = document.createElementNS(SVG_NS, "svg");
  svg.innerHTML = "<template><rect/></template>";
  const parsedInSvg = svg.firstElementChild;
  assert_equals(parsedInSvg.content.firstElementChild.namespaceURI, SVG_NS);
  standaloneFrag.appendChild(parsedInSvg);
  parsedInSvg.innerHTML = "<a href='#'>falls back to HTML in hostless DocumentFragment</a>";
  assert_equals(parsedInSvg.content.firstElementChild.namespaceURI, HTML_NS);
}, "DOM-attached <template> inside outer template.content or standalone DocumentFragment");

test(() => {
  const outer = document.createElement("div");
  outer.setHTMLUnsafe(
    '<div id="dsd-host"><template shadowrootmode="open" shadowrootserializable contentnamespace="svg">' +
    '<circle id="dsd-c"/><xmp><span id="dsd-raw"></span></xmp></template></div>' +
    '<template id="dsd-ctrl-svg" contentnamespace="svg"><circle id="ctrl-c"/></template>'
  );
  const host = outer.querySelector("#dsd-host");
  assert_equals(host.shadowRoot.querySelector("#dsd-c").namespaceURI, HTML_NS);
  assert_equals(host.shadowRoot.querySelector("#dsd-raw"), null);
  assert_equals(outer.querySelector("#dsd-ctrl-svg").content.querySelector("#ctrl-c").namespaceURI, SVG_NS);

  const roundtrip = document.createElement("div");
  roundtrip.setHTMLUnsafe(outer.getHTML({ serializableShadowRoots: true }));
  const rtHost = roundtrip.querySelector("#dsd-host");
  assert_equals(rtHost.shadowRoot.querySelector("#dsd-c").namespaceURI, HTML_NS);
  assert_equals(rtHost.shadowRoot.querySelector("#dsd-raw"), null);
  assert_equals(roundtrip.querySelector("#dsd-ctrl-svg").content.querySelector("#ctrl-c").namespaceURI, SVG_NS);
}, "Declarative ShadowRoot supersedes <template contentnamespace='svg'> and round-trips consistently via getHTML()");

test(() => {
  const div = document.createElement("div");
  div.setHTML('<template contentnamespace="svg"><text><![CDATA[></template><p id="cdata-breakout">injected</p>]]></text></template>');
  assert_equals(div.querySelector("p"), null);
  assert_equals(div.textContent, "");

  const sDefaultWithTemplate = new Sanitizer();
  sDefaultWithTemplate.allowElement("template");
  div.setHTML(
    '<template id="explicit-svg" contentnamespace="svg"><circle/></template>' +
    '<svg><template id="inferred-svg"><rect/></template></svg>',
    { sanitizer: sDefaultWithTemplate }
  );
  const templates = div.querySelectorAll("template");
  assert_equals(templates[0].getAttribute("contentnamespace"), "svg");
  assert_equals(templates[0].content.firstElementChild.namespaceURI, SVG_NS);
  assert_false(templates[1].hasAttribute("contentnamespace"));
  assert_equals(templates[1].content.firstElementChild.namespaceURI, SVG_NS);

  const sReplaceBreakout = new Sanitizer({
    elements: ["div", { name: "svg", namespace: SVG_NS }, "xmp", "p"],
    replaceWithChildrenElements: [{ name: "foreignObject", namespace: SVG_NS }]
  });
  div.setHTML('<svg><foreignObject><template><xmp></template><p>injected</p></xmp></template></foreignObject></svg>', { sanitizer: sReplaceBreakout });
  assert_equals(div.querySelector("p"), null);

  const sReplaceKeep = new Sanitizer({
    elements: ["div", { name: "svg", namespace: SVG_NS }, "template", "a", { name: "a", namespace: SVG_NS }],
    replaceWithChildrenElements: [{ name: "foreignObject", namespace: SVG_NS }]
  });
  div.setHTML('<svg><foreignObject><template><a>x</a></template></foreignObject></svg>', { sanitizer: sReplaceKeep });
  const t = div.querySelector("template");
  assert_equals(t.parentNode.namespaceURI, SVG_NS);
  assert_false(t.hasAttribute("contentnamespace"));
  assert_equals(t.content.firstElementChild.namespaceURI, HTML_NS);
}, "Sanitizer preserves explicit contentnamespace by default, does not synthesize it for inferred namespaces, and uses live <template> state");

test(() => {
  const doc = Document.parseHTMLUnsafe(
    "<template id='direct-cdata' contentnamespace='SVG'><![CDATA[<raw>&direct]]><a>svg-a</a></template>" +
    "<template id='math-attrs' contentnamespace='MathML'><csymbol definitionurl='#x'/></template>" +
    "<svg><template id='shallow-src'><circle/></template><desc><template id='in-desc'><a>desc-a</a></template></desc></svg>"
  );
  const cdataTpl = doc.getElementById("direct-cdata");
  assert_equals(cdataTpl.content.firstChild.nodeValue, "<raw>&direct");
  assert_equals(cdataTpl.content.querySelector("a").namespaceURI, SVG_NS);

  const csymbol = doc.getElementById("math-attrs").content.firstElementChild;
  assert_equals(csymbol.namespaceURI, MATHML_NS);
  assert_true(csymbol.hasAttribute("definitionURL"));

  assert_equals(doc.getElementById("in-desc").content.firstElementChild.namespaceURI, HTML_NS);

  const shallow = doc.getElementById("shallow-src").cloneNode(false);
  assert_equals(shallow.namespaceURI, HTML_NS);
  assert_equals(shallow.content.childNodes.length, 0);
  shallow.innerHTML = "<a>html-when-detached</a>";
  assert_equals(shallow.content.firstElementChild.namespaceURI, HTML_NS);

  const importedAuto = document.importNode(doc.getElementById("shallow-src"), true);
  assert_equals(importedAuto.content.firstElementChild.namespaceURI, SVG_NS);

  const imported = document.importNode(cdataTpl, false);
  assert_equals(imported.content.childNodes.length, 0);
  imported.innerHTML = "<![CDATA[<frag>]]><use xlink:href='#x'/>";
  assert_equals(imported.content.firstChild.nodeValue, "<frag>");
  const useEl = imported.content.querySelector("use");
  assert_equals(useEl.getAttributeNodeNS("http://www.w3.org/1999/xlink", "href").value, "#x");
}, "Direct top-level CDATA, shallow cloneNode(false)/importNode, uppercase contentnamespace, desc integration point, and foreign attribute adjustments");

test(t => {
  const iframe = document.createElement("iframe");
  document.body.appendChild(iframe);
  t.add_cleanup(() => iframe.remove());
  const win = iframe.contentWindow;
  const doc = iframe.contentDocument;
  doc.open();
  doc.write("<!doctype html><body>");
  win.customElements.define("set-svg-tpl", class extends win.HTMLTemplateElement {
    constructor() {
      super();
      this.contentNamespace = "svg";
    }
  }, { extends: "template" });
  // The parser appends attributes after the constructor has run, so attributeChangedCallback is
  // the only place to remove the attribute before the template is opened.
  win.customElements.define("clear-svg-tpl", class extends win.HTMLTemplateElement {
    static observedAttributes = ["contentnamespace"];
    attributeChangedCallback(name, oldValue, newValue) {
      if (newValue !== null)
        this.removeAttribute("contentnamespace");
    }
  }, { extends: "template" });
  // The namespace is fixed when the template is opened, which is before it is inserted.
  win.customElements.define("late-svg-tpl", class extends win.HTMLTemplateElement {
    connectedCallback() {
      this.contentNamespace = "svg";
    }
  }, { extends: "template" });
  win.customElements.define("set-srm-tpl", class extends win.HTMLTemplateElement {
    constructor() {
      super();
      this.shadowRootMode = "open";
    }
  }, { extends: "template" });
  doc.write(
    '<template is="set-svg-tpl" id="t-set-svg"><circle/></template>' +
    '<template is="clear-svg-tpl" id="t-clear-svg" contentnamespace="svg"><a href="#">x</a></template>' +
    '<svg><template is="set-srm-tpl" id="t-srm-in-svg" contentnamespace="html"><circle/></template></svg>' +
    '<template is="late-svg-tpl" id="t-late-svg"><circle/></template>'
  );
  doc.close();

  assert_equals(doc.getElementById("t-set-svg").content.firstElementChild.namespaceURI, SVG_NS);
  assert_equals(doc.getElementById("t-clear-svg").content.firstElementChild.namespaceURI, HTML_NS);
  assert_equals(doc.getElementById("t-srm-in-svg").content.firstElementChild.namespaceURI, SVG_NS);
  assert_equals(doc.getElementById("t-late-svg").contentNamespace, "svg");
  assert_equals(doc.getElementById("t-late-svg").content.firstElementChild.namespaceURI, HTML_NS);

  let capturedDsdTpl = null;
  win.customElements.define("reentrant-svg-tpl", class extends win.HTMLTemplateElement {
    connectedCallback() {
      doc.write("<circle/></template><p id='after-reentrant'>ok</p>");
    }
  }, { extends: "template" });
  win.customElements.define("capture-dsd-tpl", class extends win.HTMLTemplateElement {
    constructor() {
      super();
      capturedDsdTpl = this;
    }
  }, { extends: "template" });

  doc.open();
  doc.write("<!doctype html><body>");
  doc.write('<template is="reentrant-svg-tpl" id="t-reentrant" contentnamespace="svg">');
  doc.write('<div id="dsd-wrap"><template is="capture-dsd-tpl" shadowrootmode="open"></template></div>');
  doc.close();

  assert_equals(doc.getElementById("t-reentrant").content.firstElementChild.namespaceURI, SVG_NS);
  assert_not_equals(doc.getElementById("after-reentrant"), null);

  const svgHost = doc.createElementNS(SVG_NS, "svg");
  svgHost.appendChild(capturedDsdTpl);
  const range = doc.createRange();
  range.setStart(capturedDsdTpl, 0);
  const ctxFrag = range.createContextualFragment("<rect></rect>");
  assert_equals(ctxFrag.firstElementChild.namespaceURI, HTML_NS);
}, "Customized built-in <template is='...'> synchronous attribute mutations, re-entrant document.write during parsing, and ShadowRoot-backed <template> reparented into <svg>");

test(t => {
  const iframe = document.createElement("iframe");
  document.body.appendChild(iframe);
  t.add_cleanup(() => iframe.remove());
  const win = iframe.contentWindow;
  const doc = iframe.contentDocument;

  let capturedAutoTpl = null;
  let capturedExplicitTpl = null;
  win.customElements.define("patch-auto-tpl", class extends win.HTMLTemplateElement {
    constructor() {
      super();
      capturedAutoTpl = this;
    }
  }, { extends: "template" });
  win.customElements.define("patch-explicit-tpl", class extends win.HTMLTemplateElement {
    constructor() {
      super();
      capturedExplicitTpl = this;
    }
  }, { extends: "template" });

  let pagehideAutoRan = false;
  let pagehideExpRan = false;
  doc.open();
  doc.write(
    "<!doctype html><body>" +
    "<svg id='svg-host'><?start name='svg-direct'><?end></svg>" +
    "<div id='div-host'><?start name='div-p'><iframe id='if-exp'></iframe><?end></div>"
  );
  const svgHost = doc.getElementById("svg-host");
  const ifSvg = doc.createElement("iframe");
  svgHost.insertBefore(ifSvg, svgHost.lastChild);
  ifSvg.contentWindow.addEventListener("pagehide", () => {
    pagehideAutoRan = true;
    capturedAutoTpl.contentNamespace = "html";
  });
  doc.getElementById("if-exp").contentWindow.addEventListener("pagehide", () => {
    pagehideExpRan = true;
    capturedExplicitTpl.contentNamespace = "html";
    capturedExplicitTpl.shadowRootMode = "open";
  });
  doc.write(
    "<template is='patch-auto-tpl' for='svg-direct'><circle id='c-auto'/></template>" +
    "<template is='patch-explicit-tpl' for='div-p' contentnamespace='svg'><circle id='c-exp'/></template></body>"
  );
  doc.close();

  assert_true(pagehideAutoRan);
  assert_true(pagehideExpRan);
  assert_equals(doc.getElementById("c-auto").namespaceURI, SVG_NS);
  assert_equals(doc.getElementById("c-exp").namespaceURI, SVG_NS);
}, "Attribute changes on <template for> during prepare content patching do not change its active parser namespace");
