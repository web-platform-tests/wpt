# This is the configuration file for Azure Pipelines, used to run tests on
# macOS and Windows. Documentation to help understand this setup:
# https://docs.microsoft.com/en-us/azure/devops/pipelines/yaml-schema
# https://docs.microsoft.com/en-us/azure/devops/pipelines/build/triggers
# https://docs.microsoft.com/en-us/azure/devops/pipelines/process/multiple-phases
# https://docs.microsoft.com/en-us/azure/devops/pipelines/process/templates
# https://docs.microsoft.com/en-us/azure/devops/pipelines/process/variables
# https://docs.microsoft.com/en-us/azure/devops/pipelines/tasks/index
#
# In addition to this configuration file, some setup in the Azure DevOps
# project is required:
#  - The "Build pull requests from forks of this repository" setting must be
#    enabled: https://docs.microsoft.com/en-us/azure/devops/pipelines/repos/github#validate-contributions-from-forks

# THROWAWAY BRANCH -- DO NOT MERGE.
#
# Future work step 2: the earlier synthetic-harness hunt (winsock_probe.py,
# 6.5M+ trials, zero anomalies -- see the plan's Run 2) is clean but is not
# byte-identical to a real `wpt run`: no real cert chains, no h2/websocket/
# webtransport-h3/DNS daemons, no real stash.py BaseManager Listener. This
# job trades trial count for exact fidelity by looping the real `wpt run` /
# Edge / wptrunner code path instead. It relies on the throwaway evidence
# capture in wptserve/server.py's serve_forever (WPT_WINSOCK_EVIDENCE_PATH)
# to turn a hit into a full diagnostic bundle instead of a bare traceback.
#
# Cold draws (fresh VM boot) are the scarce resource, so this maximises
# `parallel:` over iterations within any one agent: 20 cold draws plus
# ~10-15 warm iterations each, rather than lengthening one job. Don't stop at
# the first hit within an agent; keep every hit's log/stdout/evidence bundle
# and every trial's index, delete the rest.
#
# Notes for anyone editing this:
#  - No `dependsOn: decision` and no `condition:`. Every other job gates on
#    dependencies.decision.outputs['test_jobs.*'], and `./wpt test-jobs` has
#    no notion of this job, so gating it would mean it never runs.
#  - System.Debug is set to 'true' so configure_watson.yml's condition fires
#    and LocalDumps collects crash dumps into the artifact staging directory.
#  - continueOnError on the loop step, condition: always() on publish: a
#    trial timing out or the deadline elapsing mid-run must not lose whatever
#    trials/evidence were already produced.
#  - `strategy: parallel` needs a distinct artifact name per slice --
#    $(System.JobPositionInPhase) is what Azure populates for that.

jobs:
- job: winsock_hunt_win_wpt_loop
  displayName: 'WinError 997 hunt: loop real wpt run (throwaway, do not merge)'
  # Not 30: preamble (median 399s, observed up to 541s) plus the loop's own
  # 1500s deadline below is already ~1900s = 31.65min on a *median* preamble,
  # so a 30min job timeout guarantees Azure's own watchdog cancels every run
  # mid-trial -- before the loop's deadline, before summary.txt, sometimes
  # before that trial's files get cleaned up. Confirmed on build 158745: all
  # 20 slices canceled at ~30:00-30:16, zero reached a natural loop exit.
  # 60 rather than a tighter bound: generous headroom over preamble variance
  # and the publish steps, at no extra cost -- this is one job timeout, not
  # a lengthened experiment (the loop's own 1500s deadline is unchanged).
  timeoutInMinutes: 60
  pool:
    vmImage: 'windows-latest'
  variables:
    System.Debug: true
  strategy:
    parallel: 20
  steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.14'
  - template: tools/ci/azure/system_info.yml
  - template: tools/ci/azure/checkout.yml
  - template: tools/ci/azure/update_manifest.yml
  - template: tools/ci/azure/install_certs.yml
  - template: tools/ci/azure/install_edge.yml
    parameters:
      channel: dev
  - template: tools/ci/azure/configure_watson.yml
  - template: tools/ci/azure/update_hosts.yml
  - powershell: |
      # 25 minutes: leaves time inside the 30-minute job timeout for the
      # preamble above and for the publish steps below to actually run.
      $deadline = (Get-Date).AddSeconds(1500)
      $outDir = "$(Agent.TempDirectory)\trials"
      New-Item -ItemType Directory -Force -Path $outDir | Out-Null
      $trial = 0
      while ((Get-Date) -lt $deadline) {
        $trial++
        $log = "$outDir\trial-$trial.log"
        $stdout = "$outDir\trial-$trial.stdout.log"
        $env:WPT_WINSOCK_EVIDENCE_PATH = "$outDir\trial-$trial.evidence.jsonl"
        $proc = Start-Process -FilePath python -ArgumentList @(
          "./wpt", "run", "--yes", "--no-manifest-update", "--no-restart-on-unexpected",
          "--no-fail-on-unexpected", "--no-pause", "--log-mach", $log,
          "--channel", "dev", "--include", "infrastructure/", "edge"
        ) -RedirectStandardOutput $stdout -RedirectStandardError "$stdout.err" -PassThru -NoNewWindow
        # 20 min is well over the ~5-7 min a full infrastructure/ pass should
        # take; this bug does not itself hang (the recv() exception kills
        # serve_forever immediately), so this is a generic flakiness guard,
        # not a discriminator.
        if (-not $proc.WaitForExit(20 * 60 * 1000)) {
          Stop-Process -Id $proc.Id -Force
          Write-Host "trial $trial timed out"
        }
        $hit = Select-String -Path $log, $stdout, "$stdout.err" `
          -Pattern 'WinError 997', 'WinError 10038', 'CRITICAL' -ErrorAction SilentlyContinue
        if ($hit) {
          Write-Host "HIT on trial $trial -- stopping, evidence is in $outDir"
          break
        }
        Remove-Item $log, $stdout, "$stdout.err", $env:WPT_WINSOCK_EVIDENCE_PATH -ErrorAction SilentlyContinue
      }
      Write-Host "trials=$trial"
      "trials=$trial" | Out-File "$(Agent.TempDirectory)\summary.txt"
    displayName: 'Loop real wpt run (Edge Dev) against infrastructure/'
    continueOnError: true
  - publish: $(Agent.TempDirectory)\trials
    artifact: winsock-wpt-loop-$(System.JobPositionInPhase)
    condition: always()
    continueOnError: true
  # Crash dumps, if configure_watson.yml's LocalDumps caught anything.
  - publish: $(Build.ArtifactStagingDirectory)
    artifact: winsock-wpt-loop-dumps-$(System.JobPositionInPhase)
    condition: always()
    continueOnError: true
