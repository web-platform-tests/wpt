<!doctype html>
<meta charset="utf-8">
<title>Cross-Origin Storage: origins scoping and availability gating</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/common/utils.js"></script>
<script src="/common/get-host-info.sub.js"></script>
<script src="/common/dispatcher/dispatcher.js"></script>
<script src="resources/helpers.js"></script>
<script src="resources/cross-origin-helpers.js"></script>
<body>
<script>
'use strict';

// https://wicg.github.io/cross-origin-storage/#resource-visibility-upgrades
// https://wicg.github.io/cross-origin-storage/#availability-gating
// https://wicg.github.io/cross-origin-storage/#original-storer-access

const {HTTPS_REMOTE_ORIGIN, HTTPS_NOTSAMESITE_ORIGIN} = get_host_info();

promise_test(async t => {
  // origins omitted -> same-site tier. The storer (this document's own
  // origin) can always read its own write back, unconditionally.
  const {hash, content} = await cosStore(cosUniqueContent('samesite-storer'));
  assert_equals(await cosReadText(hash), content);
}, 'same-site tier: the storing origin can always read back its own resource');

promise_test(async t => {
  const {hash, content} = await cosStore(cosUniqueContent('samesite-samesite-reader'));
  const {ctx} = await cosOpenRemoteContext(HTTPS_REMOTE_ORIGIN);
  const result = await cosRemoteRead(ctx, hash);
  cosAssertDisclosableOrGreased(result, content,
    'a same-site sibling origin reading a same-site-scoped resource');
}, 'same-site tier: a same-site sibling origin is authorized (subject to GREASE\'ing)');

promise_test(async t => {
  const {hash} = await cosStore(cosUniqueContent('samesite-crosssite-reader'));
  const {ctx} = await cosOpenRemoteContext(HTTPS_NOTSAMESITE_ORIGIN);
  const result = await cosRemoteRead(ctx, hash);
  cosAssertNotDisclosed(result, 'a cross-site origin reading a same-site-scoped resource');
}, 'same-site tier: a cross-site origin is never authorized, deterministically');

promise_test(async t => {
  const {ctx} = await cosOpenRemoteContext(HTTPS_REMOTE_ORIGIN);
  const listOrigin = (await ctx.execute_script(() => location.origin, []));
  const {hash, content} = await cosStore(
    cosUniqueContent('list-listed-reader'), {origins: [listOrigin]});
  const result = await cosRemoteRead(ctx, hash);
  cosAssertDisclosableOrGreased(result, content, 'an explicitly-listed origin reading a list-scoped resource');
}, 'list tier: an explicitly-listed origin is authorized (subject to GREASE\'ing)');

promise_test(async t => {
  // List-tier disclosure is never subject to the PHL gate: only
  // availability gating's GREASE'ing step applies, exactly as for
  // same-site. This is the cross-site analogue of the previous test, using
  // an origin that is not same-site with the storer at all.
  const {ctx} = await cosOpenRemoteContext(HTTPS_NOTSAMESITE_ORIGIN);
  const listOrigin = (await ctx.execute_script(() => location.origin, []));
  const {hash, content} = await cosStore(
    cosUniqueContent('list-listed-crosssite-reader'), {origins: [listOrigin]});
  const result = await cosRemoteRead(ctx, hash);
  cosAssertDisclosableOrGreased(result, content,
    'a cross-site, explicitly-listed origin reading a list-scoped resource');
}, 'list tier: an explicitly-listed cross-site origin is authorized, with no PHL gate involved');

promise_test(async t => {
  const {hash} = await cosStore(
    cosUniqueContent('list-unlisted-reader'), {origins: [HTTPS_REMOTE_ORIGIN]});
  // A third origin, not the one listed above, must never be authorized.
  const {ctx} = await cosOpenRemoteContext(HTTPS_NOTSAMESITE_ORIGIN);
  const result = await cosRemoteRead(ctx, hash);
  cosAssertNotDisclosed(result, 'an origin absent from an explicit origins list');
}, 'list tier: an origin absent from the explicit list is never authorized, deterministically');

promise_test(async t => {
  const {hash, content} = await cosStore(
    cosUniqueContent('list-storer-not-self-listed'), {origins: [HTTPS_REMOTE_ORIGIN]});
  // The storer is not itself in the origins list it chose, yet it must
  // still be able to read its own write back (original storer access).
  assert_equals(await cosReadText(hash), content);
}, 'list tier: the storing origin can read back its own resource even when absent from its own origins list');

promise_test(async t => {
  const {hash, content} = await cosStore(cosUniqueContent('wildcard-storer'), {origins: '*'});
  assert_equals(await cosReadText(hash), content);
}, 'wildcard tier: the storing origin can always read back its own resource, independent of PHL status');

promise_test(async t => {
  // A non-storer origin reading a wildcard-scoped resource is subject to
  // both the origins check (passes, since it's "*") AND the PHL gate, which
  // this suite has no way to control -- so either NotFoundError or success
  // with correct content are both spec-compliant outcomes.
  const {hash, content} = await cosStore(cosUniqueContent('wildcard-other-reader'), {origins: '*'});
  const {ctx} = await cosOpenRemoteContext(HTTPS_NOTSAMESITE_ORIGIN);
  const result = await cosRemoteRead(ctx, hash);
  cosAssertDisclosableOrGreased(result, content,
    'a non-storer origin reading a wildcard-scoped resource (PHL membership is out of this suite\'s control)');
}, 'wildcard tier: a non-storer origin\'s read outcome depends on implementation-defined PHL/GREASE\'ing, but if disclosed the content must be correct');

promise_test(async t => {
  // Upgrade: list -> wider list. A cross-site origin absent from the
  // original list must be authorized once a later write (of the same
  // bytes) adds it. List-tier has no PHL gate, so this isolates the
  // upgrade mechanism itself from PHL nondeterminism.
  const content = cosUniqueContent('upgrade-list-to-wider-list');
  const {hash} = await cosStore(content, {origins: [HTTPS_REMOTE_ORIGIN]});

  const {ctx} = await cosOpenRemoteContext(HTTPS_NOTSAMESITE_ORIGIN);
  const notListedYet = await cosRemoteRead(ctx, hash);
  cosAssertNotDisclosed(notListedYet, 'before the upgrade, the not-yet-listed origin');

  // Re-write the identical bytes, widening the origins list.
  const handle = await navigator.crossOriginStorage.requestFileHandle(
    hash, {create: true, origins: [HTTPS_REMOTE_ORIGIN, HTTPS_NOTSAMESITE_ORIGIN]});
  const writable = await handle.createWritable();
  await writable.write(new Blob([content]));
  await writable.close();

  const afterUpgrade = await cosRemoteRead(ctx, hash);
  cosAssertDisclosableOrGreased(afterUpgrade, content, 'after the upgrade, the newly-listed origin');
}, 'resource visibility upgrade: a later write can widen a list-scoped entry\'s origins list');

promise_test(async t => {
  // Upgrade: list -> wildcard. Once an entry becomes "*"-scoped, it stays
  // "*"-scoped forever (visibility can be upgraded but never downgraded).
  // We can't directly observe the internal state, but we can confirm the
  // upgrade path itself doesn't throw and the storer keeps access.
  const content = cosUniqueContent('upgrade-list-to-wildcard');
  const {hash} = await cosStore(content, {origins: [HTTPS_REMOTE_ORIGIN]});

  const handle = await navigator.crossOriginStorage.requestFileHandle(
    hash, {create: true, origins: '*'});
  const writable = await handle.createWritable();
  await writable.write(new Blob([content]));
  await writable.close();

  assert_equals(await cosReadText(hash), content,
    'the storer can still read its own resource after upgrading it to "*"');
}, 'resource visibility upgrade: a later write can upgrade a list-scoped entry to wildcard');

promise_test(async t => {
  // Downgrade attempt: wildcard -> omitted (same-site). Per spec this is a
  // silent no-op; the entry must remain at least as available as before.
  // We test this via a same-site (not cross-site, to stay PHL-independent)
  // reader that would only be authorized under the ORIGINAL "*" scoping
  // being retained (a same-site reader would also be authorized under a
  // same-site downgrade, so this alone doesn't isolate the no-op -- but
  // combined with the storer-write succeeding without error, and the
  // spec's requirement that visibility never narrows, this documents the
  // expected behavior).
  const content = cosUniqueContent('downgrade-attempt-noop');
  const {hash} = await cosStore(content, {origins: '*'});

  // Attempt to "restrict" back to same-site by omitting origins.
  const handle = await navigator.crossOriginStorage.requestFileHandle(hash, {create: true});
  const writable = await handle.createWritable();
  await writable.write(new Blob([content]));
  await writable.close();

  // The write itself must succeed (it's a no-op on scoping, not an error),
  // and the storer must still be able to read its own resource.
  assert_equals(await cosReadText(hash), content);
}, 'resource visibility upgrade: omitting origins on a later write to an already-"*" entry is a silent no-op, not an error');

promise_test(async t => {
  // §3.4's closing note: "A new site -- not only the original storer --
  // can widen an entry's origins, as long as it also supplies bytes that
  // hash to the entry's hash." Every other upgrade test above has the
  // original storer perform the widening write itself; this exercises a
  // *different* origin (B) doing so. B is neither the original storer (A)
  // nor previously authorized to read A's same-site-scoped entry, yet its
  // independently-supplied, byte-correct write must still widen the
  // entry's origins to include a third origin (C) that neither A nor B
  // could otherwise have made C aware of.
  const content = cosUniqueContent('non-storer-widens-origins');
  const {hash} = await cosStore(content); // same-site only; this document (A) is the storer.

  const {ctx: ctxB} = await cosOpenRemoteContext(HTTPS_REMOTE_ORIGIN);
  const {ctx: ctxC} = await cosOpenRemoteContext(HTTPS_NOTSAMESITE_ORIGIN);
  const originC = await ctxC.execute_script(() => location.origin, []);

  const beforeWiden = await cosRemoteRead(ctxC, hash);
  cosAssertNotDisclosed(beforeWiden, 'before a non-storer widens the entry, an unrelated origin (C)');

  const widened = await ctxB.execute_script(async (hashArg, contentArg, originCArg) => {
    const handle = await navigator.crossOriginStorage.requestFileHandle(
      hashArg, {create: true, origins: [originCArg]});
    const writable = await handle.createWritable();
    await writable.write(new Blob([contentArg]));
    await writable.close();
    return true;
  }, [hash, content, originC]);
  assert_true(widened, "B's widening write (B is not the original storer) must succeed");

  const afterWiden = await cosRemoteRead(ctxC, hash);
  cosAssertDisclosableOrGreased(afterWiden, content,
    'after a non-storer (B) widens the entry to include C, origin C');
}, 'resource visibility upgrade: an origin other than the original storer can widen an entry\'s origins list, as long as it supplies the correct bytes');

promise_test(async t => {
  // origins: [] is a real, explicit empty list -- not shorthand for
  // "omitted". Per "determine COS disclosure", an omitted/null origins
  // value falls through to a same-site check (step 7); an explicit list,
  // even an empty one, is checked for exact membership (step 5) and can
  // never contain anything, so an empty list authorizes nobody but the
  // storer -- not even a same-site sibling, unlike the omitted case tested
  // above ("same-site tier: a same-site sibling origin is authorized").
  const {hash, content} = await cosStore(
    cosUniqueContent('empty-origins-list-not-same-as-omitted'), {origins: []});
  const {ctx} = await cosOpenRemoteContext(HTTPS_REMOTE_ORIGIN);
  const result = await cosRemoteRead(ctx, hash);
  cosAssertNotDisclosed(result,
    'a same-site sibling reading an entry stored with an explicit empty origins list ([])');
  // The storer itself must still be able to read its own write back.
  assert_equals(await cosReadText(hash), content);
}, 'list tier: origins: [] is a real (empty) list, not a same-site default -- a same-site sibling is not authorized under it, unlike an omitted origins value');

promise_test(async t => {
  // "validate a COS request" explicitly treats a single string as a list
  // of one. requestFileHandle-validation.tentative.https.any.js only
  // exercises this convenience form on a rejecting path (a malformed
  // single string); this confirms it is equally honored on a successful
  // create-then-read roundtrip, equivalent to passing a one-element array.
  const {ctx} = await cosOpenRemoteContext(HTTPS_REMOTE_ORIGIN);
  const listOrigin = await ctx.execute_script(() => location.origin, []);
  const {hash, content} = await cosStore(
    cosUniqueContent('bare-string-origins-form'), {origins: listOrigin});
  const result = await cosRemoteRead(ctx, hash);
  cosAssertDisclosableOrGreased(result, content,
    'an explicitly-listed origin reading a resource scoped via the bare-string origins form (not an array)');
}, 'list tier: options.origins accepts a bare string as shorthand for a one-element array, on the success path');

promise_test(async t => {
  // "apply availability gating" step 3 exempts any origin already in
  // storing origins from GREASE'ing, not only the original storer. The
  // "wildcard tier: the storing origin can always read back its own
  // resource, independent of PHL status" test above only covers the
  // *original* storer; this covers a *second*, later-arriving origin that
  // becomes a storing origin itself by successfully writing the identical
  // bytes, and must thereafter also read back deterministically.
  const content = cosUniqueContent('second-storer-wildcard-deterministic');
  const {hash} = await cosStore(content, {origins: '*'});

  const {ctx} = await cosOpenRemoteContext(HTTPS_NOTSAMESITE_ORIGIN);
  const wroteOwnCopy = await ctx.execute_script(async (hashArg, contentArg) => {
    const handle = await navigator.crossOriginStorage.requestFileHandle(
      hashArg, {create: true, origins: '*'});
    const writable = await handle.createWritable();
    await writable.write(new Blob([contentArg]));
    await writable.close();
    return true;
  }, [hash, content]);
  assert_true(wroteOwnCopy, "the second origin's own write must succeed");

  // Having itself written the bytes, this origin is now in storing
  // origins and must read the entry back deterministically -- unlike the
  // "non-storer reader" test for this same tier above, no GREASE-tolerant
  // helper is used here.
  const result = await cosRemoteRead(ctx, hash);
  assert_true(result.ok, 'a second storing origin must read its own contribution back deterministically');
  assert_equals(result.text, content);
}, 'wildcard tier: an origin that itself writes the bytes becomes a storing origin and thereafter reads deterministically, independent of PHL/GREASE\'ing');
</script>
</body>
