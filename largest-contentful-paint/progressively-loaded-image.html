<!DOCTYPE HTML>
<meta charset=utf-8>
<title>Largest Contentful Paint: Progressively Loaded Image</title>
<body>
  <script src="/resources/testharness.js"></script>
  <script src="/resources/testharnessreport.js"></script>
  <script src="resources/largest-contentful-paint-helpers.js"></script>
  <script>
    assert_implements(window.LargestContentfulPaint,
                      "LargestContentfulPaint is not implemented");
    const beforeLoad = performance.now();

    function calculateResourceLoadTime(imageSrc) {
      const entries = performance.getEntriesByName(imageSrc);
      const resourceEntry = entries[0];
      assert_equals(entries.length, 1, 'No Resource timing entry found');
      return resourceEntry.responseEnd;
    }

    promise_test(async function (t) {
      const entry = await awaitEntry(t, observeLCP({id: 'image_id'}),
          'Timed out waiting for the progressively loaded image entry');
      const imgElement = document.getElementById('image_id');
      const imageSrc = imgElement.currentSrc;
      const size = imgElement.naturalWidth * imgElement.naturalHeight;
      const resLoadTime = calculateResourceLoadTime(imageSrc);
      assert_greater_than_equal(entry.loadTime, resLoadTime, 'Load before LCP event fired');
      assert_greater_than_equal(entry.renderTime, resLoadTime, 'Load before LCP event rendered');
      assert_equals(entry.url, imageSrc, 'Entry url should be the image url');
      assert_equals(entry.id, 'image_id', 'Entry ID matches expected one');
      assert_equals(entry.element, imgElement, 'Entry element is expected one');
      assert_equals(entry.size, size, 'Entry size should be the natural image size');
      assert_greater_than_equal(entry.paintTime, beforeLoad, 'paintTime should represent the time when the UA started painting');
    }, 'Ensure Progressive JPEG LCP load and render events occur after resource loading');
  </script>
  <img src='/images/computer.jpg?pipe=trickle(982:d1)' id='image_id'/>
</body>
</html>
