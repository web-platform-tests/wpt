<!DOCTYPE html>
<title>User activation propagation across a navigation to a javascript: URL</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/browsing-the-web.html#apply-the-history-step">
<script src="/common/dispatcher/dispatcher.js"></script>
<script src="/common/utils.js"></script>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-vendor.js"></script>
<script src="/resources/testdriver-actions.js"></script>
<script src="resources/utils.js"></script>

<body>
  <p>Non-zero-sized body to allow clicks.</p>
</body>

<script>
  'use strict';

  let uuid1 = token();

  const reporter =
        `opener.postMessage([navigator.userActivation.isActive,
                             navigator.userActivation.hasBeenActive,
                             history.length], '*');`;

  const javascriptUrl = "javascript:" +
        encodeURIComponent(JSON.stringify(`<script>${reporter}<\/script>`));

  promise_test(async test => {
    // Open a new window, click it, and let it navigate itself to a javascript:
    // URL. The document that produces is same origin with the one it replaces,
    // its entry records the window itself as the initiator, and no redirect is
    // involved, so nothing blocks the carry-over. The entry's own "was created
    // via cross-origin redirects" is not carried into the new document state
    // either, so a reload exemption is not needed for this to work.
    let w;
    document.body.onclick = () => {
      w = window.open(`/common/dispatcher/remote-executor.html?uuid=${uuid1}`);
    };

    await test_driver.click(document.body);
    assert_true(!!w, "A window is opened");
    // Close the window at the end of the test, so that a later test in the same
    // session cannot click a window this one left behind.
    test.add_cleanup(() => w && w.close());

    const context = new RemoteContext(uuid1);

    // Check that the new window does not have user activation initially.
    {
      const result = await context.execute_script(getUserActivationState);
      assertUserActivationState(result, false, false, "after window opened");
    }

    // Confirm that the new window gets user activation after a click.
    await test_driver.click(w.document.documentElement);
    {
      const result = await context.execute_script(getUserActivationState);
      assertUserActivationState(result, true, true, "after window clicked");
    }

    // The length of the session history is read first, so that the check below
    // compares it against itself: a javascript: URL navigation is always a
    // replace, and how a window opened by window.open() counts its initial
    // about:blank entry is not what this test is about.
    const length_before =
          await context.execute_script(() => history.length);

    // Navigate the window to the javascript: URL, and wait for the document it
    // produces to report what it sees.
    const reported = new Promise(resolve => {
      window.addEventListener("message", event => resolve(event.data),
            {once: true});
    });

    await context.execute_script(url => {
      executor.suspend(() => {
        location.href = url;
      });
    }, [javascriptUrl]);

    const [transient, sticky, length] = await reported;

    assert_equals(length, length_before,
          "The document was replaced rather than pushed");
    assertUserActivationState([transient, sticky], false, true,
          "of the document the javascript: URL produced");
}, "User activation propagation across a navigation to a javascript: URL");
</script>
