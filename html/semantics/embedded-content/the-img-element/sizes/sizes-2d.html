<!doctype html>
<meta charset="utf-8">
<title>img parse a sizes attribute: two-dimensional sizes and srcset h descriptor</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/images.html#parse-a-sizes-attribute">
<link rel="help" href="https://html.spec.whatwg.org/multipage/images.html#source-concrete-width">
<link rel="help" href="https://html.spec.whatwg.org/multipage/images.html#dimension-attribute-aspect-ratio">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<style>
img { width: 10px; height: 10px; }
</style>
<div id=log></div>
<!-- ref1 selects the 50w candidate, ref2 selects the 51w candidate. -->
<img srcset='/images/green-1x1.png?ref1 50w, /images/green-16x16.png?ref1 51w' sizes='1px' id=ref1>
<img srcset='/images/green-1x1.png?ref2 50w, /images/green-16x16.png?ref2 51w' sizes='1000px' id=ref2>
<script>
"use strict";
setup({explicit_done: true});
performance.setResourceTimingBufferSize(1000);

// https://github.com/web-platform-tests/rfcs/pull/75
let async_promise_test = (promise, description) => {
  async_test(test => {
    promise(test)
      .then(() => {test.done();})
      .catch(test.step_func(error => { throw error; }));
  }, description);
};

function waitForLoad(t, target) {
  return new Promise((resolve, reject) => {
    const timer = t.step_timeout(() => {
      reject(new Error('Timed out waiting for load event'));
    }, 2000);
    target.onload = () => {
      clearTimeout(timer);
      resolve();
    };
    target.onerror = () => {
      clearTimeout(timer);
      reject(new Error('Unexpected error event'));
    };
  });
}

let sentinelCounter = 0;
async function flushImagePipeline(t) {
  const sentinel = document.createElement('img');
  t.add_cleanup(() => sentinel.remove());
  const loaded = waitForLoad(t, sentinel);
  sentinel.src = `/images/green-1x1.png?sentinel-${++sentinelCounter}`;
  document.body.appendChild(sentinel);
  await loaded;
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
}

function check(imgOrPicture, img, refId) {
  const ref = document.getElementById(refId);
  const name = imgOrPicture.outerHTML;
  async_promise_test(async (t) => {
    t.add_cleanup(() => imgOrPicture.remove());
    let expect = ref.currentSrc;
    if (expect) {
      expect = expect.split('?')[0];
    }
    if (expect === '' || expect === null || expect === undefined) {
      assert_unreached('ref currentSrc was ' + format_value(expect));
    }
    const loaded = waitForLoad(t, img);
    document.body.appendChild(imgOrPicture);
    await loaded;
    t.step(() => {
      assert_greater_than(img.currentSrc.indexOf('?'), -1, 'expected a "?" in currentSrc');
      assert_equals(img.currentSrc.split('?')[0], expect);
    });
  }, name);
}

// `h` holds the height descriptors (if any) of the 50w and 51w candidates.
// With `square`, both candidates have an aspect ratio of 1.
const square = [' 50h', ' 51h'];

const tests = [
  // With aspect ratio 1, contain in 10x1000 gives concrete width 10px (ref1),
  // cover gives 1000px (ref2).
  {sizes: 'contain 10px 1000px', h: square, ref: 'ref1'},
  {sizes: 'contain 1000px 10px', h: square, ref: 'ref1'},
  {sizes: 'CONTAIN 10px 1000px', h: square, ref: 'ref1'},
  {sizes: 'Contain 10px 1000px', h: square, ref: 'ref1'},
  {sizes: 'cover 10px 1000px, 1px', h: square, ref: 'ref2'},
  {sizes: 'cover 1000px 10px, 1px', h: square, ref: 'ref2'},
  {sizes: 'COVER 10px 1000px, 1px', h: square, ref: 'ref2'},
  {sizes: 'Cover 10px 1000px, 1px', h: square, ref: 'ref2'},
  {sizes: 'cover 0px 1000px, 1px', h: square, ref: 'ref2'},
  {sizes: 'contain 1000px 0px', h: square, ref: 'ref1'},
  {sizes: 'cover 0px 0px', h: square, ref: 'ref1'},
  {sizes: 'cover 0 1000px, 1px', h: square, ref: 'ref2'},
  // 'h' descriptors give aspect ratios of 50 and 25.5;
  // max(10px, 10px * 50) = 500px and max(10px, 10px * 25.5) = 255px.
  {sizes: 'cover 10px 10px, 1px', h: [' 1h', ' 2h'], ref: 'ref2'},
  // Same 'h' descriptor with different 'w' descriptors gives identical
  // normalized densities (w / (1000px * (w / 100)) = 0.1), so the first
  // candidate wins per duplicate density removal.
  {sizes: 'cover 10px 1000px', h: [' 100h', ' 100h'], ref: 'ref1'},
  // Invalid 'h' descriptors cause that image candidate to be dropped.
  {sizes: 'contain 10px 1000px', h: [' 0h', ' 51h'], ref: 'ref2'},
  {sizes: 'cover 10px 1000px, 1px', h: [' -50h', ' 51h'], ref: 'ref2'},
  {sizes: 'contain 10px 1000px', h: [' 50.5h', ' 51h'], ref: 'ref2'},
  {sizes: 'contain 10px 1000px', h: [' 50h 50h', ' 51h'], ref: 'ref2'},
  {sizes: 'contain 10px 1000px', h: [' 50h 5x', ' 51h'], ref: 'ref2'},
  {sizes: 'contain 10px 1000px', h: ['5x 50h ', ' 51h'], ref: 'ref2'},
  // 'h' descriptor preceding the 'w' descriptor.
  {sizes: 'cover 10px 10px, 1px', h: ['1h ', '2h '], ref: 'ref2'},
  {sizes: 'contain 10px 1000px', h: ['50h ', '51h '], ref: 'ref1'},
  {sizes: 'cover 10px calc(500px + 500px), 1px', h: square, ref: 'ref2'},
  {sizes: 'contain min(10px, 1000px) max(500px, 1000px)', h: square, ref: 'ref1'},
  {sizes: 'cover 10px clamp(500px, 1000px, 2000px), 1px', h: square, ref: 'ref2'},
  {sizes: 'cover calc(-1000px) 1000px, 1px', h: square, ref: 'ref2'},
  {sizes: 'contain 1000px calc(-1000px), 1000px', h: square, ref: 'ref1'},
  {sizes: 'cover 0.1em 100em, 1px', style: 'font-size: 0px', h: square, ref: 'ref2'},
  {sizes: 'contain 0.1em 100em, 1000px', style: 'font-size: 1000px', h: square, ref: 'ref1'},
  {sizes: 'cover/**/10px/**/1000px, 1px', h: square, ref: 'ref2'},
  {sizes: 'cover calc(10px)calc(1000px), 1px', h: square, ref: 'ref2'},
  {sizes: 'cover 1px 100vh, 1px', h: square, ref: 'ref2'},
  {sizes: 'contain 1px 100vh', h: square, ref: 'ref1'},
  {sizes: 'cover 100vw 1px, 1px', h: square, ref: 'ref2'},
  {sizes: 'contain 100vw 1px', h: square, ref: 'ref1'},
  {sizes: 'contain 10px 1000px, cover 10px 1000px, 1000px', h: square, ref: 'ref1'},
  {sizes: 'contain 10px 1000px, 1000px', h: square, ref: 'ref1'},

  // Media conditions with two-dimensional sizes.
  // For expected ref2 cases, use `cover 10px 10px, 1px` with `[' 1h', ' 2h']`
  // so every token in `sizes` is <= 10px and a 1D parser that extracts a
  // trailing length cannot accidentally select ref2.
  {sizes: '(min-width: 0px) cover 10px 10px, 1px', h: [' 1h', ' 2h'], ref: 'ref2'},
  {sizes: '(min-width: 0px)cover 10px 10px, 1px', h: [' 1h', ' 2h'], ref: 'ref2'},
  {sizes: '(max-width: 0px) cover 10px 1000px, contain 10px 1000px, 1000px', h: square, ref: 'ref1'},
  {sizes: '(max-width: 0px) contain 10px 1000px, (min-width: 0px) cover 10px 10px, 1px', h: [' 1h', ' 2h'], ref: 'ref2'},
  {sizes: '(min-width: 0px) contain 10px 1000px, 1000px', h: square, ref: 'ref1'},
  {sizes: '(max-width: 0px) contain 1000px 1000px, contain 10px 1000px, 1000px', h: square, ref: 'ref1'},
  {sizes: '(max-width: 0px) cover 10px 1000px, (min-width: 0px) contain 10px 1000px, 1000px', h: square, ref: 'ref1'},
  {sizes: 'not (max-width: 0px) cover 10px 10px, 1px', h: [' 1h', ' 2h'], ref: 'ref2'},
  {sizes: 'not (min-width: 0px) cover 10px 1000px, contain 10px 1000px, 1000px', h: square, ref: 'ref1'},
  {sizes: '(min-width: 0px) and (min-height: 0px) cover 10px 10px, 1px', h: [' 1h', ' 2h'], ref: 'ref2'},
  {sizes: '(min-width: 0px) and (max-height: 0px) cover 10px 1000px, contain 10px 1000px, 1000px', h: square, ref: 'ref1'},
  {sizes: '(max-width: 0px) or (min-height: 0px) cover 10px 10px, 1px', h: [' 1h', ' 2h'], ref: 'ref2'},
  {sizes: '(width >= 0px) cover 10px 10px, 1px', h: [' 1h', ' 2h'], ref: 'ref2'},
  {sizes: '(width < 0px) cover 10px 1000px, contain 10px 1000px, 1000px', h: square, ref: 'ref1'},
  // One-dimensional and two-dimensional sizes with media conditions mixed.
  {sizes: '(max-width: 0px) 1px, (min-width: 0px) cover 10px 10px, 1px', h: [' 1h', ' 2h'], ref: 'ref2'},
  {sizes: '(min-width: 0px) contain 10px 1000px, (min-width: 0px) 1000px', h: square, ref: 'ref1'},
  {sizes: '(min-width: 0px) cover 10px 10px, (min-width: 0px) 1px', h: [' 1h', ' 2h'], ref: 'ref2'},

  // Invalid two-dimensional sizes are skipped in favor of a valid 2D item (with
  // a 1000px 1D fallback so non-2D browsers fail instead of matching 1px).
  {sizes: 'cover 1000px, contain 10px 1000px, 1000px', h: square, ref: 'ref1'},
  {sizes: 'cover 1000px 1000px 1000px, contain 10px 1000px, 1000px', h: square, ref: 'ref1'},
  {sizes: 'cover -1000px 1000px, contain 10px 1000px, 1000px', h: square, ref: 'ref1'},
  {sizes: 'cover 1000px -1000px, contain 10px 1000px, 1000px', h: square, ref: 'ref1'},
  {sizes: 'cover 1000 1000, contain 10px 1000px, 1000px', h: square, ref: 'ref1'},
  {sizes: 'cover 1000px 100%, contain 10px 1000px, 1000px', h: square, ref: 'ref1'},
  {sizes: 'cover 100% 1000px, contain 10px 1000px, 1000px', h: square, ref: 'ref1'},
  {sizes: 'fill 1000px 1000px, contain 10px 1000px, 1000px', h: square, ref: 'ref1'},
  {sizes: 'scale-down 1000px 1000px, contain 10px 1000px, 1000px', h: square, ref: 'ref1'},
  {sizes: '1000px 1000px, contain 10px 1000px, 1000px', h: square, ref: 'ref1'},
  {sizes: '1000px cover 1000px, contain 10px 1000px, 1000px', h: square, ref: 'ref1'},
  {sizes: 'contain cover 1000px 1000px, contain 10px 1000px, 1000px', h: square, ref: 'ref1'},
  {sizes: 'contain, contain 10px 1000px, 1000px', h: square, ref: 'ref1'},
  {sizes: 'cover 1000px var(--h, 1000px), contain 10px 1000px, 1000px', h: square, ref: 'ref1'},
  {sizes: '(min-width: 0px) cover 10px 1000px 1000px, contain 10px 1000px, 1000px', h: square, ref: 'ref1'},
  {sizes: '(min-width: 0px) contain 1000px, contain 10px 1000px, 1000px', h: square, ref: 'ref1'},
  // CSS <ident-token> escapes are valid fit keywords, while <string-token> and
  // <function-token> are rejected.
  {sizes: 'c\\6f ver 10px 10px, 1px', h: [' 1h', ' 2h'], ref: 'ref2'},
  {sizes: '"cover" 1000px 1000px, contain 10px 1000px, 1000px', h: square, ref: 'ref1'},
  {sizes: 'cover(1000px 1000px), contain 10px 1000px, 1000px', h: square, ref: 'ref1'},

  // Without 'h' descriptors, the dimension attribute aspect ratio is used:
  // max(10px, 1000px * 1) = 1000px, or max(10px, 10px * 100) = 1000px.
  {sizes: 'cover 10px 1000px, 1px', width: '1', height: '1', h: ['', ''], ref: 'ref2'},
  {sizes: '(min-width: 0px) cover 10px 10px, 1px', width: '100', height: '1', h: ['', ''], ref: 'ref2'},
  // HTML rules for parsing dimension values: decimal with leading zero,
  // leading/trailing ASCII whitespace, and trailing unit garbage are valid
  // lengths; leading '+', leading '.', and exponential suffix after digits
  // follow HTML dimension parsing rather than CSS/JS float parsing.
  {sizes: 'cover 10px 1000px, 1px', width: '1.5', height: '1.5', h: ['', ''], ref: 'ref2'},
  {sizes: 'cover 10px 100px, 1px', width: '1', height: '0.01', h: ['', ''], ref: 'ref2'},
  {sizes: 'cover 10px 100px, 1px', width: ' 100 ', height: ' 1 ', h: ['', ''], ref: 'ref2'},
  {sizes: 'cover 10px 100px, 1px', width: '100px', height: '1px', h: ['', ''], ref: 'ref2'},
  {sizes: 'cover 10px 1000px, 1000px', width: '+100', height: '1', h: ['', ''], ref: 'ref1'},
  {sizes: 'cover 10px 1000px, 1000px', width: '.5', height: '0.005', h: ['', ''], ref: 'ref1'},
  {sizes: 'cover 10px 1000px, 1000px', width: '1e3', height: '100', h: ['', ''], ref: 'ref1'},
  // Zero, percentage, negative, or non-numeric dimension attributes give a null
  // dimension attribute aspect ratio, so the box width is used rather than 0,
  // negative, or +1 (-1/-1).
  {sizes: 'contain 1000px 10px, 1px', width: '0', height: '1', h: ['', ''], ref: 'ref2'},
  {sizes: 'contain 1000px 10px, 1px', width: '1', height: '0', h: ['', ''], ref: 'ref2'},
  {sizes: 'cover 10px 1000px, 1000px', width: '100%', height: '1', h: ['', ''], ref: 'ref1'},
  {sizes: 'contain 1000px 10px, 1px', width: '1', height: '100%', h: ['', ''], ref: 'ref2'},
  {sizes: 'contain 1000px 10px, 1px', width: '-1', height: '1', h: ['', ''], ref: 'ref2'},
  {sizes: 'cover 10px 1000px, 1000px', width: '-1', height: '-1', h: ['', ''], ref: 'ref1'},
  {sizes: 'cover 10px 1000px, 1000px', width: 'auto', height: '1', h: ['', ''], ref: 'ref1'},
  // With no aspect ratio at all, the width is used.
  {sizes: 'cover 10px 1000px, 1000px', h: ['', ''], ref: 'ref1'},
  // 'h' descriptors take precedence over the dimension attribute aspect ratio
  // in both directions.
  {sizes: 'cover 10px 10px, 1px', width: '1', height: '10', h: [' 1h', ' 2h'], ref: 'ref2'},
  {sizes: 'cover 10px 1000px, 1000px', width: '1', height: '1', h: [' 5000h', ' 5100h'], ref: 'ref1'},
  // Source aspect ratio is computed per candidate:
  // 1) In `contain 100px 10px, 100px`, candidate 1 (50w 500h -> ar 0.1 ->
  //    concreteWidth 1px -> 50x) uses its 'h' descriptor while candidate 2
  //    (51w -> no aspect ratio -> concreteWidth 100px -> 0.51x) falls back to
  //    box width, so candidate 1 (ref1) wins if and only if candidate 1 uses 'h'.
  // 2) In `cover 10px 1000px, 1px` with width=100 height=1, candidate 1 (50w ->
  //    default ar 100 -> concreteWidth 100000px -> 0.0005x) uses default ar while
  //    candidate 2 (51w 5100h -> ar 0.01 -> concreteWidth 10px -> 5.1x) uses 'h'.
  {sizes: 'contain 100px 10px, 100px', h: [' 500h', ''], ref: 'ref1'},
  {sizes: 'cover 10px 1000px, 1px', width: '100', height: '1', h: ['', ' 5100h'], ref: 'ref2'},
  // An explicit fit in sizes is not affected by the computed 'object-fit'.
  {sizes: 'contain 10px 1000px, 1000px', style: 'object-fit: cover', h: square, ref: 'ref1'},
  {sizes: 'cover 10px 1000px, 1px', style: 'object-fit: contain', h: square, ref: 'ref2'},
  // 'auto' on a non-lazy img is skipped in favor of the next source size, and
  // non-first 'auto' entries are ignored as invalid source-size items.
  {sizes: 'auto, (min-width: 0px) cover 10px 10px, 1px', h: [' 1h', ' 2h'], ref: 'ref2'},
  {sizes: '(max-width: 0px) 1px, auto, cover 10px 10px, 1px', h: [' 1h', ' 2h'], ref: 'ref2'},
];

function formatCandidate(url, w, h) {
  if (h.endsWith(' ')) {
    return `${url} ${h}${w}w`;
  }
  return `${url} ${w}w${h}`;
}

function srcsetFor(prefix, h) {
  return `${formatCandidate(`/images/green-1x1.png?${prefix}`, 50, h[0])}, ` +
         `${formatCandidate(`/images/green-16x16.png?${prefix}`, 51, h[1])}`;
}

function test_img(obj, i) {
  const img = document.createElement('img');
  for (const attr in obj) {
    if (attr !== 'h' && attr !== 'ref') {
      img.setAttribute(attr, obj[attr]);
    }
  }
  img.srcset = srcsetFor(`img${i}`, obj.h);
  check(img, img, obj.ref);
}

function test_picture(obj, i) {
  const picture = document.createElement('picture');
  const source = document.createElement('source');
  const img = document.createElement('img');
  for (const attr in obj) {
    switch (attr) {
      case 'h':
      case 'ref':
        break;
      case 'sizes':
      case 'width':
      case 'height':
        source.setAttribute(attr, obj[attr]);
        break;
      default:
        img.setAttribute(attr, obj[attr]);
        break;
    }
  }
  source.srcset = srcsetFor(`picture${i}`, obj.h);
  picture.appendChild(source);
  picture.appendChild(img);
  check(picture, img, obj.ref);
}

function test_link_preload(obj, i) {
  // <link rel=preload> has no dimension attributes or computed style.
  if (obj.width || obj.height || obj.style) {
    return;
  }
  const link = document.createElement('link');
  link.rel = 'preload';
  link.as = 'image';
  link.setAttribute('imagesizes', obj.sizes);
  link.setAttribute('imagesrcset', srcsetFor(`link${i}`, obj.h));
  const ref = document.getElementById(obj.ref);
  const name = link.outerHTML;
  async_promise_test(async (t) => {
    t.add_cleanup(() => link.remove());
    const expect = ref.currentSrc.split('?')[0];
    const loaded = waitForLoad(t, link);
    document.head.appendChild(link);
    await loaded;
    const entries = performance.getEntriesByType('resource')
        .filter(e => e.name.endsWith(`?link${i}`));
    assert_equals(entries.length, 1, 'exactly one candidate is preloaded');
    assert_equals(entries[0].name.split('?')[0], expect);
  }, name);
}

onload = () => {
  let i = 0;
  for (const obj of tests) {
    i++;
    test_img(obj, i);
    test_picture(obj, i);
    test_link_preload(obj, i);
  }

  // Non-first 'auto' on a lazy <img> does not satisfy allows auto-sizes and is
  // skipped in favor of the subsequent 2D source size.
  {
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.sizes = '(max-width: 0px) 1px, auto, cover 10px 10px, 1px';
    img.srcset = srcsetFor('lazy-nonfirst-auto', [' 1h', ' 2h']);
    check(img, img, 'ref2');
  }

  // A source without width/height attributes uses the img's dimension
  // attribute aspect ratio.
  {
    const picture = document.createElement('picture');
    const source = document.createElement('source');
    const img = document.createElement('img');
    source.sizes = 'cover 10px 1000px, 1px';
    source.srcset = srcsetFor('picture-img-dims', ['', '']);
    img.width = 1;
    img.height = 1;
    picture.appendChild(source);
    picture.appendChild(img);
    check(picture, img, 'ref2');
  }

  // A source with a width or height attribute does not use the img's.
  {
    const picture = document.createElement('picture');
    const source = document.createElement('source');
    const img = document.createElement('img');
    source.sizes = 'cover 10px 1000px, 1000px';
    source.srcset = srcsetFor('picture-source-width-only', ['', '']);
    source.setAttribute('width', '1');
    img.width = 1;
    img.height = 1;
    picture.appendChild(source);
    picture.appendChild(img);
    check(picture, img, 'ref1');
  }

  {
    const picture = document.createElement('picture');
    const source = document.createElement('source');
    const img = document.createElement('img');
    source.sizes = 'cover 10px 1000px, 1000px';
    source.srcset = srcsetFor('picture-source-height-only', ['', '']);
    source.setAttribute('height', '1');
    img.width = 1;
    img.height = 1;
    picture.appendChild(source);
    picture.appendChild(img);
    check(picture, img, 'ref1');
  }

  // When a <source> with width/height attributes stops matching, falling back
  // to <img> resets the dimension attribute source to <img>.
  async_promise_test(async (t) => {
    const ref1 = document.getElementById('ref1').currentSrc.split('?')[0];
    const ref2 = document.getElementById('ref2').currentSrc.split('?')[0];
    const picture = document.createElement('picture');
    t.add_cleanup(() => picture.remove());
    const source = document.createElement('source');
    const img = document.createElement('img');
    source.media = '(min-width: 0px)';
    source.sizes = 'cover 10px 1000px, 1px';
    source.srcset = srcsetFor('picture-fallback-source', ['', '']);
    source.setAttribute('width', '1');
    source.setAttribute('height', '1');
    img.sizes = 'cover 10px 1000px, 1000px';
    img.srcset = srcsetFor('picture-fallback-img', ['', '']);
    img.width = 1;
    img.height = 1000;
    picture.appendChild(source);
    picture.appendChild(img);
    const loaded = waitForLoad(t, img);
    document.body.appendChild(picture);
    await loaded;
    assert_equals(img.currentSrc.split('?')[0], ref2);

    const reloaded = waitForLoad(t, img);
    source.media = '(max-width: 0px)';
    await reloaded;
    assert_equals(img.currentSrc.split('?')[0], ref1);
  }, 'Falling back from <source> to <img> resets dimension attribute source to <img>');

  // Changing width/height attributes on a plain <img src> without srcset or
  // <picture> does not trigger a relevant mutation or fire load again.
  async_promise_test(async (t) => {
    const img = document.createElement('img');
    t.add_cleanup(() => img.remove());
    img.src = '/images/green-1x1.png?plain-src-dims';
    img.width = 10;
    img.height = 10;
    const loaded = waitForLoad(t, img);
    document.body.appendChild(img);
    await loaded;

    let unexpectedEvent = false;
    img.onload = img.onerror = () => { unexpectedEvent = true; };
    img.width = 20;
    img.height = 20;
    await flushImagePipeline(t);
    assert_false(unexpectedEvent);
  }, 'Changing dimension attributes on an <img src> without srcset or <picture> does not fire load');

  // An 'h' descriptor without a 'w' descriptor is a descriptor parse error,
  // causing that candidate to be dropped.
  async_promise_test(async (t) => {
    const ref2 = document.getElementById('ref2').currentSrc.split('?')[0];
    const img = document.createElement('img');
    t.add_cleanup(() => img.remove());
    img.sizes = 'contain 10px 1000px';
    img.srcset = '/images/green-1x1.png?bare-h 50h, /images/green-16x16.png?bare-h 51w 51h';
    const loaded = waitForLoad(t, img);
    document.body.appendChild(img);
    await loaded;
    assert_equals(img.currentSrc.split('?')[0], ref2);
  }, 'An h descriptor without a w descriptor drops the candidate');

  // Normalized source density from a 2D source size scales the image's
  // density-corrected natural dimensions (16w / 100px = 0.16x -> 16 / 0.16 = 100px;
  // 16w / 10px = 1.6x -> 16 / 1.6 = 10px).
  async_promise_test(async (t) => {
    const img = document.createElement('img');
    t.add_cleanup(() => img.remove());
    img.style = 'width: auto; height: auto';
    img.sizes = 'cover 10px 100px';
    img.srcset = '/images/green-16x16.png?density-corrected 16w 16h';
    let loaded = waitForLoad(t, img);
    document.body.appendChild(img);
    await loaded;
    assert_equals(img.width, 100);
    assert_equals(img.height, 100);

    loaded = waitForLoad(t, img);
    img.sizes = 'contain 10px 100px';
    await loaded;
    assert_equals(img.width, 10);
    assert_equals(img.height, 10);
  }, '2D sizes scales density-corrected natural dimensions and updates on dynamic sizes mutation');

  // Dynamically mutating sizes between 2D values on <img> and <source>
  // re-selects the image candidate.
  async_promise_test(async (t) => {
    const ref1 = document.getElementById('ref1').currentSrc.split('?')[0];
    const ref2 = document.getElementById('ref2').currentSrc.split('?')[0];
    const picture = document.createElement('picture');
    t.add_cleanup(() => picture.remove());
    const source = document.createElement('source');
    const img = document.createElement('img');
    source.sizes = 'contain 10px 1000px, 1000px';
    source.srcset = srcsetFor('dynamic-2d-sizes', square);
    picture.appendChild(source);
    picture.appendChild(img);
    let loaded = waitForLoad(t, img);
    document.body.appendChild(picture);
    await loaded;
    assert_equals(img.currentSrc.split('?')[0], ref1);

    loaded = waitForLoad(t, img);
    source.sizes = 'cover 10px 1000px, 1px';
    await loaded;
    assert_equals(img.currentSrc.split('?')[0], ref2);
  }, 'Dynamically mutating 2D sizes on <source> updates currentSrc');

  // Dynamically mutating width/height attributes on an eager <img> or <source>
  // with explicit 2D sizes and no 'h' descriptors updates the dimension
  // attribute aspect ratio and re-selects the candidate.
  async_promise_test(async (t) => {
    const ref1 = document.getElementById('ref1').currentSrc.split('?')[0];
    const ref2 = document.getElementById('ref2').currentSrc.split('?')[0];
    const img = document.createElement('img');
    t.add_cleanup(() => img.remove());
    img.sizes = 'cover 10px 1000px, 1px';
    img.srcset = srcsetFor('eager-img-dynamic-dims', ['', '']);
    img.width = 1;
    img.height = 100;
    let loaded = waitForLoad(t, img);
    document.body.appendChild(img);
    await loaded;
    assert_equals(img.currentSrc.split('?')[0], ref1);

    loaded = waitForLoad(t, img);
    img.height = 1;
    await loaded;
    assert_equals(img.currentSrc.split('?')[0], ref2);
  }, 'Dynamically mutating width/height on eager <img> with explicit 2D sizes updates currentSrc');

  async_promise_test(async (t) => {
    const ref1 = document.getElementById('ref1').currentSrc.split('?')[0];
    const ref2 = document.getElementById('ref2').currentSrc.split('?')[0];
    const img = document.createElement('img');
    t.add_cleanup(() => img.remove());
    img.sizes = 'contain 1000px 10px, 1000px';
    img.srcset = srcsetFor('eager-img-remove-height', ['', '']);
    img.width = 1;
    img.height = 1;
    let loaded = waitForLoad(t, img);
    document.body.appendChild(img);
    await loaded;
    assert_equals(img.currentSrc.split('?')[0], ref1);

    loaded = waitForLoad(t, img);
    img.removeAttribute('height');
    await loaded;
    assert_equals(img.currentSrc.split('?')[0], ref2);
  }, 'Removing height attribute on eager <img> with contain 2D sizes updates currentSrc');

  async_promise_test(async (t) => {
    const ref1 = document.getElementById('ref1').currentSrc.split('?')[0];
    const ref2 = document.getElementById('ref2').currentSrc.split('?')[0];
    const picture = document.createElement('picture');
    t.add_cleanup(() => picture.remove());
    const source = document.createElement('source');
    const img = document.createElement('img');
    source.sizes = 'cover 10px 1000px, 1px';
    source.srcset = srcsetFor('eager-dynamic-dims', ['', '']);
    source.setAttribute('width', '1');
    source.setAttribute('height', '100');
    picture.appendChild(source);
    picture.appendChild(img);
    let loaded = waitForLoad(t, img);
    document.body.appendChild(picture);
    await loaded;
    assert_equals(img.currentSrc.split('?')[0], ref1);

    loaded = waitForLoad(t, img);
    source.setAttribute('height', '1');
    await loaded;
    assert_equals(img.currentSrc.split('?')[0], ref2);
  }, 'Dynamically mutating width/height on <source> with explicit 2D sizes updates currentSrc');

  async_promise_test(async (t) => {
    const ref1 = document.getElementById('ref1').currentSrc.split('?')[0];
    const ref2 = document.getElementById('ref2').currentSrc.split('?')[0];
    const picture = document.createElement('picture');
    t.add_cleanup(() => picture.remove());
    const source = document.createElement('source');
    const img = document.createElement('img');
    source.sizes = 'contain 1000px 10px, 1000px';
    source.srcset = srcsetFor('eager-source-remove-height', ['', '']);
    source.setAttribute('width', '1');
    source.setAttribute('height', '1');
    img.width = 1;
    img.height = 1;
    picture.appendChild(source);
    picture.appendChild(img);
    let loaded = waitForLoad(t, img);
    document.body.appendChild(picture);
    await loaded;
    assert_equals(img.currentSrc.split('?')[0], ref1);

    loaded = waitForLoad(t, img);
    source.removeAttribute('height');
    await loaded;
    assert_equals(img.currentSrc.split('?')[0], ref2);
  }, 'Removing height attribute on <source> with width attribute clears aspect ratio without inheriting <img> dimensions');

  // width and height attributes on <link rel=preload as=image> are not
  // dimension attributes and do not provide a fallback aspect ratio.
  async_promise_test(async (t) => {
    const ref1 = document.getElementById('ref1').currentSrc.split('?')[0];
    const link = document.createElement('link');
    t.add_cleanup(() => link.remove());
    link.rel = 'preload';
    link.as = 'image';
    link.setAttribute('width', '1');
    link.setAttribute('height', '1');
    link.imageSizes = 'cover 10px 1000px, 1000px';
    link.imageSrcset = srcsetFor('link-ignores-width-height', ['', '']);
    const loaded = waitForLoad(t, link);
    document.head.appendChild(link);
    await loaded;
    const entries = performance.getEntriesByType('resource')
        .filter(e => e.name.endsWith('?link-ignores-width-height'));
    assert_equals(entries.length, 1);
    assert_equals(entries[0].name.split('?')[0], ref1);
  }, 'width and height attributes on <link rel=preload as=image> are ignored');

  // A <source> outside <picture> or following <img> inside <picture> neither
  // contributes a dimension attribute aspect ratio nor triggers a relevant
  // mutation when its width/height attributes change.
  async_promise_test(async (t) => {
    const ref1 = document.getElementById('ref1').currentSrc.split('?')[0];
    const div = document.createElement('div');
    t.add_cleanup(() => div.remove());
    const source = document.createElement('source');
    source.setAttribute('width', '1');
    source.setAttribute('height', '1');
    const img = document.createElement('img');
    img.sizes = 'cover 10px 1000px, 1000px';
    img.srcset = srcsetFor('non-picture-source-dims', ['', '']);
    div.appendChild(source);
    div.appendChild(img);
    const loaded = waitForLoad(t, img);
    document.body.appendChild(div);
    await loaded;
    assert_equals(img.currentSrc.split('?')[0], ref1);

    let unexpectedEvent = false;
    img.onload = img.onerror = () => { unexpectedEvent = true; };
    source.setAttribute('height', '100');
    source.removeAttribute('height');
    await flushImagePipeline(t);
    assert_false(unexpectedEvent);
  }, 'A <source> sibling outside <picture> does not affect <img> aspect ratio or trigger load');

  async_promise_test(async (t) => {
    const ref1 = document.getElementById('ref1').currentSrc.split('?')[0];
    const picture = document.createElement('picture');
    t.add_cleanup(() => picture.remove());
    const img = document.createElement('img');
    img.sizes = 'cover 10px 1000px, 1000px';
    img.srcset = srcsetFor('following-source-dims', ['', '']);
    const trailingSource = document.createElement('source');
    trailingSource.srcset = srcsetFor('following-source-ignored', ['', '']);
    trailingSource.setAttribute('width', '1');
    trailingSource.setAttribute('height', '1');
    picture.appendChild(img);
    picture.appendChild(trailingSource);
    const loaded = waitForLoad(t, img);
    document.body.appendChild(picture);
    await loaded;
    assert_equals(img.currentSrc.split('?')[0], ref1);

    let unexpectedEvent = false;
    img.onload = img.onerror = () => { unexpectedEvent = true; };
    trailingSource.setAttribute('height', '100');
    trailingSource.removeAttribute('height');
    await flushImagePipeline(t);
    assert_false(unexpectedEvent);
  }, 'A following <source> after <img> in <picture> does not affect <img> or trigger load');

  // Removing a matching <source> from <picture> resets the dimension attribute
  // source to <img>.
  async_promise_test(async (t) => {
    const ref1 = document.getElementById('ref1').currentSrc.split('?')[0];
    const ref2 = document.getElementById('ref2').currentSrc.split('?')[0];
    const picture = document.createElement('picture');
    t.add_cleanup(() => picture.remove());
    const source = document.createElement('source');
    const img = document.createElement('img');
    source.sizes = 'cover 10px 1000px, 1000px';
    source.srcset = srcsetFor('picture-remove-source', ['', '']);
    source.setAttribute('width', '1');
    source.setAttribute('height', '100');
    img.sizes = 'cover 10px 1000px, 1px';
    img.srcset = srcsetFor('picture-remove-img', ['', '']);
    img.width = 1;
    img.height = 1;
    picture.appendChild(source);
    picture.appendChild(img);
    const initialLoaded = waitForLoad(t, img);
    document.body.appendChild(picture);
    await initialLoaded;
    assert_equals(img.currentSrc.split('?')[0], ref1);

    const reloaded = waitForLoad(t, img);
    source.remove();
    await reloaded;
    assert_equals(img.currentSrc.split('?')[0], ref2);
  }, 'Removing a matching <source> from <picture> resets dimension attribute source to <img>');

  // A preceding <source> skipped because of an unsupported MIME type does not
  // become the dimension attribute source for <img>.
  async_promise_test(async (t) => {
    const ref2 = document.getElementById('ref2').currentSrc.split('?')[0];
    const picture = document.createElement('picture');
    t.add_cleanup(() => picture.remove());
    const skippedSource = document.createElement('source');
    const img = document.createElement('img');
    skippedSource.type = 'image/x-unsupported-2d-test';
    skippedSource.sizes = 'cover 10px 1000px, 1px';
    skippedSource.srcset = srcsetFor('picture-unsupported-source', ['', '']);
    skippedSource.setAttribute('width', '1');
    skippedSource.setAttribute('height', '100');
    img.sizes = 'cover 10px 1000px, 1px';
    img.srcset = srcsetFor('picture-unsupported-fallback-img', ['', '']);
    img.width = 1;
    img.height = 1;
    picture.appendChild(skippedSource);
    picture.appendChild(img);
    const loaded = waitForLoad(t, img);
    document.body.appendChild(picture);
    await loaded;
    assert_equals(img.currentSrc.split('?')[0], ref2);
  }, 'A preceding <source> with an unsupported type does not override <img> dimension attribute aspect ratio');

  // 2D sizes inside an <iframe> resolves vw and vh against the iframe's own
  // viewport width and height rather than the outer browsing context.
  async_promise_test(async (t) => {
    const ref1 = document.getElementById('ref1').currentSrc.split('?')[0];
    const ref2 = document.getElementById('ref2').currentSrc.split('?')[0];

    async function createIframe(width, height) {
      const iframe = document.createElement('iframe');
      t.add_cleanup(() => iframe.remove());
      iframe.style.cssText = `width: ${width}px; height: ${height}px; border: 0`;
      const loaded = new Promise(resolve => { iframe.onload = resolve; });
      iframe.srcdoc = '<!doctype html><body></body>';
      document.body.appendChild(iframe);
      await loaded;
      assert_equals(iframe.contentWindow.innerWidth, width);
      assert_equals(iframe.contentWindow.innerHeight, height);
      return iframe;
    }

    // 10vw = 10px and 100vh = 10px in the 100x10 iframe -> max(10px, 10px) = 10px (ref1);
    // outer viewport (~800x600) or 1D fallback (1000px) would select ref2.
    const smallIframe = await createIframe(100, 10);
    const smallImg = smallIframe.contentDocument.createElement('img');
    smallImg.sizes = 'cover 10vw 100vh, 1000px';
    smallImg.srcset = srcsetFor('iframe-vw-vh-small', [' 50h', ' 51h']);
    const smallImgLoaded = waitForLoad(t, smallImg);
    smallIframe.contentDocument.body.appendChild(smallImg);
    await smallImgLoaded;
    assert_equals(smallImg.currentSrc.split('?')[0], ref1);

    // 500vw = 1000px and 10vh = 1px in the 200x10 iframe -> max(1000px, 1px) = 1000px (ref2);
    // 0x0 viewport or 1D fallback (1px) would select ref1.
    const wideIframe = await createIframe(200, 10);
    const wideImg = wideIframe.contentDocument.createElement('img');
    wideImg.sizes = 'cover 500vw 10vh, 1px';
    wideImg.srcset = srcsetFor('iframe-vw-vh-wide', [' 50h', ' 51h']);
    const wideImgLoaded = waitForLoad(t, wideImg);
    wideIframe.contentDocument.body.appendChild(wideImg);
    await wideImgLoaded;
    assert_equals(wideImg.currentSrc.split('?')[0], ref2);

    // 10vw = 1px and 500vh = 1000px in the 10x200 iframe -> max(1px, 1000px) = 1000px (ref2);
    // 0x0 viewport, using vw for vh (50px), or 1D fallback (1px) would select ref1.
    const tallIframe = await createIframe(10, 200);
    const tallImg = tallIframe.contentDocument.createElement('img');
    tallImg.sizes = 'cover 10vw 500vh, 1px';
    tallImg.srcset = srcsetFor('iframe-vw-vh-tall', [' 50h', ' 51h']);
    const tallImgLoaded = waitForLoad(t, tallImg);
    tallIframe.contentDocument.body.appendChild(tallImg);
    await tallImgLoaded;
    assert_equals(tallImg.currentSrc.split('?')[0], ref2);
  }, '2D sizes in an <iframe> resolves vw and vh against the iframe viewport');

  done();
}
