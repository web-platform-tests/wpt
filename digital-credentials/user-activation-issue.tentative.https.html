<!DOCTYPE html>
<title>Digital Credential API: issue() user activation tests.</title>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-vendor.js"></script>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="support/helper.js" type="module"></script>
<body></body>
<script type="module">
  import { makeIssueOptions } from "./support/helper.js";

  promise_test(async (t) => {
    assert_false(
      navigator.userActivation.isActive,
      "User activation should not be active",
    );
    const options = makeIssueOptions();
    await promise_rejects_dom(
      t,
      "NotAllowedError",
      DigitalCredential.issue(options),
    );
  }, "DigitalCredential.issue() calling the API without user activation should reject with NotAllowedError.");

  promise_test(async (t) => {
    assert_false(
      navigator.userActivation.isActive,
      "User activation should not be active",
    );
    const options = makeIssueOptions({ data: { val: BigInt(1) } });
    await promise_rejects_dom(
      t,
      "NotAllowedError",
      DigitalCredential.issue(options),
    );
  }, "DigitalCredential.issue() with non-serializable data and no user activation should reject with NotAllowedError.");

  promise_test(async (t) => {
    assert_false(
      navigator.userActivation.isActive,
      "User activation should not be active",
    );
    // A missing `requests` member is a synchronous WebIDL TypeError, thrown
    // before the user-activation check, so no activation is required.
    await promise_rejects_js(
      t,
      TypeError,
      DigitalCredential.issue({}),
    );
    assert_false(
      navigator.userActivation.isActive,
      "User activation should not be active",
    );
  }, "DigitalCredential.issue() with missing requests and no user activation needed should reject with TypeError.");

  promise_test(async (t) => {
    await test_driver.bless();
    assert_true(
      navigator.userActivation.isActive,
      "User activation should be active after test_driver.bless().",
    );
    const abort = new AbortController();
    const options = makeIssueOptions({ signal: abort.signal });
    abort.abort();
    const promise = DigitalCredential.issue(options);
    await promise_rejects_dom(t, "AbortError", promise);
    assert_true(
      navigator.userActivation.isActive,
      "User activation should not be consumed on early abort with DigitalCredential.issue().",
    );
  }, "DigitalCredential.issue() with early abort does not consume user activation.");

  promise_test(async (t) => {
    await test_driver.bless();
    assert_true(
      navigator.userActivation.isActive,
      "User activation should be active after test_driver.bless().",
    );
    const abort = new AbortController();
    const options = makeIssueOptions({ signal: abort.signal });

    const promise = DigitalCredential.issue(options);
    abort.abort();
    await promise_rejects_dom(t, "AbortError", promise);
    assert_false(
      navigator.userActivation.isActive,
      "User activation should be consumed after DigitalCredential.issue().",
    );
  }, "DigitalCredential.issue() with late abort consumes user activation.");
</script>
