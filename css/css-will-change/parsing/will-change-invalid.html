<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS Will Change Test: parsing will-change with invalid values</title>
<link rel="author" title="Eric Willigers" href="mailto:ericwilligers@chromium.org">
<link rel="help" href="https://drafts.csswg.org/css-will-change/#propdef-will-change">
<meta name="assert" content="will-change only supports the grammar 'auto | <animateable-feature>#'.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/css/support/parsing-testcommon.js"></script>
</head>
<body>
<script>
test_invalid_value("will-change", "auto transform");
test_invalid_value("will-change", "contents auto");

let baseExcludedKeywords = [
  // CSS-wide keywords are excluded from <custom-ident>
  // https://drafts.csswg.org/css-values-4/#identifier-value
  "initial",
  "inherit",
  "unset",
  "revert",
  "revert-layer",
  "revert-rule",
  "default",

  // will-change additionally excludes the following from <custom-ident>
  "will-change",
  "none",
  "all",
  "auto",
];

let excludedKeywords = [];
for (let keyword of baseExcludedKeywords) {
  excludedKeywords.push(keyword);
  excludedKeywords.push(keyword.toUpperCase());
  // Mixed case
  excludedKeywords.push(keyword[0].toUpperCase() + keyword.slice(1));
}

for (let keyword of excludedKeywords) {
  test_invalid_value("will-change", `transform, ${keyword}`);
  test_invalid_value("will-change", `${keyword}, transform`);
  for (let k of excludedKeywords) {
    test_invalid_value("will-change", `${keyword}, ${k}`);
  }
}

// These are completely invalid as standalone values
let standaloneInvalid = ["will-change", "none", "all"];
for (let keyword of standaloneInvalid) {
  test_invalid_value("will-change", keyword);
  test_invalid_value("will-change", keyword.toUpperCase());
  test_invalid_value("will-change", keyword[0].toUpperCase() + keyword.slice(1));
}

// auto is valid as a standalone value, but we still test it in excludedKeywords loops
// scroll-position and contents are valid as standalone and in list contexts,
// so they are tested in will-change-valid.html.
</script>
</body>
</html>
