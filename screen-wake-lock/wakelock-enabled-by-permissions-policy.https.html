<!DOCTYPE html>
<body>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-vendor.js"></script>
<script src="/permissions-policy/resources/permissions-policy.js"></script>
<script src="/common/get-host-info.sub.js"></script>
<body>
<script>
  "use strict";

  const same_origin_src =
    "/permissions-policy/resources/permissions-policy-screen-wakelock.html";
  const cross_origin_src =
    get_host_info().HTTPS_REMOTE_ORIGIN + same_origin_src;

  const header = 'Permissions-Policy header "screen-wake-lock=*"';

  promise_test(async t => {
    await test_driver.bless("screen wake lock");
    const lock = await navigator.wakeLock.request('screen');
    await lock.release();
  }, `${header} allows the top-level document.`);

  promise_test(t => {
    return test_feature_availability({
      feature_description: 'navigator.wakeLock.request("screen")',
      test: t,
      src: same_origin_src,
      expect_feature_available: expect_feature_available_default,
      is_promise_test: true,
    });
  }, `${header} allows same-origin iframes.`);

  // Set allow="screen-wake-lock" on iframe element to delegate
  // 'screen-wake-lock' to cross origin subframe.
  promise_test(t => {
    return test_feature_availability({
      feature_description: 'navigator.wakeLock.request("screen")',
      test: t,
      src: cross_origin_src,
      expect_feature_available: expect_feature_available_default,
      feature_name: 'screen-wake-lock',
      is_promise_test: true,
    });
  }, `${header} allows cross-origin iframes.`);
</script>
</body>
