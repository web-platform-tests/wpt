<!DOCTYPE html>
<html>
  <title>
    Test that all event handlers are called when a remote playback device is
    connected and then disconnected using prompt()
  </title>
  <script src="/resources/testharness.js"></script>
  <script src="/resources/testharnessreport.js"></script>
  <script src="/common/media.js"></script>
  <script src="./utils.js"></script>
  <script>
    setup({ explicit_timeout: true });
  </script>
  <body>
    <div id="prep">
      <p>Please make sure a device for remote playback is <b>available.</b></p>
      <button id="prompt-button-prep">Show devices</button>
      <button id="start-button">Start test</button>
    </div>
    <div id="pick-device" style="display: none">
      <p id="connect-instructions">
        Click the button below to prompt for a remote playback device and select
        one!
      </p>
      <button id="prompt-button">Pick device</button>
      <p id="disconnect-instructions" style="display: none">
        Click the button below and <b>disconnect</b> from the device using the
        user interface that is shown.
      </p>
      <button id="disconnect-button" style="display: none">
        Disconnect device
      </button>
    </div>
  </body>
  <script src="./prepare-device.js"></script>
  <script>
    let v = document.createElement("video");
    v.src = getVideoURI("/media/movie_300");
    let promptButton = document.getElementById("prompt-button");
    let disconnectButton = document.getElementById("disconnect-button");
    const metadataLoaded = enablePromptAfterMetadataLoaded(
        v, document.getElementById("prompt-button-prep"), promptButton);

    // Records the order of prompt() fulfillment and events fired at v.remote
    // (using the onconnecting, onconnect and ondisconnect event handlers),
    // along with the state observed at each step.
    const log = [];
    logRemotePlaybackEvents(v.remote, log, /*useEventHandlerAttributes=*/true);
    const eventsInLog = () => log.filter(e => !e.startsWith("prompt"));

    promise_test(async t => {
      assert_equals(v.remote.state, "disconnected");
      await metadataLoaded;
      await promptOnClick(promptButton, v.remote);
      log.push(`prompt resolved:${v.remote.state}`);
      assert_equals(v.remote.state, "connecting",
                    "The state must be connecting when prompt() resolves.");

      // The order of prompt() fulfillment and the connecting event is checked
      // by prompt-resolves-before-connecting-manual.html.
      if (!eventsInLog().some(e => e.startsWith("connect:"))) {
        await waitForEvent(v.remote, "connect");
      }
      assert_array_equals(eventsInLog(),
                          ["connecting:connecting", "connect:connected"]);
    }, "Test that the onconnecting and onconnect event handlers are called when the user selects a device.");

    promise_test(async t => {
      assert_equals(v.remote.state, "connected",
                    "The device must be connected to test disconnection.");
      log.length = 0;
      document.getElementById("connect-instructions").style.display = "none";
      promptButton.style.display = "none";
      document.getElementById("disconnect-instructions").style.display =
          "block";
      disconnectButton.style.display = "inline";

      await promptOnClick(disconnectButton, v.remote);
      log.push(`prompt resolved:${v.remote.state}`);

      // When the user chooses to disconnect, the user agent queues a task to
      // fulfill the Promise before running the steps to disconnect from the
      // device, which queue a task to set the state to disconnected and fire
      // the disconnect event.
      assert_array_equals(log, ["prompt resolved:connected"],
                          "prompt() must resolve before the disconnect event " +
                          "is fired.");
      await waitForEvent(v.remote, "disconnect");
      assert_array_equals(log,
                          ["prompt resolved:connected",
                           "disconnect:disconnected"]);
      assert_equals(v.remote.state, "disconnected");
    }, "Test that prompt() resolves and then the ondisconnect event handler is called when the user disconnects using prompt().");
  </script>
</html>
