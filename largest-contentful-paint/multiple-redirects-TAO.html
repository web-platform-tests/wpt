<!DOCTYPE HTML>
<html>
<head>
<meta charset="utf-8" />
<title>This test validates some Timing-Allow-Origin header usage in multiple redirects.</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="resources/largest-contentful-paint-helpers.js"></script>
<script src="/common/get-host-info.sub.js"></script>
</head>
<img id='image'>
<body>
<script>
  setup({"hide_test_state": true});
  assert_implements(window.LargestContentfulPaint,
                    "LargestContentfulPaint is not implemented");
  let destUrl = get_host_info().HTTP_REMOTE_ORIGIN
      + '/element-timing/resources/multiple-redirects.py?';
  destUrl += 'redirect_count=2';
  // The final resource has '*' in TAO header, so will not affect the result.
  destUrl += '&final_resource=/element-timing/resources/circle-tao.svg';
  destUrl += '&origin1=' + get_host_info().UNAUTHENTICATED_ORIGIN;
  destUrl += '&origin2=' + get_host_info().HTTP_REMOTE_ORIGIN;
  const taoCombinations = [
      {tao1: location.origin, tao2: location.origin},
      {tao1: location.origin, tao2: get_host_info().HTTP_REMOTE_ORIGIN},
      {tao1: location.origin, tao2: 'null'},
      {tao1: location.origin, tao2: '*'},
      {tao1: location.origin, tao2: location.origin},
      {tao1: 'null', tao2: '*'},
      {tao1: '*', tao2: 'null'},
  ];
  const sizes = [28*28, 33*33, 40*40, 50*50, 66*66, 100*100, 200*200];
  function getURL(item) {
      return destUrl + '&tao1=' + item.tao1 + '&tao2=' + item.tao2;
  }
  const beforeLoads = [];
  function setImage(index) {
      const image = document.getElementById('image');
      const item = taoCombinations[index];
      // Capture the lower bound before the image is changed, so that
      // loadTime/renderTime are always after it.
      beforeLoads[index] = performance.now();
      image.src = getURL(item);
      // Use monotonic sizes to get all the images!
      image.width = 200 / (7 - index);
  }

  const entriesPromise = observeLCPEntries(taoCombinations.length, {id: 'image'});
  for (let i = 0; i < taoCombinations.length; i++) {
    // The timing relations are checked by the paintTime/presentationTime
    // subtest; the old 'renderTimeIs0' option was documented but never
    // implemented by the helper.
    promise_test(async () => {
      const entries = await entriesPromise;
      checkEntry(entries[i], getURL(taoCombinations[i]), 'image', sizes[i],
                 () => beforeLoads[i]);
    }, `Combination ${i}`);
  }

  // Each image is set once the previous one is observed; a new src with a
  // larger size makes every image the Largest Contentful Paint in turn.
  let observedCount = 0;
  new PerformanceObserver(entryList => {
    for (const entry of entryList.getEntries()) {
      if (entry.id !== 'image')
        continue;
      observedCount++;
      if (observedCount < taoCombinations.length)
        setImage(observedCount);
    }
  }).observe({entryTypes: ['largest-contentful-paint']});
  setImage(0);
</script>
</body>
</html>
