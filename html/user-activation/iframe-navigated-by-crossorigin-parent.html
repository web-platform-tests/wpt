<!DOCTYPE html>
<title>User activation propagation across a navigation of an iframe driven by its cross-origin parent</title>
<script src="/common/dispatcher/dispatcher.js"></script>
<script src="/common/get-host-info.sub.js"></script>
<script src="/common/utils.js"></script>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-vendor.js"></script>
<script src="/resources/testdriver-actions.js"></script>

<body>
  <iframe id="child" width="200" height="50"></iframe>
</body>

<script>
  'use strict';

  let uuid1 = token();
  let uuid2 = token();

  // Both documents the iframe shows are on the same origin, which is not the
  // origin of this page. The carry-over therefore turns only on the entry's
  // initiator being this page rather than the iframe itself.
  let remote_origin = get_host_info().HTTP_REMOTE_ORIGIN;
  let loaded = `${remote_origin}/common/dispatcher/remote-executor.html?uuid=${uuid1}`;
  let navigated_to =
        `${remote_origin}/common/dispatcher/remote-executor.html?uuid=${uuid2}`;

  const getUserActivationState = () =>
    [navigator.userActivation.isActive, navigator.userActivation.hasBeenActive];

  const populateAndGetUserActivationState = () => {
    const state = [navigator.userActivation.isActive,
                   navigator.userActivation.hasBeenActive];

    let elem = document.createElement("div");
    elem.textContent = "Dummy text to make it clickable";
    document.body.appendChild(elem);
    return state;
  };

  function assertUserActivationState(list,
        expected_transient_bit, expected_sticky_bit, msg) {
    assert_equals(list[0], expected_transient_bit, "Transient bit " + msg);
    assert_equals(list[1], expected_sticky_bit, "Sticky bit " + msg);
  }

  promise_test(async test => {
    const child = document.getElementById("child");
    const first = new RemoteContext(uuid1);
    const second = new RemoteContext(uuid2);

    // Load a cross-origin document in the iframe. The executor only answers once
    // the document has loaded, so this doubles as waiting for it.
    child.src = loaded;
    {
      const result = await first.execute_script(populateAndGetUserActivationState);
      assertUserActivationState(result, false, false, "after iframe loaded");
    }

    // Confirm that the iframe gets user activation after a click. Clicking the
    // iframe element lands the click inside the document it shows.
    await test_driver.click(child);
    {
      const result = await first.execute_script(getUserActivationState);
      assertUserActivationState(result, true, true, "after iframe clicked");
    }

    // Navigate the iframe from here, so that the entry it lands on records this
    // page as the initiator.
    child.src = navigated_to;

    // Confirm that the document the iframe navigated to does not have user
    // activation, even though it is same origin with the one that was clicked.
    {
      const result = await second.execute_script(getUserActivationState);
      assertUserActivationState(result, false, false,
            "after iframe navigated by its cross-origin parent");
    }
}, "User activation propagation across a navigation of an iframe driven by " +
   "its cross-origin parent");
</script>
