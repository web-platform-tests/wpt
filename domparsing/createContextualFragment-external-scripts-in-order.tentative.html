<!doctype html>
<meta charset="utf-8" />
<title>External scripts from createContextualFragment() execute as async once inserted</title>
<link rel="help" href="https://html.spec.whatwg.org/#prepare-the-script-element" />
<link rel="help" href="https://w3c.github.io/DOM-Parsing/#dom-range-createcontextualfragment" />
<link rel="help" href="https://github.com/whatwg/html/issues/13079" />
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
  // The fragment parser does not set force async to false on script elements
  // in Fragment scripting mode (or resets force async to true when preparing
  // them while disconnected). So before insertion script.async is true, and
  // when the fragment is inserted, external scripts without an async attribute
  // execute asynchronously.
  promise_test(async (t) => {
    window.events = [];
    const slowRan = new Promise((resolve) => { window.on_slow = resolve; });
    const fastRan = new Promise((resolve) => { window.resolve_fast = resolve; });
    t.add_cleanup(() => { delete window.on_slow; delete window.resolve_fast; });

    const range = document.createRange();
    range.selectNodeContents(document.body);
    const fragment = range.createContextualFragment(
      "<script src='resources/slow.js?pipe=trickle(d0.3)&ccf=1'></" + "script>" +
      "<script src=\"data:text/javascript,window.events.push('fast');window.resolve_fast();\"></" + "script>" +
      "<script>window.events.push('inline');</" + "script>"
    );
    assert_array_equals(window.events, [], "scripts don't run before the fragment is inserted");
    for (const script of fragment.querySelectorAll("script")) {
      assert_true(script.async, "script.async is true before insertion");
    }

    const container = document.createElement("div");
    container.append(fragment);
    document.body.append(container);
    t.add_cleanup(() => container.remove());
    assert_array_equals(window.events, ["inline"], "the inline script runs synchronously when connected");
    await Promise.all([slowRan, fastRan]);
    assert_array_equals(window.events, ["inline", "fast", "slow"],
                        "external scripts without async execute as async");
  }, "External scripts from createContextualFragment() execute as async once connected");
</script>
</body>
