<!doctype html>
<meta charset="utf-8">
<meta name="timeout" content="long">
<title>Cross-Origin Storage: HTML integration, cross-origin</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/common/utils.js"></script>
<script src="/common/get-host-info.sub.js"></script>
<script src="/common/dispatcher/dispatcher.js"></script>
<script src="../resources/helpers.js"></script>
<script src="../resources/cross-origin-helpers.js"></script>
<script src="../resources/integration-helpers.js"></script>
<body>
<script>
'use strict';

// https://github.com/WICG/cross-origin-storage#html-integration
// https://wicg.github.io/cross-origin-storage/#storing-fetched-resources
// https://wicg.github.io/cross-origin-storage/#availability-gating
//
// Cross-origin counterpart of crossoriginstorage.tentative.https.html: a
// resource declaratively stored into COS by this page (the storer) is
// reachable, via COS alone, from other origins according to the same
// origins-style scoping rules as the imperative API, and a resource scoped
// away from an origin never reaches it.
//
// Every stylesheet here is unique to the run (served by cos-resource.py), so
// none is on the Public Hash List and no earlier write of the same bytes can
// have widened its scope. Every outcome below is therefore deterministic: the
// Public Hash List gate and GREASE'ing apply only to a reader that qualifies
// through the "*" grant alone, and such a reader is refused for an unlisted
// hash. A list-scoped write is bounded by the `Cross-Origin-Storage-Allow-Origin`
// header on the stylesheet's own response.

const MARKER_ID = 'cos-remote-marker';

// Stores a unique stylesheet through a <link crossoriginstorage> on this page.
// `allow`, if given, is the stylesheet's `Cross-Origin-Storage-Allow-Origin`
// header. Returns the stylesheet's text, integrity, and COS hash.
async function storeDeclarativelyHere(t, label, crossoriginstorage, {allow} = {}) {
  const cssText = cosUniqueStylesheet(`html-xorigin-${label}`, MARKER_ID);
  const integrity = await cosSha256Integrity(cssText);
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = cosResourceUrl(cssText, 'text/css', {allow});
  link.integrity = integrity;
  link.setAttribute('crossoriginstorage', crossoriginstorage);
  const loaded = new Promise((resolve, reject) => {
    link.onload = resolve;
    link.onerror = () => reject(new Error('setup link failed to load'));
    // Fail fast if the browser dispatches neither load nor error at all, so
    // the rest of the file still runs.
    t.step_timeout(() => reject(new Error('setup link timed out with neither load nor error firing')), 5000);
  });
  t.add_cleanup(() => link.remove());
  document.head.appendChild(link);
  await loaded;
  return {cssText, integrity, hash: cosHash(await cosSha256Hex(cssText))};
}

// Runs, in a remote context, the same "second <link> with a broken href but
// the same integrity" probe used by the same-document test: success is
// only possible via COS.
async function remoteDeclarativeProbe(ctx, integrity, crossoriginstorage, markerId) {
  return ctx.execute_script(async (integrity, crossoriginstorage, markerId) => {
    // A relative path resolved against the executor's own origin: a real,
    // fast 404 (a nonexistent TLD risks a slow or hanging DNS lookup in some
    // network environments).
    const brokenUrl = './does-not-exist-' + Math.random() + '.css';
    const marker = document.createElement('span');
    marker.id = markerId;
    document.body.appendChild(marker);
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = brokenUrl;
    link.integrity = integrity;
    link.setAttribute('crossoriginstorage', crossoriginstorage);
    // No fallback timer here (storeDeclarativelyHere() can use
    // t.step_timeout()): this callback runs inside the remote executor's
    // plain page context via execute_script(), with no testharness Test
    // object in scope, and the lint tool disallows a raw timer as a
    // synchronization mechanism. A <link rel="stylesheet"> reliably fires one
    // of load/error, so this relies on that plus the test's own overall
    // timeout as the fail-fast backstop.
    const settled = new Promise((resolve) => {
      link.onload = () => resolve('loaded');
      link.onerror = () => resolve('errored');
    });
    // A <link> only starts a fetch once it is in the document; a detached one
    // fires neither load nor error, which would hang this probe forever.
    document.head.appendChild(link);
    const result = await settled;
    const color = getComputedStyle(marker).color;
    link.remove();
    marker.remove();
    return {ok: result === 'loaded', color};
  }, [integrity, crossoriginstorage, markerId]);
}

function assertServed(result, description) {
  assert_true(result.ok, `${description}: expected the <link> to load from COS`);
  assert_equals(result.color, 'rgb(1, 2, 3)', `${description}: the stylesheet applied`);
}

function assertNotServed(result, description) {
  assert_false(result.ok, `${description}: expected the <link> to fail`);
  assert_not_equals(result.color, 'rgb(1, 2, 3)', `${description}: no stylesheet applied`);
}

promise_test(async t => {
  const {integrity, hash} = await storeDeclarativelyHere(t, 'global', '*');
  const {ctx} = await cosOpenRemoteContext(cosNextCrossSiteOrigin());
  assertNotServed(await remoteDeclarativeProbe(ctx, integrity, '*', MARKER_ID),
    'a "*"-scoped <link> whose hash is not on the Public Hash List, read cross-site');
  cosAssertNotDisclosed(await cosRemoteRead(ctx, hash),
    'a cross-site getFileHandle() of the same entry');
}, 'HTML, cross-origin: a "*"-scoped <link> that is not on the Public Hash List is never served cross-site');

promise_test(async t => {
  const {integrity} = await storeDeclarativelyHere(t, 'samesite', '');
  const {ctx} = await cosOpenRemoteContext(cosNextCrossSiteOrigin());
  assertNotServed(await remoteDeclarativeProbe(ctx, integrity, '', MARKER_ID),
    'a same-site-scoped <link> read cross-site');
}, 'HTML, cross-origin: a same-site-scoped <link> is never served from COS to a cross-site origin');

promise_test(async t => {
  // The same-site baseline every entry carries applies ahead of the Public
  // Hash List gate and GREASE'ing, so the read is asserted outright.
  const {cssText, integrity, hash} = await storeDeclarativelyHere(t, 'samesite-baseline', '');
  const {ctx} = await cosOpenRemoteContext(cosNextSameSiteOrigin());
  assertServed(await remoteDeclarativeProbe(ctx, integrity, '', MARKER_ID),
    'a same-site <link> read from a same-site origin');
  cosAssertDisclosed(await cosRemoteRead(ctx, hash), cssText,
    'a same-site getFileHandle() of the same entry');
}, 'HTML, cross-origin: a same-site origin is always served a same-site-scoped <link> from COS');

promise_test(async t => {
  const origin = cosNextCrossSiteOrigin();
  const {ctx} = await cosOpenRemoteContext(origin);
  const {cssText, integrity, hash} =
    await storeDeclarativelyHere(t, 'list', origin, {allow: origin});
  assertServed(await remoteDeclarativeProbe(ctx, integrity, origin, MARKER_ID),
    'a list-scoped <link> read from a listed cross-site origin the stylesheet\'s header names');
  cosAssertDisclosed(await cosRemoteRead(ctx, hash), cssText,
    'the listed origin reads the same entry through getFileHandle()');
}, 'HTML, cross-origin: a list-scoped <link> is served to a listed cross-site origin the resource\'s header authorizes');

promise_test(async t => {
  // Without the header on the stylesheet's response, the list is dropped and
  // the entry falls back to the same-site default.
  const origin = cosNextCrossSiteOrigin();
  const {ctx} = await cosOpenRemoteContext(origin);
  const {integrity, hash} = await storeDeclarativelyHere(t, 'list-no-header', origin);
  assertNotServed(await remoteDeclarativeProbe(ctx, integrity, origin, MARKER_ID),
    'a listed cross-site origin the stylesheet does not authorize');
  cosAssertNotDisclosed(await cosRemoteRead(ctx, hash),
    'nor can it read the entry through getFileHandle()');
}, 'HTML, cross-origin: a list-scoped <link> without the resource\'s header is not served to a listed cross-site origin');
</script>
</body>
