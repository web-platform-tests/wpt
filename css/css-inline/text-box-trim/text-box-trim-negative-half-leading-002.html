<!DOCTYPE html>
<title>text-box-trim: trim-start trims negative half-leading</title>
<link rel="help" href="https://drafts.csswg.org/css-inline-3/#text-box-trim">
<link rel="help" href="https://drafts.csswg.org/css-inline-3/#text-box-edge">
<link rel="author" title="Jake Archibald" href="mailto:jarchibald@mozilla.com">
<link rel="match" href="text-box-trim-negative-half-leading-002-ref.html">
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css">
<script src="support/variant-class.js"></script>
<meta name="variant" content="?class=htb">
<meta name="variant" content="?class=vrl">
<meta name="variant" content="?class=vlr">
<meta name="assert" content="trim-start trims negative half-leading on the block-start side only, moving the block-start content edge outward to the specified metric and leaving the block-end edge alone.">
<style>
.htb { writing-mode: horizontal-tb; }
.vrl { writing-mode: vertical-rl; }
.vlr { writing-mode: vertical-lr; }
.spacer {
  background: lightgray;
  block-size: 50px;
}
.target {
  /* Ahem's ascent is 0.8em and its descent is 0.2em, so the `text` metrics
     are 1em apart. With a line-height of 0.5em the half-leading is -0.25em
     on each side. */
  font: 100px/50px Ahem;
  background: yellow;
  color: green;
  text-box-trim: trim-start;
  text-box-edge: text;
}
</style>
<div class="spacer"></div>
<div class="target">X</div>
<div class="spacer"></div>
