<!DOCTYPE html>
<title>Digital Credential static methods.</title>
<link rel="help" href="https://w3c-fedid.github.io/digital-credentials/" />
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>

<body></body>
<script type="module">
  /**
   * @see https://www.w3.org/TR/credential-management/#dom-credential-isconditionalmediationavailable
   */
  promise_test(async (t) => {
    const result = await DigitalCredential.isConditionalMediationAvailable();
    assert_equals(result, false);
  }, "check default isConditionalMediationAvailable() behavior, inherited from Credential interface.");

  /**
   * @see https://w3c-fedid.github.io/digital-credentials/#dom-digitalcredential-issue
   */
  promise_test(async (t) => {
    assert_equals(
      typeof DigitalCredential.issue,
      "function",
      "DigitalCredential.issue should be a static method."
    );
  }, "DigitalCredential.issue() static method exists.");

</script>
