<!DOCTYPE html>
<title>text-box-trim trims the first line to the larger font-size set by ::first-line, not the block's own font</title>
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css" />

<style>
.spacer {
  background: lightgray;
  block-size: 60px;
}
.small-line {
  font: 20px/2 Ahem;
  text-box: trim-start text;
  /* The test's containing block has font: 40px/2, so the strut provides a 28px
     descent on the first line (half-leading 20px + font descent 8px), which is
     14px larger than small-line's 14px descent (half-leading 10px + font descent 4px). */
  margin-bottom: 14px;
}
.big-line {
  font: 40px/2 Ahem;
}
</style>

<div class="spacer"></div>
<div class="small-line">Line1</div>
<div class="big-line">Line2</div>
<div class="spacer"></div>
