<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS Text Module Test: parsing wrap-inside with valid values</title>
<link rel="author" title="Tim Nguyen" href="https://github.com/nt1m">
<link rel="help" href="https://drafts.csswg.org/css-text-4/#wrap-inside">
<meta name="assert" content="wrap-inside supports the full grammar 'auto | avoid'.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/css/support/parsing-testcommon.js"></script>
</head>
<body>
<script>
test_valid_value("wrap-inside", "auto");
test_valid_value("wrap-inside", "avoid");

test_valid_value("wrap-inside", "AUTO", "auto");
test_valid_value("wrap-inside", "Avoid", "avoid");

test_valid_value("wrap-inside", "initial");
test_valid_value("wrap-inside", "inherit");
test_valid_value("wrap-inside", "unset");
test_valid_value("wrap-inside", "revert");
test_valid_value("wrap-inside", "revert-layer");
</script>
</body>
</html>
