<!DOCTYPE html>
<title>User activation propagation across a reload of an entry reached through a cross-origin redirection</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/browsing-the-web.html#apply-the-history-step">
<script src="/common/dispatcher/dispatcher.js"></script>
<script src="/common/get-host-info.sub.js"></script>
<script src="/common/utils.js"></script>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-vendor.js"></script>
<script src="/resources/testdriver-actions.js"></script>
<script src="resources/utils.js"></script>

<body>
  <p>Non-zero-sized body to allow clicks.</p>
</body>

<script>
  'use strict';

  let uuid1 = token();

  let origin = get_host_info().HTTP_ORIGIN;
  let remote_origin = get_host_info().HTTP_REMOTE_ORIGIN;

  let lands_on = `${origin}/common/dispatcher/remote-executor.html?uuid=${uuid1}`;
  let opened = `${remote_origin}/common/redirect.py?location=${lands_on}`;

  promise_test(async test => {
    // Open a new window through a cross-origin redirection, which the entry
    // records, and then reload and observe it. The entry ends up with the URL
    // the redirection landed on, so the reload itself follows no redirect.
    let w;
    document.body.onclick = () => {
      w = window.open(opened);
    };

    await test_driver.click(document.body);
    assert_true(!!w, "A window is opened");
    // Close the window at the end of the test, so that a later test in the same
    // session cannot click a window this one left behind.
    test.add_cleanup(() => w && w.close());

    // Check that the redirection landed on a same-origin document without user
    // activation.
    {
      const context = new RemoteContext(uuid1);
      const landed_on = await context.execute_script(() => location.origin);
      assert_equals(landed_on, origin,
            "The redirection landed on a same-origin document");

      const result = await context.execute_script(getUserActivationState);
      assertUserActivationState(result, false, false, "after window opened");
    }

    // Confirm that the new window gets user activation after a click.
    await test_driver.click(w.document.documentElement);
    {
      const context = new RemoteContext(uuid1);
      const result = await context.execute_script(getUserActivationState);
      assertUserActivationState(result, true, true, "after window clicked");
    }

    // Reload the window.
    {
      const context = new RemoteContext(uuid1);
      await context.execute_script(() => {
        executor.suspend(() => {
          location.reload();
        });
      });
    }

    // Confirm that the reloaded window kept its sticky user activation. A reload
    // is exempt from what the entry records about the redirection it was reached
    // through, and the re-fetch of the entry's own URL follows no redirect.
    {
      const context = new RemoteContext(uuid1);
      const navigationType = await context.execute_script(
            () => performance.getEntriesByType("navigation")[0].type);
      assert_equals(navigationType, "reload", "The window was reloaded");

      const result = await context.execute_script(getUserActivationState);
      assertUserActivationState(result, false, true, "after window reloaded");
    }
}, "User activation propagation across a reload of an entry reached through a cross-origin redirection");
</script>
