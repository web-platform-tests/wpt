<!doctype html>
<meta charset="utf-8">
<meta name="timeout" content="long">
<title>Cross-Origin Storage: fetch() integration in a policy-blocked context</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/common/utils.js"></script>
<script src="/common/get-host-info.sub.js"></script>
<script src="/common/dispatcher/dispatcher.js"></script>
<script src="../resources/helpers.js"></script>
<script src="../resources/cross-origin-helpers.js"></script>
<body>
<script>
'use strict';

// https://wicg.github.io/cross-origin-storage/#permissions-policy-integration
// https://github.com/WICG/cross-origin-storage#fetch-integration
// https://github.com/whatwg/fetch/issues/1954
//
// Optional: how the fetch() integration's lookup behaves in a context the
// "cross-origin-storage" policy blocks belongs to the Fetch Standard, which
// does not define the integration yet. Moved here from
// permissions-policy.tentative.https.html.

const {HTTPS_ORIGIN} = get_host_info();

promise_test(async t => {
  // The fetch integration has no exception channel of its own to reject
  // through: the request is perfectly valid, and failing it would break
  // ordinary fetching for a page that merely asked for COS and was refused.
  // The expected behavior is therefore to act as if `crossOriginStorage` had
  // been absent -- fetch from the network, never touch COS. This is an open
  // question for whatwg/fetch#1954. The spec defines only the store half:
  // "store a fetched resource in Cross-Origin Storage" returns without storing
  // when "check Cross-Origin Storage permission" is false.
  //
  // Asserting only that a blocked context fails to be rescued would pass just
  // as well in a browser that does not implement the integration at all, so
  // this test is differential: the same fetch, against the same entry, is run
  // in an allowed context and in a policy-blocked one, and the point is that
  // they differ. Both executors are same-origin with this document, which is
  // the storing origin, so the allowed one's disclosure is unconditional and
  // never GREASE'd.
  const content = cosUniqueContent('policy-blocked-fetch');
  const integrity = await cosSha256Integrity(content);
  await cosStore(content, {origins: '*'});

  const echoUrl = new URL(
      `/common/echo.py?content=${encodeURIComponent(content)}`, location.href).href;

  const probe = async (ctx) => ctx.execute_script(async (echoUrl, integrity) => {
    const out = {};
    // A URL that resolves: the fetch must succeed either way. A disallowing
    // policy must not turn an ordinary integrity-checked fetch into a failure.
    try {
      const response = await fetch(echoUrl, {integrity, crossOriginStorage: '*'});
      out.network = {ok: response.ok, text: await response.text()};
    } catch (e) {
      out.network = {ok: false, name: e.name};
    }
    // A URL that 404s: only COS can rescue this, so it is the half that must
    // differ between the two contexts.
    try {
      const response = await fetch('./does-not-exist-' + Math.random() + '.txt',
                                   {integrity, crossOriginStorage: '*'});
      out.cos = {ok: true, text: await response.text()};
    } catch (e) {
      out.cos = {ok: false, name: e.name};
    }
    return out;
  }, [echoUrl, integrity]);

  const {ctx: allowedCtx} = await cosOpenRemoteContext(HTTPS_ORIGIN, {allow: null});
  const allowed = await probe(allowedCtx);

  const {ctx: blockedCtx} = await cosOpenRemoteContext(HTTPS_ORIGIN, {
    allow: null,
    pipeHeader: 'header(Permissions-Policy,cross-origin-storage=\\(\\))',
  });
  const blocked = await probe(blockedCtx);

  assert_true(allowed.network.ok, 'the allowed context fetches the real URL');
  assert_true(blocked.network.ok,
    'a disallowing policy must not break the ordinary network fetch');
  assert_equals(blocked.network.text, content);

  assert_true(allowed.cos.ok,
    'the allowed context is served the 404 URL from COS, which is what makes the ' +
    'blocked half below meaningful');
  assert_equals(allowed.cos.text, content);

  assert_false(blocked.cos.ok,
    'with COS disallowed by policy, the same fetch must not be served from the same entry');
  assert_equals(blocked.cos.name, 'TypeError',
    'and it must fail as an ordinary integrity-checked network error, not a COS error');
}, 'a policy-blocked context runs a crossOriginStorage fetch as if the member were absent, while an allowed one is served from COS');
</script>
</body>
