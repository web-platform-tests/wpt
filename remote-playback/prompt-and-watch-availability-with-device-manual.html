<!DOCTYPE html>
<html>
  <title>
    Test that watchAvailability() runs the callback with true when a device is
    available for the user to select
  </title>
  <script src="/resources/testharness.js"></script>
  <script src="/resources/testharnessreport.js"></script>
  <script src="/common/media.js"></script>
  <script src="./utils.js"></script>
  <script>
    setup({ explicit_timeout: true });
  </script>
  <body>
    <div id="prep">
      <p>Please make sure a device for remote playback is <b>available.</b></p>
      <button id="prompt-button-prep">Show devices</button>
      <button id="start-button">Start test</button>
    </div>
    <div id="pick-device" style="display: none">
      <p>
        Once the button below is enabled, click it to prompt for a remote
        playback device and select one!
      </p>
      <p id="status">Waiting for a remote playback device to be available...</p>
      <button id="prompt-button">Pick device</button>
    </div>
  </body>
  <script src="./prepare-device.js"></script>
  <script>
    let v = document.createElement("video");
    v.src = getVideoURI("/media/movie_300");
    let promptButton = document.getElementById("prompt-button");
    // The prompt button is enabled below, once a device is available.
    promptButton.disabled = true;
    const metadataLoaded = enablePromptAfterMetadataLoaded(
        v, document.getElementById("prompt-button-prep"));

    promise_test(async t => {
      // Start watching availability once metadata has loaded, since remote
      // playback availability for the media element may depend on it.
      await metadataLoaded;

      // The callback is invoked with the current availability in a task queued
      // after the Promise returned by watchAvailability() resolves, and again
      // whenever availability changes. Wait until it reports that a device is
      // available.
      await new Promise((resolve, reject) => {
        v.remote.watchAvailability(available => {
          if (available) {
            resolve();
          }
        }).catch(reject);
      });
      document.getElementById("status").textContent =
          "A remote playback device is available.";
      promptButton.disabled = false;

      // Selecting the available device must succeed.
      await promptOnClick(promptButton, v.remote);
    }, "Test that watchAvailability() runs the callback with true when a device is available for the user to select.");
  </script>
</html>
