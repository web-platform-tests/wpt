<!DOCTYPE html>
<meta charset="utf-8">
<title>An &lt;area> used by at least one non-inert image is focusable</title>
<link rel="author" title="Ibrahim Bendebka" href="https://github.com/sb3nder">
<link rel="help" href="https://html.spec.whatwg.org/multipage/image-maps.html">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>

<img src="/images/grgr-256x256.png" usemap="#map" width="300" height="300" inert>
<img src="/images/ggrr-256x256.png" usemap="#map" width="300" height="300">
<map name="map">
  <area id="area" shape="circle" coords="75,75,75">
</map>

<script>
  test(() => {
    assert_not_equals(document.activeElement, area);
    area.focus();
    assert_not_equals(document.activeElement, area);
  }, '<area> is not focusable');
  area.blur();

  test(() => {
    assert_not_equals(document.activeElement, area);
    area.setAttribute('href', '');
    area.focus();
    assert_equals(document.activeElement, area);
  }, '<area href> is focusable');
  area.blur();
  area.removeAttribute('href');

  test(() => {
    assert_not_equals(document.activeElement, area);
    area.setAttribute('tabindex', '0');
    area.focus();
    assert_equals(document.activeElement, area);
  }, '<area tabindex=0> is focusable');
  area.blur();
  area.removeAttribute('tabindex');

  test(() => {
    assert_not_equals(document.activeElement, area);
    area.setAttribute('tabindex', '-1');
    area.focus();
    assert_equals(document.activeElement, area);
  }, '<area tabindex=-1> is focusable');
</script>
