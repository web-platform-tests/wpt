<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Anchor Positioning: 'position-anchor: match-parent' across shadow tree boundaries</title>
<link rel="help" href="https://drafts.csswg.org/css-anchor-position-1/#valdef-position-anchor-match-parent">
<link rel="help" href="https://drafts.csswg.org/css-shadow-1/#flattening">
<link rel="author" href="mailto:jeroen.zwartepoorte@gmail.com">
<link rel="match" href="position-anchor-match-parent-shadow-ref.html">
<style>
body {
  font: 12px/1.4 sans-serif;
}

.test {
  display: inline-block;
  vertical-align: top;
  width: 130px;
  margin: 0 8px 8px 0;
}

.test > p {
  margin: 2px 0 0;
}

.case {
  position: relative;
  transform: translate(0);
  box-sizing: border-box;
  width: 122px;
  height: 102px;
  border: 1px solid silver;
}

/* The anchor box is (20, 20) to (70, 40) in the case box. */
.anchor {
  position: absolute;
  anchor-name: --a;
  left: 20px;
  top: 20px;
  width: 50px;
  height: 20px;
  background: silver;
}

/* A host covers the whole case box. */
.host {
  position: fixed;
  inset: 0;
}

/* A probe ends up at (70, 40) if it has the anchor element of its case as its
   default anchor element, and at (20, 70) if it has no default anchor element
   at all. Probes that live in a shadow tree repeat these declarations in a
   style sheet of their own tree. */
.probe {
  position: fixed;
  position-anchor: match-parent;
  left: anchor(right, 20px);
  top: anchor(bottom, 70px);
  width: 20px;
  height: 20px;
  background: green;
}
</style>

<div class="test">
  <div class="case">
    <div class="anchor"></div>
    <div class="host" style="position-anchor: --a">
      <template shadowrootmode="open">
        <style>
          .probe {
            position: fixed;
            position-anchor: match-parent;
            left: anchor(right, 20px);
            top: anchor(bottom, 70px);
            width: 20px;
            height: 20px;
            background: green;
          }
        </style>
        <div class="probe"></div>
      </template>
    </div>
  </div>
  <p>Probe in a shadow tree; the host has a default anchor element.</p>
</div>

<div class="test">
  <div class="case">
    <div class="anchor"></div>
    <div class="host" style="position-anchor: none">
      <template shadowrootmode="open">
        <style>
          .probe {
            position: fixed;
            position-anchor: match-parent;
            left: anchor(right, 20px);
            top: anchor(bottom, 70px);
            width: 20px;
            height: 20px;
            background: green;
          }
        </style>
        <div class="probe"></div>
      </template>
    </div>
  </div>
  <p>Probe in a shadow tree; the host has no default anchor element.</p>
</div>

<div class="test">
  <div class="case">
    <div class="anchor"></div>
    <div class="host" style="position-anchor: --a">
      <template shadowrootmode="open">
        <style>
          slot {
            display: block;
            position: fixed;
            inset: 0;
          }
        </style>
        <slot></slot>
      </template>
      <div class="probe"></div>
    </div>
  </div>
  <p>Slotted probe; the slot has no default anchor element.</p>
</div>

<div class="test">
  <div class="case">
    <div class="anchor"></div>
    <div class="host" style="position-anchor: --a">
      <template shadowrootmode="open">
        <style>
          slot {
            display: block;
            position: fixed;
            inset: 0;
            position-anchor: match-parent;
          }
        </style>
        <slot></slot>
      </template>
      <div class="probe"></div>
    </div>
  </div>
  <p>Slotted probe; the slot itself uses 'match-parent'.</p>
</div>
