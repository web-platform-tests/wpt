<!DOCTYPE html>
<meta charset="utf-8">
<title>MutationObserver: parseEndChildList</title>
<link rel="help" href="https://dom.spec.whatwg.org/#dom-mutationobserver-observe">
<link rel="help" href="https://dom.spec.whatwg.org/#signal-parse-end">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
test(() => {
  const el = document.createElement("div");
  const mo = new MutationObserver(() => {});

  assert_throws_js(TypeError, () => {
    mo.observe(el, { parseEndChildList: true });
  }, "parseEndChildList: true without childList: true throws TypeError");

  assert_throws_js(TypeError, () => {
    mo.observe(el, { attributes: true, parseEndChildList: true });
  }, "parseEndChildList: true with attributes: true but not childList: true throws TypeError");

  assert_throws_js(TypeError, () => {
    mo.observe(el, { characterData: true, parseEndChildList: true });
  }, "parseEndChildList: true with characterData: true but not childList: true throws TypeError");

  assert_throws_js(TypeError, () => {
    mo.observe(el, { childList: false, parseEndChildList: true });
  }, "parseEndChildList: true with explicit childList: false throws TypeError");

  mo.observe(el, { childList: true, parseEndChildList: false });
  mo.observe(el, { childList: true, subtree: true, parseEndChildList: false });
  mo.observe(el, { childList: true, subtree: true, parseEndChildList: true });
  mo.observe(el, { childList: true, attributes: true, parseEndChildList: true });
  mo.disconnect();
}, "MutationObserver.observe() option validation for parseEndChildList");

promise_test(async t => {
  const iframe = document.createElement("iframe");
  t.add_cleanup(() => iframe.remove());
  document.body.appendChild(iframe);

  const doc = iframe.contentDocument;
  doc.open();
  doc.write("<div id='empty'>");
  const empty = doc.getElementById("empty");

  const deliveries = [];
  const mo = new MutationObserver(records => {
    deliveries.push({
      isParsing: empty.isParsing,
      records: records.map(r => ({
        type: r.type,
        target: r.target,
        added: r.addedNodes.length,
        removed: r.removedNodes.length,
        previousSibling: r.previousSibling,
        nextSibling: r.nextSibling,
        attributeName: r.attributeName,
        attributeNamespace: r.attributeNamespace,
        oldValue: r.oldValue,
      })),
    });
  });
  mo.observe(empty, { childList: true, parseEndChildList: true });

  doc.write("</div>");
  doc.close();
  await Promise.resolve();

  assert_equals(deliveries.length, 1, "callback invoked once at parse end");
  assert_false(deliveries[0].isParsing, "isParsing is false in callback");
  assert_equals(deliveries[0].records.length, 1);
  assert_equals(deliveries[0].records[0].type, "childList");
  assert_equals(deliveries[0].records[0].target, empty);
  assert_equals(deliveries[0].records[0].added, 0);
  assert_equals(deliveries[0].records[0].removed, 0);
  assert_equals(deliveries[0].records[0].previousSibling, null);
  assert_equals(deliveries[0].records[0].nextSibling, null);
  assert_equals(deliveries[0].records[0].attributeName, null);
  assert_equals(deliveries[0].records[0].attributeNamespace, null);
  assert_equals(deliveries[0].records[0].oldValue, null);
}, "Empty element receives empty fallback childList record at parse end");

promise_test(async t => {
  const iframe = document.createElement("iframe");
  t.add_cleanup(() => iframe.remove());
  document.body.appendChild(iframe);

  const doc = iframe.contentDocument;
  doc.open();
  doc.write("<div id='d'>");
  const d = doc.getElementById("d");

  const deliveries = [];
  const mo = new MutationObserver(records => {
    deliveries.push({
      isParsing: d.isParsing,
      added: records.flatMap(r => [...r.addedNodes].map(n => n.id)),
      emptyCount: records.filter(r => r.addedNodes.length === 0 && r.removedNodes.length === 0).length,
      lastPrevSibling: records[records.length - 1].previousSibling,
      lastNextSibling: records[records.length - 1].nextSibling,
    });
  });
  mo.observe(d, { childList: true, parseEndChildList: true });

  doc.write("<p id='p1'>1</p>");
  await Promise.resolve();
  assert_equals(deliveries.length, 1);
  assert_true(deliveries[0].isParsing, "still parsing after chunk 1");
  assert_array_equals(deliveries[0].added, ["p1"]);

  doc.write("</div>");
  doc.close();
  await Promise.resolve();
  assert_equals(deliveries.length, 2);
  assert_false(deliveries[1].isParsing, "finished parsing after chunk 2");
  assert_equals(deliveries[1].emptyCount, 1, "empty fallback record queued");
  assert_equals(deliveries[1].lastPrevSibling, doc.getElementById("p1"));
  assert_equals(deliveries[1].lastNextSibling, null);
}, "End tag in separate chunk queues empty fallback childList record");

promise_test(async t => {
  const iframe = document.createElement("iframe");
  t.add_cleanup(() => iframe.remove());
  document.body.appendChild(iframe);

  const doc = iframe.contentDocument;
  doc.open();
  doc.write("<div id='box'><?marker name='m'?></div>");
  const box = doc.getElementById("box");

  const deliveries = [];
  const mo = new MutationObserver(records => {
    deliveries.push({
      isParsing: box.isParsing,
      count: records.length,
      emptyCount: records.filter(r => r.addedNodes.length === 0 && r.removedNodes.length === 0).length,
    });
  });
  mo.observe(box, { childList: true, parseEndChildList: true });

  doc.write("<template for='m'><span>1</span>");
  await Promise.resolve();
  assert_equals(deliveries.length, 1);
  assert_true(deliveries[0].isParsing, "still parsing before </template>");

  // Remove marker before </template> so </template> itself removes no nodes
  for (const child of [...box.childNodes]) {
    if (child.nodeType === Node.PROCESSING_INSTRUCTION_NODE) child.remove();
  }
  mo.takeRecords();

  doc.write("</template>");
  doc.close();
  await Promise.resolve();
  assert_equals(deliveries.length, 2, "fallback childList record queued when <template for> finishes");
  assert_false(deliveries[1].isParsing);
  assert_equals(deliveries[1].emptyCount, 1);
}, "<template for> content patch signals parse end on insertion target");

promise_test(async t => {
  const iframe = document.createElement("iframe");
  t.add_cleanup(() => iframe.remove());
  document.body.appendChild(iframe);

  const doc = iframe.contentDocument;
  doc.open();
  doc.write("<!DOCTYPE html><html><body><template id='t'>");
  const tmpl = doc.getElementById("t");

  const records = [];
  const mo = new MutationObserver(r => records.push(...r));
  t.add_cleanup(() => mo.disconnect());
  mo.observe(doc, { childList: true, parseEndChildList: true });
  mo.observe(tmpl.content, { childList: true, parseEndChildList: true });

  doc.write("</template></body></html>");
  doc.close();
  await Promise.resolve();
  assert_equals(records.length, 0, "closing Document and <template> does not queue parseEndChildList fallback on Document or template.content");

  const t2 = document.createElement("template");
  mo.observe(t2.content, { childList: true, parseEndChildList: true });
  const writer = t2.streamAppendHTML().getWriter();
  await writer.close();
  await Promise.resolve();
  assert_equals(records.length, 0, "closing template.streamAppendHTML() does not queue parseEndChildList fallback on template.content");

  doc.open();
  doc.write("<template id='t3'><?marker name='m'?></template>");
  const t3 = doc.getElementById("t3");
  for (const child of [...t3.content.childNodes]) {
    if (child.nodeType === Node.PROCESSING_INSTRUCTION_NODE) {
      mo.observe(t3.content, { childList: true, parseEndChildList: true });
      doc.write("<template for='m'><span>x</span>");
      await Promise.resolve();
      child.remove();
      mo.takeRecords();
      doc.write("</template>");
    }
  }
  doc.close();
  await Promise.resolve();
  assert_equals(records.length, 0, "<template for> targeting plain DocumentFragment does not queue parseEndChildList fallback");
}, "parseEndChildList has no effect on Document or plain DocumentFragment targets");

promise_test(async t => {
  const iframe = document.createElement("iframe");
  t.add_cleanup(() => iframe.remove());
  document.body.appendChild(iframe);

  const doc = iframe.contentDocument;
  doc.open();
  doc.write("<div id='outer'><div id='inner'>");
  const outer = doc.getElementById("outer");
  const inner = doc.getElementById("inner");

  const deliveries = [];
  const mo = new MutationObserver(records => {
    deliveries.push(records.map(r => ({
      target: r.target.id,
      added: r.addedNodes.length,
      removed: r.removedNodes.length,
      outerParsing: outer.isParsing,
    })));
  });
  mo.observe(outer, { childList: true, subtree: true, parseEndChildList: true });

  doc.write("</div>");
  await Promise.resolve();
  assert_equals(deliveries.length, 0, "descendant closing does not queue parseEndChildList fallback");

  doc.write("<div id='inner2'><span>x</span></div>");
  await Promise.resolve();
  assert_equals(deliveries.length, 1);

  inner.appendChild(doc.createElement("em"));
  doc.write("</div>");
  doc.close();
  await Promise.resolve();
  assert_equals(deliveries.length, 2);
  assert_equals(deliveries[1].length, 2, "descendant mutation + outer parseEndChildList fallback both delivered");
  assert_equals(deliveries[1][0].target, "inner");
  assert_equals(deliveries[1][0].added, 1);
  assert_equals(deliveries[1][1].target, "outer");
  assert_equals(deliveries[1][1].added, 0);
  assert_equals(deliveries[1][1].removed, 0);
  assert_false(deliveries[1][1].outerParsing);
}, "parseEndChildList with subtree: true applies only to target, not descendants");

promise_test(async t => {

  t.add_cleanup(() => iframe.remove());
  document.body.appendChild(iframe);

  const doc = iframe.contentDocument;
  doc.open();
  doc.write("<b id='b'><span id='s'><i id='i'><p id='p'>hello");
  const b = doc.getElementById("b");
  const s = doc.getElementById("s");
  const i = doc.getElementById("i");

  const records = [];
  const mo = new MutationObserver(r => records.push(...r));
  mo.observe(b, { childList: true, parseEndChildList: true });
  mo.observe(s, { childList: true, parseEndChildList: true });
  mo.observe(i, { childList: true, parseEndChildList: true });

  doc.write("</b>");
  await Promise.resolve();

  const iRecords = records.filter(r => r.target === i);
  const sRecords = records.filter(r => r.target === s);
  const bRecords = records.filter(r => r.target === b);
  assert_equals(iRecords.length, 1, "intermediate formatting element gets only one childList record when furthestBlock is detached");
  assert_array_equals([...iRecords[0].removedNodes], [p], "i record reflects removal of p without preceding empty fallback");
  assert_equals(sRecords.length, 1, "intermediate non-formatting element gets one empty fallback record");
  assert_equals(sRecords[0].addedNodes.length, 0);
  assert_equals(sRecords[0].removedNodes.length, 0);
  assert_equals(bRecords.length, 1, "formattingElement gets one empty fallback record");
  assert_equals(bRecords[0].addedNodes.length, 0);
  doc.close();

  doc.open();
  doc.write("<b><span id='s2'><p id='p2'>hello");
  const s2 = doc.getElementById("s2");
  const p2 = doc.getElementById("p2");
  const s2Records = [];
  const mo2 = new MutationObserver(r => s2Records.push(...r));
  mo2.observe(s2, { childList: true, parseEndChildList: true });
  doc.write("</b>");
  doc.close();
  await Promise.resolve();

  assert_equals(s2Records.length, 1, "intermediate ordinary element gets only the real removal record, not a preceding empty fallback");
  assert_array_equals([...s2Records[0].removedNodes], [p2]);
}, "Adoption agency algorithm detaches furthestBlock before signaling parse end on intermediate elements");

promise_test(async t => {
  const iframe = document.createElement("iframe");
  t.add_cleanup(() => iframe.remove());
  document.body.appendChild(iframe);

  const doc = iframe.contentDocument;
  doc.open();
  doc.write("<div id='box'><?marker name='m'?></div>");
  const box = doc.getElementById("box");

  const deliveries = [];
  const mo = new MutationObserver(records => {
    deliveries.push({
      isParsing: box.isParsing,
      count: records.length,
      removedTypes: records.flatMap(r => [...r.removedNodes].map(n => n.nodeType)),
      emptyCount: records.filter(r => r.addedNodes.length === 0 && r.removedNodes.length === 0).length,
    });
  });
  mo.observe(box, { childList: true, parseEndChildList: true });

  doc.write("<template for='m'><span>1</span>");
  await Promise.resolve();
  assert_equals(deliveries.length, 1);
  assert_true(deliveries[0].isParsing);

  doc.write("</template>");
  doc.close();
  await Promise.resolve();
  assert_equals(deliveries.length, 2, "normal </template> marker removal delivers one childList batch");
  assert_false(deliveries[1].isParsing, "box is no longer parsing in marker-removal callback");
  assert_equals(deliveries[1].count, 1, "marker removal suppresses duplicate empty parseEndChildList record");
  assert_array_equals(deliveries[1].removedTypes, [Node.PROCESSING_INSTRUCTION_NODE]);
  assert_equals(deliveries[1].emptyCount, 0);
}, "Normal <template for> marker removal suppresses duplicate empty parseEndChildList record");

promise_test(async t => {

  const doc = iframe.contentDocument;
  doc.open();
  doc.write("<div id='host'><template shadowrootmode='open'><?marker name='m'?><template for='m'><span>in</span>");
  const shadow = doc.getElementById("host").shadowRoot;
  for (const child of [...shadow.childNodes]) {
    if (child.nodeType === Node.PROCESSING_INSTRUCTION_NODE) child.remove();
  }

  const deliveries = [];
  const mo = new MutationObserver(records => {
    deliveries.push({ isParsing: shadow.isParsing, count: records.length });
  });
  mo.observe(shadow, { childList: true, parseEndChildList: true });

  doc.write("</template>");
  await Promise.resolve();
  assert_equals(deliveries.length, 0, "closing inner <template for> does not signal parse end while declarative ShadowRoot is still open");
  assert_true(shadow.isParsing);

  doc.write("</template></div>");
  doc.close();
  await Promise.resolve();
  assert_equals(deliveries.length, 1, "closing outer <template shadowrootmode> signals parse end on ShadowRoot");
  assert_false(deliveries[0].isParsing);
}, "<template for> inside open declarative ShadowRoot does not prematurely signal parse end");

promise_test(async t => {
