<!DOCTYPE html>

<meta charset="utf-8">
<title>CSS-viewport test: zoom does not change outline-width initial computed value</title>
<link rel="author" title="Ibrahim Bendebka" href="https://github.com/sb3nder">
<meta name="assert"
  content="This test checks that zoom does not change the computed value of outline-width when it is at its initial value.">
<link rel="help" href="https://drafts.csswg.org/css-viewport/#zoom-property">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<style>
  .square {
    outline-color: red;

    width: 20px;
    height: 20px;
    margin: 10px;
  }

  .medium {
    outline-style: solid;
    outline-width: medium;
    outline-color: blue;
  }

  .zoomed {
    zoom: 10;
  }

  #initial1 {
    outline-style: solid;
  }

  #initial2 {
    outline-style: solid;
    outline-width: initial;
  }

  #initial3 {
    outline: solid red;
  }
</style>

<div id="ref" class="square medium"></div>
<hr>
<p>Test passes if below there are 4 squares of the <strong>same thickness</strong>.</p>
<div id="ref_zoomed" class="square medium zoomed"></div>
<div id="initial1" class="square zoomed"></div>
<div id="initial2" class="square zoomed"></div>
<div id="initial3" class="square zoomed"></div>

<script>
  const refWidth = getComputedStyle(ref).outlineWidth;
  const refWidthZoomed = getComputedStyle(ref_zoomed).outlineWidth;
  const width1 = getComputedStyle(initial1).outlineWidth;
  const width2 = getComputedStyle(initial2).outlineWidth;
  const width3 = getComputedStyle(initial3).outlineWidth;

  test(() => {
    assert_equals(width1, refWidth);
    assert_equals(width1, refWidthZoomed);
  }, 'implicit initial');
  test(() => {
    assert_equals(width2, refWidth);
    assert_equals(width2, refWidthZoomed);
  }, 'initial keyword: "outline-width: initial"');
  test(() => {
    assert_equals(width3, refWidth);
    assert_equals(width3, refWidthZoomed);
  }, 'shorthand implicit initial: "outline: solid red"');
</script>
