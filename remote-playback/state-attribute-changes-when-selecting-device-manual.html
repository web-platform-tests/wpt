<!DOCTYPE html>
<html>
  <title>
    Test that the remote playback state changes when selecting a device
  </title>
  <script src="/resources/testharness.js"></script>
  <script src="/resources/testharnessreport.js"></script>
  <script src="/common/media.js"></script>
  <script src="./utils.js"></script>
  <script>
    setup({ explicit_timeout: true });
  </script>
  <body>
    <div id="prep">
      <p>Please make sure a device for remote playback is <b>available.</b></p>
      <button id="prompt-button-prep">Show devices</button>
      <button id="start-button">Start test</button>
    </div>
    <div id="pick-device" style="display: none">
      <p>
        Click the button below to prompt for a remote playback device and select
        one!
      </p>
      <button id="prompt-button">Pick device</button>
    </div>
  </body>
  <script src="./prepare-device.js"></script>
  <script>
    let v = document.createElement("video");
    v.src = getVideoURI("/media/movie_300");
    let promptButton = document.getElementById("prompt-button");
    const metadataLoaded = enablePromptAfterMetadataLoaded(
        v, document.getElementById("prompt-button-prep"), promptButton);

    promise_test(async t => {
      assert_equals(v.remote.state, "disconnected");
      await metadataLoaded;
      // prompt() requires transient activation, so promptOnClick() calls it
      // synchronously from the click handler. Calling it from a later task
      // (such as a watchAvailability() callback) is not triggered by the user
      // gesture, and the activation may have expired by the time the task
      // runs, which causes prompt() to reject with InvalidAccessError.
      await promptOnClick(promptButton, v.remote);
      // The state is set to "connecting" in the same task that fulfills the
      // Promise returned by prompt().
      assert_equals(v.remote.state, "connecting");
    }, "Test that the remote playback state changes when selecting a device.");
  </script>
</html>
