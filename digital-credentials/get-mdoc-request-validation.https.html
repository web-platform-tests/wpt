<!doctype html>
<meta charset="utf-8" />
<meta name="timeout" content="long" />
<title>Digital Credential API: Protocol Validation (org-iso-mdoc)</title>
<link rel="help" href="https://w3c-fedid.github.io/digital-credentials/" />
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-vendor.js"></script>
<body></body>
<script type="module">
  import {
    makeGetOptions,
    makeCanonicalGetRequest,
    checkRequest,
  } from "./support/helper.js";
  import {
    cborBytes,
    cborText,
    cborArray,
    cborMap,
    cborTag,
    cborBool,
    concat,
  } from "./support/cbor.js";

  const {
    deviceRequest: CANONICAL_DEVICE_REQUEST_STR,
    encryptionInfo: CANONICAL_ENCRYPTION_INFO,
  } = makeCanonicalGetRequest("org-iso-mdoc").data;

  const buildNamespaces = (namespacesMapPairs) =>
    cborMap([
      [cborText("docType"), cborText("org.iso.18013.5.1.mDL")],
      [cborText("nameSpaces"), cborMap(namespacesMapPairs)],
    ]);

  const buildItemsRequest = (itemsMapBytes) =>
    cborTag(24, cborBytes(itemsMapBytes));

  const buildDocRequest = (itemsRequestBytes) =>
    cborMap([[cborText("itemsRequest"), itemsRequestBytes]]);

  const buildDeviceRequest = (docRequestsArray) =>
    cborMap([
      [cborText("version"), cborText("1.0")],
      [cborText("docRequests"), cborArray(docRequestsArray)],
    ]);

  const canonIsoNs = cborMap([
    [cborText("family_name"), cborBool(false)],
    [cborText("document_number"), cborBool(false)],
  ]);
  const canonNsMapPairs = [[cborText("org.iso.18013.5.1"), canonIsoNs]];
  const canonReqBytes = buildDeviceRequest([
    buildDocRequest(buildItemsRequest(buildNamespaces(canonNsMapPairs))),
  ]);

  if (
    canonReqBytes.toBase64({ alphabet: "base64url", omitPadding: true }) !==
    CANONICAL_DEVICE_REQUEST_STR
  ) {
    throw new Error(
      "support/cbor.js no longer reproduces the canonical request",
    );
  }

  promise_test(async (t) => {
    await checkRequest(
      t,
      "org-iso-mdoc",
      {
        deviceRequest: CANONICAL_DEVICE_REQUEST_STR,
        encryptionInfo: CANONICAL_ENCRYPTION_INFO,
      },
      "AbortError",
    );
  }, "the canonical request");

  promise_test(async (t) => {
    let padded = CANONICAL_DEVICE_REQUEST_STR;
    while (padded.length % 4 !== 0) padded += "=";
    await checkRequest(
      t,
      "org-iso-mdoc",
      { deviceRequest: padded, encryptionInfo: CANONICAL_ENCRYPTION_INFO },
      TypeError,
    );
  }, 'deviceRequest with base64url padding ("=")');

  promise_test(async (t) => {
    await checkRequest(
      t,
      "org-iso-mdoc",
      { deviceRequest: "A", encryptionInfo: CANONICAL_ENCRYPTION_INFO },
      TypeError,
    );
  }, 'deviceRequest "A": only allowed characters, but a length that base64url cannot decode');

  promise_test(async (t) => {
    await checkRequest(
      t,
      "org-iso-mdoc",
      {
        deviceRequest: CANONICAL_DEVICE_REQUEST_STR + " \n",
        encryptionInfo: CANONICAL_ENCRYPTION_INFO,
      },
      TypeError,
    );
  }, "deviceRequest containing whitespace");

  promise_test(async (t) => {
    const extraMap = cborMap([
      [cborText("version"), cborText("1.0")],
      [
        cborText("docRequests"),
        cborArray([
          buildDocRequest(buildItemsRequest(buildNamespaces(canonNsMapPairs))),
        ]),
      ],
      [
        cborText("unknown_entry"),
        cborBytes(new Uint8Array([0xfb, 0xff, 0xbf])),
      ],
    ]);
    const validBase64Url = extraMap.toBase64({
      alphabet: "base64url",
      omitPadding: true,
    });
    assert_true(
      validBase64Url.includes("-") || validBase64Url.includes("_"),
      "Base64url string must contain '-' or '_' for this test to be valid",
    );
    const badBase64 = validBase64Url.replace(/-/g, "+").replace(/_/g, "/");
    await checkRequest(
      t,
      "org-iso-mdoc",
      { deviceRequest: badBase64, encryptionInfo: CANONICAL_ENCRYPTION_INFO },
      TypeError,
    );
  }, 'deviceRequest using the standard base64 alphabet ("+" or "/")');

  promise_test(async (t) => {
    await checkRequest(
      t,
      "org-iso-mdoc",
      { deviceRequest: {}, encryptionInfo: CANONICAL_ENCRYPTION_INFO },
      TypeError,
    );
  }, "deviceRequest that is not a string");

  promise_test(async (t) => {
    await checkRequest(
      t,
      "org-iso-mdoc",
      { encryptionInfo: CANONICAL_ENCRYPTION_INFO },
      TypeError,
    );
  }, "a missing deviceRequest");

  promise_test(async (t) => {
    await checkRequest(
      t,
      "org-iso-mdoc",
      { deviceRequest: CANONICAL_DEVICE_REQUEST_STR },
      TypeError,
    );
  }, "encryptionInfo missing");

  promise_test(async (t) => {
    const data = Object.create({ deviceRequest: CANONICAL_DEVICE_REQUEST_STR });
    data.encryptionInfo = CANONICAL_ENCRYPTION_INFO;
    await checkRequest(t, "org-iso-mdoc", data, TypeError);
  }, "deviceRequest inherited from the prototype, not an own property");

  promise_test(async (t) => {
    const data = Object.create({ encryptionInfo: CANONICAL_ENCRYPTION_INFO });
    data.deviceRequest = CANONICAL_DEVICE_REQUEST_STR;
    await checkRequest(t, "org-iso-mdoc", data, TypeError);
  }, "encryptionInfo inherited from the prototype, not an own property");

  promise_test(async (t) => {
    await checkRequest(
      t,
      "org-iso-mdoc",
      { deviceRequest: CANONICAL_DEVICE_REQUEST_STR, encryptionInfo: 123 },
      TypeError,
    );
  }, "encryptionInfo that is not a string");

  promise_test(async (t) => {
    await checkRequest(
      t,
      "org-iso-mdoc",
      {
        deviceRequest: new Uint8Array([0xff]).toBase64({
          alphabet: "base64url",
          omitPadding: true,
        }),
        encryptionInfo: CANONICAL_ENCRYPTION_INFO,
      },
      TypeError,
    );
  }, "bytes that are not CBOR");

  promise_test(async (t) => {
    const badTextBytes = new Uint8Array([0x62, 0xc3, 0x28]);
    const badMap = cborMap([
      [cborText("version"), badTextBytes],
      [
        cborText("docRequests"),
        cborArray([
          buildDocRequest(buildItemsRequest(buildNamespaces(canonNsMapPairs))),
        ]),
      ],
    ]);
    await checkRequest(
      t,
      "org-iso-mdoc",
      {
        deviceRequest: badMap.toBase64({
          alphabet: "base64url",
          omitPadding: true,
        }),
        encryptionInfo: CANONICAL_ENCRYPTION_INFO,
      },
      TypeError,
    );
  }, "a text string in the request that is not valid UTF-8");

  promise_test(async (t) => {
    const badBytes = concat([canonReqBytes, new Uint8Array([0x00])]);
    await checkRequest(
      t,
      "org-iso-mdoc",
      {
        deviceRequest: badBytes.toBase64({
          alphabet: "base64url",
          omitPadding: true,
        }),
        encryptionInfo: CANONICAL_ENCRYPTION_INFO,
      },
      TypeError,
    );
  }, "CBOR followed by extra trailing bytes");

  promise_test(async (t) => {
    const badMap = cborArray([cborText("version"), cborText("1.0")]);
    await checkRequest(
      t,
      "org-iso-mdoc",
      {
        deviceRequest: badMap.toBase64({
          alphabet: "base64url",
          omitPadding: true,
        }),
        encryptionInfo: CANONICAL_ENCRYPTION_INFO,
      },
      TypeError,
    );
  }, "a top-level CBOR value that is an array instead of a map");

  promise_test(async (t) => {
    const badMap = cborMap([
      [cborText("version"), cborText("1.0")],
      [cborText("version"), cborText("2.0")],
      [
        cborText("docRequests"),
        cborArray([
          buildDocRequest(buildItemsRequest(buildNamespaces(canonNsMapPairs))),
        ]),
      ],
    ]);
    await checkRequest(
      t,
      "org-iso-mdoc",
      {
        deviceRequest: badMap.toBase64({
          alphabet: "base64url",
          omitPadding: true,
        }),
        encryptionInfo: CANONICAL_ENCRYPTION_INFO,
      },
      TypeError,
    );
  }, "a top-level map with a duplicate key");

  promise_test(async (t) => {
    const badNs = cborMap([
      [cborText("org.iso.18013.5.1"), canonIsoNs],
      [cborText("org.iso.18013.5.1"), canonIsoNs],
    ]);
    const req = buildDeviceRequest([
      buildDocRequest(
        buildItemsRequest(
          cborMap([
            [cborText("docType"), cborText("org.iso.18013.5.1.mDL")],
            [cborText("nameSpaces"), badNs],
          ]),
        ),
      ),
    ]).toBase64({ alphabet: "base64url", omitPadding: true });
    await checkRequest(
      t,
      "org-iso-mdoc",
      { deviceRequest: req, encryptionInfo: CANONICAL_ENCRYPTION_INFO },
      TypeError,
    );
  }, 'an inner nameSpaces map with a duplicate "org.iso.18013.5.1" key');

  promise_test(async (t) => {
    const badMap = cborMap([[cborText("version"), cborText("1.0")]]);
    await checkRequest(
      t,
      "org-iso-mdoc",
      {
        deviceRequest: badMap.toBase64({
          alphabet: "base64url",
          omitPadding: true,
        }),
        encryptionInfo: CANONICAL_ENCRYPTION_INFO,
      },
      TypeError,
    );
  }, 'a map without "docRequests"');

  promise_test(async (t) => {
    const badMap = cborMap([
      [cborText("version"), cborText("1.0")],
      [cborText("docRequests"), cborText("not an array")],
    ]);
    await checkRequest(
      t,
      "org-iso-mdoc",
      {
        deviceRequest: badMap.toBase64({
          alphabet: "base64url",
          omitPadding: true,
        }),
        encryptionInfo: CANONICAL_ENCRYPTION_INFO,
      },
      TypeError,
    );
  }, '"docRequests" that is not an array');

  promise_test(async (t) => {
    const req = buildDeviceRequest([cborText("not a map")]).toBase64({
      alphabet: "base64url",
      omitPadding: true,
    });
    await checkRequest(
      t,
      "org-iso-mdoc",
      { deviceRequest: req, encryptionInfo: CANONICAL_ENCRYPTION_INFO },
      TypeError,
    );
  }, "a document request that is a CBOR text string instead of a map");

  promise_test(async (t) => {
    const docReqNoTag = cborMap([
      [cborText("itemsRequest"), cborBytes(buildNamespaces(canonNsMapPairs))],
    ]);
    await checkRequest(
      t,
      "org-iso-mdoc",
      {
        deviceRequest: buildDeviceRequest([docReqNoTag]).toBase64({
          alphabet: "base64url",
          omitPadding: true,
        }),
        encryptionInfo: CANONICAL_ENCRYPTION_INFO,
      },
      TypeError,
    );
  }, 'an "itemsRequest" byte string without tag 24');

  promise_test(async (t) => {
    const doubleTag = cborTag(
      400,
      cborTag(24, cborBytes(buildNamespaces(canonNsMapPairs))),
    );
    const docReqDoubleTag = cborMap([[cborText("itemsRequest"), doubleTag]]);
    await checkRequest(
      t,
      "org-iso-mdoc",
      {
        deviceRequest: buildDeviceRequest([docReqDoubleTag]).toBase64({
          alphabet: "base64url",
          omitPadding: true,
        }),
        encryptionInfo: CANONICAL_ENCRYPTION_INFO,
      },
      TypeError,
    );
  }, 'an "itemsRequest" with tag 24 wrapped in a second tag');

  promise_test(async (t) => {
    const badTagContent = cborTag(24, cborBytes(new Uint8Array([0xff])));
    const docReq = cborMap([[cborText("itemsRequest"), badTagContent]]);
    await checkRequest(
      t,
      "org-iso-mdoc",
      {
        deviceRequest: buildDeviceRequest([docReq]).toBase64({
          alphabet: "base64url",
          omitPadding: true,
        }),
        encryptionInfo: CANONICAL_ENCRYPTION_INFO,
      },
      TypeError,
    );
  }, "tag-24 content that is not valid CBOR");

  promise_test(async (t) => {
    const badItemsReq = buildDocRequest(
      cborTag(24, cborBytes(cborArray([cborText("not a map")]))),
    );
    await checkRequest(
      t,
      "org-iso-mdoc",
      {
        deviceRequest: buildDeviceRequest([badItemsReq]).toBase64({
          alphabet: "base64url",
          omitPadding: true,
        }),
        encryptionInfo: CANONICAL_ENCRYPTION_INFO,
      },
      TypeError,
    );
  }, 'an "itemsRequest" whose tag-24 byte string decodes to an array instead of a map');

  promise_test(async (t) => {
    const badNsReq = buildDocRequest(
      buildItemsRequest(
        cborMap([
          [cborText("docType"), cborText("org.iso.18013.5.1.mDL")],
          [cborText("nameSpaces"), cborText("not a map")],
        ]),
      ),
    );
    await checkRequest(
      t,
      "org-iso-mdoc",
      {
        deviceRequest: buildDeviceRequest([badNsReq]).toBase64({
          alphabet: "base64url",
          omitPadding: true,
        }),
        encryptionInfo: CANONICAL_ENCRYPTION_INFO,
      },
      TypeError,
    );
  }, 'an itemsRequest whose "nameSpaces" is not a map');

  promise_test(async (t) => {
    const extraTopLevelMap = cborMap([
      [cborText("version"), cborText("1.0")],
      [
        cborText("docRequests"),
        cborArray([
          buildDocRequest(buildItemsRequest(buildNamespaces(canonNsMapPairs))),
        ]),
      ],
      [cborText("unknown_entry"), cborText("some_value")],
    ]);
    await checkRequest(
      t,
      "org-iso-mdoc",
      {
        deviceRequest: extraTopLevelMap.toBase64({
          alphabet: "base64url",
          omitPadding: true,
        }),
        encryptionInfo: CANONICAL_ENCRYPTION_INFO,
      },
      "AbortError",
    );
  }, "a request with extra, unknown top-level entries");
</script>
