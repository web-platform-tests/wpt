<!doctype html>
<meta charset="utf-8">
<title>Navigation Timing responseStart after a COOP browsing context group switch</title>
<link rel="help" href="https://w3c.github.io/navigation-timing/#dom-performancenavigationtiming-responsestart">
<link rel="help" href="https://html.spec.whatwg.org/multipage/origin.html#cross-origin-opener-policies">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/common/utils.js"></script>
<script>
const redirectTo = destination => {
  const url = new URL("/common/redirect.py", location.href);
  url.searchParams.set("location", destination);
  return url;
};

promise_test(async t => {
  const channel = new BroadcastChannel(token());
  const popup = window.open("/common/blank.html", token());
  assert_not_equals(popup, null, "Popup should be opened");

  t.add_cleanup(() => {
    channel.postMessage("close");
    channel.close();
    popup.close();
  });

  await new EventWatcher(t, popup, "load").wait_for("load");

  const finalURL = new URL("resources/coop-response-start.html", location.href);
  finalURL.searchParams.set("channel", channel.name);

  const firstRedirectURL = redirectTo(finalURL.href);
  const secondRedirectURL = redirectTo(firstRedirectURL.href);

  const messageWatcher = new EventWatcher(t, channel, "message");
  popup.location = secondRedirectURL.href;

  const { data: navigationTiming } = await messageWatcher.wait_for("message");
  assert_equals(navigationTiming.name, finalURL.href, "The popup should report the final navigation URL");
  assert_equals(navigationTiming.redirectCount, 2, "The navigation should include the two same-origin redirects");
  assert_greater_than(navigationTiming.redirectStart, 0, "redirectStart should be exposed for same-origin redirects");
  assert_greater_than(navigationTiming.fetchStart, 0, "fetchStart should not be clamped to zero");
  assert_greater_than(navigationTiming.responseStart, 0, "responseStart should not be clamped to zero after the COOP browsing context group switch");
  assert_greater_than_equal(navigationTiming.responseStart, navigationTiming.requestStart, "responseStart should be after requestStart");
  assert_greater_than_equal(navigationTiming.responseEnd, navigationTiming.responseStart, "responseEnd should be after responseStart");
}, "Navigation responseStart is not clamped to zero after a COOP browsing context group switch");
</script>
