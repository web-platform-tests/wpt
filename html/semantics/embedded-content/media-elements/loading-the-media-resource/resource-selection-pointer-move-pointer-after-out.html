<!doctype html>
<title>pointer updates (moveBefore pointerAfter out of the media element)</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<div id="log"></div>
<div id="holder"></div>
<script>
var events = [];
var a = 0;
var b = 0;
var c = 0;
var d = 0;
</script>
<video id="v"><source id="source-a" onerror="a++; events.push('a')"><source id="source-b" onerror="b++; events.push('b')" src="resources/delayed-broken-video.py?ms=500"><source id="source-c" onerror="c++; events.push('c')"><source id="source-d" onerror="d++; events.push('d')"></video>
<script>
promise_test(async function(t) {
  var video = document.getElementById('v');
  var sourceB = document.getElementById('source-b');
  assert_implements(typeof video.moveBefore == 'function', 'ParentNode.moveBefore() is required for this test');

  var loaded = new Promise(function(resolve) { window.addEventListener('load', resolve); });

  // currentSrc is set in the "process candidate" step, after the pointer has
  // advanced and before the resource fetch algorithm runs, so waiting for it is
  // how we observe that the pointer is (source-b | source-c) with source-b
  // pending. Polling rather than using an event keeps this robust whether the
  // UA runs the synchronous section at a microtask checkpoint (as specified) or
  // in a task.
  await t.step_wait(function() { return video.currentSrc == sourceB.src; },
                    'source-b selected as candidate', 3000, 5);
  assert_equals(b, 0, 'source-b is still pending when the pointer is moved');

  // Move pointerAfter out while b is pending. d should become the next candidate.
  document.getElementById('holder').moveBefore(document.getElementById('source-c'), null);

  await loaded;
  assert_equals(a, 1, 'error events on a');
  assert_equals(b, 1, 'error events on b');
  assert_equals(c, 0, 'error events on c');
  assert_equals(d, 1, 'error events on d');
  assert_array_equals(events, ['a', 'b', 'd'], 'processed source order');
});
</script>
