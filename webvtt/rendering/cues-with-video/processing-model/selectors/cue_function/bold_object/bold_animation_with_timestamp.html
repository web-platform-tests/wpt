<!DOCTYPE html>
<html class="reftest-wait">
<title>WebVTT rendering, bold object animation with timestamp, ::cue(b:past) selector</title>
<link rel="match" href="bold_animation_with_timestamp-ref.html">
<link rel="stylesheet" href="/fonts/ahem.css">
<link rel="stylesheet" href="../../../support/webvtt-test.css">
<style>
::cue(b:past) {
    animation: test 9s steps(2, start);
}
@keyframes test {
    0% {
        color: red;
    }
    100% {
        color: #0000ff;
    }
}
</style>
<script src="/common/reftest-wait.js"></script>
<video autoplay onplaying="this.onplaying = null; this.pause(); this.currentTime = 0.2; takeScreenshotDelayed(1000);">
    <source src="/media/white.webm" type="video/webm">
    <source src="/media/white.mp4" type="video/mp4">
    <track src="../../../support/bold_with_timestamp.vtt">
    <script>
    document.getElementsByTagName('track')[0].track.mode = 'showing';
    </script>
</video>
</html>
