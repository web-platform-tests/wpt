<!doctype html>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
const onloadPromise = new Promise(resolve => {
  window.addEventListener("load", () => step_timeout(resolve, 0), { once: true });
});

promise_test(async t => {
  await onloadPromise;
  const entry0 = navigation.currentEntry;
  const hash0 = location.hash;
  await navigation.navigate("#1a").finished;
  const entry1 = navigation.currentEntry;
  await navigation.navigate("#2a").finished;

  const controller = new AbortController();
  t.add_cleanup(() => controller.abort());

  const log = [];
  let navigateCount = 0;
  let secondSuccessResolve;
  let secondSuccessReject;
  const secondSuccess = new Promise((r, rej) => {
    secondSuccessResolve = r;
    secondSuccessReject = rej;
  });

  navigation.addEventListener("navigate", e => {
    const id = ++navigateCount;
    log.push(`navigate#${id}:${new URL(e.destination.url).hash}`);
    e.signal.addEventListener("abort", () => log.push(`abort#${id}`));
    e.intercept({
      handler: () => {
        log.push(`handler#${id}:${location.hash}`);
        if (id === 1) {
          return new Promise(() => {});
        }
        return new Promise(r => t.step_timeout(r, 0));
      }
    });
  }, { signal: controller.signal });

  navigation.addEventListener("currententrychange", e => {
    log.push(`currententrychange:${e.navigationType}:${location.hash}`);
  }, { signal: controller.signal });

  navigation.addEventListener("navigatesuccess", () => {
    log.push(`navigatesuccess:${location.hash}`);
    if (navigateCount === 2) {
      secondSuccessResolve();
    }
  }, { signal: controller.signal });

  navigation.addEventListener("navigateerror", e => {
    if (navigateCount === 2) {
      secondSuccessReject(e.error || new Error("navigateerror on second traversal"));
    }
  }, { signal: controller.signal });

  history.back();
  history.back();

  await secondSuccess;
  assert_equals(location.hash, hash0);
  assert_equals(navigation.currentEntry, entry0);
  assert_array_equals(log, [
    "navigate#1:#1a",
    "currententrychange:traverse:#1a",
    "handler#1:#1a",
    "abort#1",
    `navigate#2:${hash0}`,
    `currententrychange:traverse:${hash0}`,
    `handler#2:${hash0}`,
    `navigatesuccess:${hash0}`
  ]);

  controller.abort();
  await navigation.forward().finished;
  assert_equals(navigation.currentEntry, entry1);
  assert_equals(location.hash, "#1a");
}, "Back-to-back history.back() calls with intercepted traverse handlers");

promise_test(async t => {
  await onloadPromise;
  const entry0 = navigation.currentEntry;
  const hash0 = location.hash;
  await navigation.navigate("#1b").finished;
  const entry1 = navigation.currentEntry;
  await navigation.navigate("#2b").finished;

  const controller = new AbortController();
  t.add_cleanup(() => controller.abort());

  let handler1Count = 0;
  let handler2Count = 0;
  let navigateCount = 0;

  navigation.addEventListener("navigate", e => {
    const id = ++navigateCount;
    e.intercept({
      handler: () => {
        if (id === 1) {
          handler1Count++;
          return new Promise(() => {});
        }
        handler2Count++;
        return new Promise(r => t.step_timeout(r, 0));
      }
    });
  }, { signal: controller.signal });

  const r1 = navigation.traverseTo(entry1.key);
  const r2 = navigation.traverseTo(entry0.key);

  assert_equals(await r1.committed, entry1);
  await promise_rejects_dom(t, "AbortError", r1.finished);
  assert_equals(await r2.committed, entry0);
  assert_equals(await r2.finished, entry0);

  assert_equals(location.hash, hash0);
  assert_equals(navigation.currentEntry, entry0);
  assert_equals(handler1Count, 1);
  assert_equals(handler2Count, 1);
}, "Back-to-back navigation.traverseTo() calls with intercepted traverse handlers");

promise_test(async t => {
  await onloadPromise;
  const iframe = document.createElement("iframe");
  t.add_cleanup(() => iframe.remove());
  const loaded = new Promise(resolve => {
    iframe.addEventListener("load", () => t.step_timeout(resolve, 0), { once: true });
  });
  iframe.src = "/common/blank.html";
  document.body.appendChild(iframe);
  await loaded;

  const iw = iframe.contentWindow;
  const startEntry = iw.navigation.currentEntry;
  await iw.navigation.navigate("#1").finished;

  const controller = new AbortController();
  t.add_cleanup(() => controller.abort());

  let nav2Result;
  iw.navigation.addEventListener("navigate", e => {
    if (e.navigationType === "traverse") {
      e.intercept({
        handler: () => {
          nav2Result = iw.navigation.navigate("#2");
        }
      });
    }
  }, { signal: controller.signal });

  const backResult = iw.navigation.back();
  assert_equals(await backResult.committed, startEntry);
  await promise_rejects_dom(t, "AbortError", iw.DOMException, backResult.finished);
  assert_not_equals(nav2Result, undefined);
  const nav2Entry = await nav2Result.finished;

  controller.abort();
  await new Promise(r => t.step_timeout(r, 50));
  assert_equals(iw.location.hash, "#2");
  assert_equals(iw.navigation.currentEntry, nav2Entry);
  assert_true(iw.navigation.canGoBack);
  await iw.navigation.back().finished;
  assert_equals(iw.location.hash, "");
  assert_equals(iw.navigation.currentEntry, startEntry);
  await iw.navigation.forward().finished;
  assert_equals(iw.location.hash, "#2");
  assert_equals(iw.navigation.currentEntry, nav2Entry);
}, "Same-document navigation.navigate() inside iframe intercepted traverse handler");
</script>
