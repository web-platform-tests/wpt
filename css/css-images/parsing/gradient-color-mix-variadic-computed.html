<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS Images Module Level 4: computed value of gradients with color-mix() color stops of one color or more than two colors</title>
<link rel="author" title="Javier Fernández García-Boente" href="mailto:jfernandez@igalia.com">
<link rel="help" href="https://drafts.csswg.org/css-images-4/#gradients">
<link rel="help" href="https://drafts.csswg.org/css-color-5/#color-mix">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/css/support/computed-testcommon.js"></script>
<script src="/css/support/color-testcommon.js"></script>
</head>
<body>
<div id="target"></div>
<script>
const fuzzy = {comparisonFunction: set_up_fuzzy_color_test()};

test_computed_value("background-image",
    "linear-gradient(color-mix(in srgb, red, lime, blue), blue)",
    "linear-gradient(color(srgb 0.333333 0.333333 0.333333), rgb(0, 0, 255))", "", fuzzy);
test_computed_value("background-image",
    "radial-gradient(color-mix(in srgb, red, lime, blue) 10%, blue)",
    "radial-gradient(color(srgb 0.333333 0.333333 0.333333) 10%, rgb(0, 0, 255))", "", fuzzy);
test_computed_value("background-image",
    "conic-gradient(color-mix(in srgb, red 50%, lime, blue), blue)",
    "conic-gradient(color(srgb 0.5 0.25 0.25), rgb(0, 0, 255))", "", fuzzy);
test_computed_value("background-image",
    "linear-gradient(color-mix(in srgb, rgb(85 85 85)), blue)",
    "linear-gradient(color(srgb 0.333333 0.333333 0.333333), rgb(0, 0, 255))", "", fuzzy);
</script>
</body>
</html>
