<!doctype html>
<title>pointer updates (moveBefore source into an empty media element)</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<div id="log"></div>
<div id="holder"><source id="source-x"></div>
<script>
var events = [];
var b = 0;
var x = 0;
</script>
<video id="v"><source id="source-b" onerror="b++; events.push('b')" src="resources/delayed-broken-video.py?ms=500"></video>
<script>
promise_test(async function(t) {
  var video = document.getElementById('v');
  var holder = document.getElementById('holder');
  var sourceB = document.getElementById('source-b');
  assert_implements(typeof video.moveBefore == 'function', 'ParentNode.moveBefore() is required for this test');

  var loaded = new Promise(function(resolve) { window.addEventListener('load', resolve); });

  var sourceX = document.getElementById('source-x');
  sourceX.onerror = function() { x++; events.push('x'); };

  // currentSrc is set in the "process candidate" step, after the pointer has
  // advanced and before the resource fetch algorithm runs, so waiting for it is
  // how we observe that the pointer is (source-b | end of list) with source-b
  // pending. Polling rather than using an event keeps this robust whether the
  // UA runs the synchronous section at a microtask checkpoint (as specified) or
  // in a task.
  await t.step_wait(function() { return video.currentSrc == sourceB.src; },
                    'source-b selected as candidate', 3000, 5);
  assert_equals(b, 0, 'source-b is still pending when the pointer is moved');

  // Move the current candidate out so the video has no children while b is pending.
  holder.moveBefore(sourceB, null);

  // Move an existing source from another parent into the empty video.
  video.moveBefore(sourceX, null);

  await loaded;
  assert_equals(b, 1, 'error events on b');
  assert_equals(x, 1, 'error events on x');
  assert_array_equals(events, ['b', 'x'], 'processed source order');
});
</script>
