<!DOCTYPE html>
<title>IndexedDB: SharedArrayBuffer keys</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="resources/support.js"></script>
<script>
'use strict';

const key_data = [1, 2, 3, 4];

function create_object_store(t, db) {
  db.createObjectStore('store');
}

function create_shared_buffer() {
  const buffer = new SharedArrayBuffer(key_data.length);
  const view = new Uint8Array(buffer);
  view.set(key_data);
  return {buffer, view};
}

const key_cases = [
  {
    description: 'A SharedArrayBuffer',
    create_key: () => create_shared_buffer().buffer,
  },
  {
    description: 'A SharedArrayBuffer-backed view',
    create_key: () => create_shared_buffer().view,
  },
  {
    description: 'A SharedArrayBuffer in an array',
    create_key: () => [create_shared_buffer().buffer],
  },
];

test(() => {
  assert_true(
      self.crossOriginIsolated, 'The page should be cross-origin isolated');
}, 'The page is cross-origin isolated');

for (const {description, create_key} of key_cases) {
  test(() => {
    assert_throws_dom('DataError', () => {
      indexedDB.cmp(create_key(), 0);
    });
  }, `${description} cannot be compared with indexedDB.cmp()`);

  indexeddb_test(
      create_object_store,
      (t, db) => {
        // Putting a SAB-backed key in the store should throw.
        const tx = db.transaction('store', 'readwrite');
        const store = tx.objectStore('store');
        assert_throws_dom('DataError', () => {
          store.put('value', create_key());
        });
        t.done();
      },
      `${description} cannot be used as an IndexedDB key`);
}
</script>
