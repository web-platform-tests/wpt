<!DOCTYPE HTML>
<meta charset=utf-8>
<title>Largest Contentful Paint: observe cross origin images with various Timing-Allow-Origin headers</title>
<body>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="resources/largest-contentful-paint-helpers.js"></script>
<div id='my_div'></div>
<script>
  setup({"hide_test_state": true});
  assert_implements(window.LargestContentfulPaint,
                    "LargestContentfulPaint is not implemented");
  const remote_img = 'http://{{domains[www]}}:{{ports[http][1]}}/element-timing/resources/TAOImage.py?'
      + 'origin=' + window.location.origin + '&tao=';
  const valid_tao = ['wildcard', 'origin', 'multi', 'multi_wildcard', 'match_origin', 'match_wildcard'];
  const invalid_tao = ['null', 'space', 'uppercase'];
  const all_tao = valid_tao.concat(invalid_tao);
  const div = document.getElementById('my_div');

  // Set increasing size so that largest-contentful-paint captures all of them.
  // Entry urls can be truncated to 100 characters, so match on the shared
  // prefix.
  const urlPrefix = remote_img.substr(0, 100);
  const lengths = [];
  const sizes = [];
  let img_length = 20;
  for (let i = 0; i < all_tao.length; i++) {
    img_length++;
    lengths.push(img_length);
    sizes.push(img_length * img_length);
  }

  const beforeLoads = [];
  const addImage = index => {
    beforeLoads[index] = performance.now();
    appendImage(remote_img + all_tao[index], {
      id: all_tao[index],
      width: lengths[index],
      height: lengths[index],
      container: div,
    });
  };

  // The driver appends the next image whenever an entry for the previous one
  // is observed, so that every image becomes the Largest Contentful Paint.
  const entriesPromise = observeLCPEntries(all_tao.length,
      entry => entry.url.startsWith(urlPrefix));
  let observed = 0;
  new PerformanceObserver(entryList => {
    for (const entry of entryList.getEntries()) {
      if (!entry.url.startsWith(urlPrefix))
        continue;
      observed++;
      if (observed < all_tao.length)
        addImage(observed);
    }
  }).observe({type: 'largest-contentful-paint', buffered: true});

  for (let i = 0; i < all_tao.length; i++) {
    const tao = all_tao[i];
    // The old helper documented a 'renderTimeIs0' option for entries that fail
    // the TAO check, but never implemented it. The timing relations are
    // checked by the paintTime/presentationTime subtest instead.
    promise_test(async () => {
      const entries = await entriesPromise;
      checkEntry(entries[i], remote_img + tao, tao, sizes[i], () => beforeLoads[i]);
    }, `Cross-origin TAO ${tao}`);
  }

  // Add first image, the rest will be added on each observer callback.
  addImage(0);
</script>
</body>
