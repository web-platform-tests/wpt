<!DOCTYPE html>
<meta charset="utf-8">
<title>An unused &lt;area> is not focusable</title>
<link rel="author" title="Ibrahim Bendebka" href="https://github.com/sb3nder">
<link rel="help" href="https://html.spec.whatwg.org/multipage/image-maps.html">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>

<map name="map">
  <area id="area" shape="circle" coords="75,75,75">
</map>

<script>
  test(() => {
    assert_not_equals(document.activeElement, area);
    area.focus();
    assert_not_equals(document.activeElement, area);
  }, 'an unused <area> is not focusable');
  area.blur();

  test(() => {
    assert_not_equals(document.activeElement, area);
    area.setAttribute('href', '');
    area.focus();
    assert_not_equals(document.activeElement, area);
  }, 'an unused <area href> is not focusable');
  area.blur();
  area.removeAttribute('href');

  test(() => {
    assert_not_equals(document.activeElement, area);
    area.setAttribute('tabindex', '0');
    area.focus();
    assert_not_equals(document.activeElement, area);
  }, 'an unused <area tabindex=0> is not focusable');
  area.blur();
  area.removeAttribute('tabindex');

  test(() => {
    assert_not_equals(document.activeElement, area);
    area.setAttribute('tabindex', '-1');
    area.focus();
    assert_not_equals(document.activeElement, area);
  }, 'an unused <area tabindex=-1> is not focusable');
</script>
