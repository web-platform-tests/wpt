<!doctype html>
<meta charset="utf-8" />
<title>
  HTML partial updates - {append|prepend|before|after|replaceWith}HTML{Unsafe}
  with trusted types and a default policy without createParserOptions
</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/dynamic-markup-insertion.html#html-parsing-methods" />
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="resources/util.js"></script>
<meta
  http-equiv="Content-Security-Policy"
  content="require-trusted-types-for 'script';"
/>

<body>
  <script>
    trustedTypes.createPolicy("default", {
      createHTML: (html) => html,
    });
    const passthrough_policy = trustedTypes.createPolicy("passthrough", {
      createHTML: (html) => html,
      createParserOptions: (options) => options,
    });

    for (const target_type of ["Element", "ShadowRoot", "template.content"]) {
      for (const pos of ["before", "after", "replaceWith", "append", "prepend"]) {
        for (const safe of [true, false]) {
          const method_name = `${pos}HTML${safe ? "" : "Unsafe"}`;
          const variant = `${target_type}.${method_name}`;

          test((t) => {
            const { target, ref, object } =
              prepare_html_partial_update(target_type, "Element", pos, t);
            if (safe) {
              object[method_name]("<span>html;</span>");
              check_position(target, pos, ref);
            } else {
              const initial = target.innerHTML;
              assert_throws_js(TypeError, () => {
                object[method_name]("<span>html;</span>");
              });
              assert_equals(target.innerHTML, initial, "Tree should not be modified");
            }
          }, `${variant} ${safe ? "does not throw" : "throws TypeError"} with plain options and no createParserOptions in the default policy`);

          if (safe) continue;

          test((t) => {
            const { target, object } =
              prepare_html_partial_update(target_type, "Element", pos, t);
            const initial = target.innerHTML;
            assert_throws_js(TypeError, () => {
              object[method_name](passthrough_policy.createHTML("<span>html;</span>"));
            });
            assert_equals(target.innerHTML, initial, "Tree should not be modified");
          }, `${variant} throws TypeError with TrustedHTML but plain options and no createParserOptions in the default policy`);

          test((t) => {
            const { target, ref, object } =
              prepare_html_partial_update(target_type, "Element", pos, t);
            object[method_name](
              "<span>html;</span>",
              passthrough_policy.createParserOptions({}),
            );
            check_position(target, pos, ref);
          }, `${variant} does not throw when passed TrustedHTMLParserOptions`);
        }
      }
    }
  </script>
</body>
