<!doctype html>
<title>Background image-set images should be LCP candidates</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="resources/largest-contentful-paint-helpers.js"></script>
<style>
  .background {
    width: calc(100vw - 40px);
    height: calc(100vw - 40px);
    max-width: 100px;
    max-height: 100px;
    background: #eee image-set("/images/lcp-100x50.png" type("image/png")) center center no-repeat;
    background-size: cover;
  }
</style>
<body>
  <div class="background"></div>
  <p>fallback</p>

  <script>
    assert_implements(window.LargestContentfulPaint,
                      "LargestContentfulPaint is not implemented");
    const beforeLoad = performance.now();
    promise_test(async () => {
      const entry = await observeLCP(entry => entry.url.includes("lcp-100x50"));
      checkEntry(entry, window.location.origin + "/images/lcp-100x50.png", "",
                 undefined, beforeLoad, ["skipElement", "skipSize", "skipLoadTime"]);
    }, 'Background image-set images should be eligible for LCP candidates');
  </script>
</body>
