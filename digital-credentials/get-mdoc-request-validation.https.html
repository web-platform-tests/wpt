<script type="module">
  import { makeCanonicalGetRequest, checkRequest } from "./support/helper.js";

  const {
    deviceRequest: CANONICAL_DEVICE_REQUEST_STR,
    encryptionInfo: CANONICAL_ENCRYPTION_INFO,
  } = makeCanonicalGetRequest("org-iso-mdoc").data;

  promise_test(async (t) => {
    await checkRequest(
      t,
      "org-iso-mdoc",
      {
        deviceRequest: CANONICAL_DEVICE_REQUEST_STR,
        encryptionInfo: CANONICAL_ENCRYPTION_INFO,
      },
      "AbortError",
    );
  }, "the canonical request");
</script>
