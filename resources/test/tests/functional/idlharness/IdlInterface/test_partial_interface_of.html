  <p>Verify the series of sub-tests that are executed for "partial" interface objects.</p>
  <script>
    "use strict";

    // No original existence
    (() => {
      const idlArray = new IdlArray();
      idlArray.add_idls('partial interface A {};');
      idlArray.test();
    })();

    // Valid exposure (Note: Worker -> {Shared,Dedicated,Service}Worker)
    (() => {
      const idlArray = new IdlArray();
      idlArray.add_untested_idls(`
        [Exposed=(Worker)]
        interface B {};

        [Exposed=(DedicatedWorker, ServiceWorker, SharedWorker)]
        interface C {};`);
      idlArray.add_idls(`
        [Exposed=(DedicatedWorker, ServiceWorker, SharedWorker)]
        partial interface B {};

        [Exposed=(Worker)]
        partial interface C {};`);
      idlArray.merge_partials();
    })();

    // Invalid exposure
    (() => {
      const idlArray = new IdlArray();
      idlArray.add_untested_idls(`
        [Exposed=(Window, ServiceWorker)]
        interface D {};`);
      idlArray.add_idls(`
        [Exposed=(DedicatedWorker)]
        partial interface D {};`);
      idlArray.merge_partials();
    })();

    // Original is a namespace, not an interface.
    (() => {
      const idlArray = new IdlArray();
      idlArray.add_idls(`
        partial interface E {};
        namespace E {};`);
      idlArray.merge_partials();
    })();

    (() => {
      const idlArray = new IdlArray();
      idlArray.add_idls(`
        partial interface F {};
        partial interface mixin G {};
      `);
      idlArray.add_dependency_idls(`
        interface F {};
        interface mixin G {};
        interface mixin H {};
        F includes H;
        I includes H;
        J includes G;
        interface K : J {};
        interface L : F {};
      `);
      test(() => {
        // Convert idlArray.includes into a Map from name of target interface to
        // name of included mixin. (This assumes each interface includes at most
        // one mixin, otherwise later includes would clobber earlier ones.)
        const includes = new Map(idlArray.includes.map(i => [i.target, i.includes]));
        // F is tested, so H is a dep.
        assert_equals(includes.get('F'), 'H', 'F should be picked up');
        // H is not tested, so I is not a dep.
        assert_false(includes.has('I'), 'I should be ignored');
        // G is a dep, so J is a dep.
        assert_equals(includes.get('J'), 'G', 'J should be picked up');
        // K isn't a dep because J isn't defined.
        assert_false('K' in idlArray.members, 'K should be ignored');
        // L isn't a dep because F is untested.
        assert_false('L' in idlArray.members, 'L should be ignored');
      }, 'partial mixin dep implications');
    })();

    // Name clash (partials)
    (() => {
      const idlArray = new IdlArray();
      idlArray.add_idls(`
        interface M { attribute any A; };
        partial interface M { attribute any A; };`);
      idlArray.merge_partials();
    })();

    // Test filter: partials follow the interface they extend
    (() => {
      const idlArray = new IdlArray();
      idlArray.add_idls(`
        [Exposed=Window] interface N { attribute any n; };
        partial interface N { attribute any n2; };
        [Exposed=Window] interface O { attribute any o; };
        partial interface O { attribute any o; };`);
      idlArray.set_test_filter(name => name === "N");
      idlArray.merge_partials();
    })();

    // Test filter: multiple partials of an accepted interface
    (() => {
      const idlArray = new IdlArray();
      idlArray.add_idls(`
        [Exposed=Window] interface P {};
        partial interface P { attribute any p1; };
        partial interface P { attribute any p2; };`);
      idlArray.set_test_filter(name => name === "P");
      idlArray.merge_partials();
    })();

    // Test filter: complementary filters generate every test exactly once
    (() => {
      const idl = `
        [Exposed=Window] interface Q {};
        partial interface Q { attribute any q; };
        [Exposed=Window] interface R {};
        partial interface R { attribute any r; };
        [Exposed=Window] interface S {};
        partial interface S { attribute any s; };
        interface mixin T { attribute any mq; };
        interface mixin X { attribute any ms; };
        Q includes T;
        R includes T;
        S includes X;`;
      for (const filter of [name => name === "Q", name => name !== "Q"]) {
        const idlArray = new IdlArray();
        idlArray.add_idls(idl);
        idlArray.set_test_filter(filter);
        idlArray.merge_partials();
        idlArray.merge_mixins();
      }
    })();

    // Test filter: exposure is checked against the partial's own name
    (() => {
      const idlArray = new IdlArray();
      idlArray.add_untested_idls(`
        [Exposed=Window] interface V {};
        [Exposed=Window] interface W {};`);
      idlArray.add_idls(`
        [Exposed=DedicatedWorker] partial interface V {};
        [Exposed=DedicatedWorker] partial interface W {};`);
      idlArray.set_test_filter(name => name === "V");
      idlArray.merge_partials();
    })();

    // Test filter: a partial of a missing interface generates no tests
    (() => {
      const idlArray = new IdlArray();
      idlArray.add_idls('partial interface Missing { undefined f(); };');
      idlArray.set_test_filter(() => false);
      idlArray.merge_partials();
    })();

    // Name clash in an untested partial is still reported without a filter
    (() => {
      const idlArray = new IdlArray();
      idlArray.add_untested_idls(`
        interface U { attribute any a; };
        partial interface U { attribute any a; };`);
      idlArray.merge_partials();
    })();

    // Test filter: a mixin clash is attributed to the including interface
    (() => {
      const idl = `
        [Exposed=Window] interface Y {};
        interface mixin Z { attribute any m; };
        partial interface mixin Z { attribute any m2; };
        Y includes Z;`;
      for (const filter of [name => name === "Y", name => name === "Z"]) {
        const idlArray = new IdlArray();
        idlArray.add_idls(idl);
        idlArray.set_test_filter(filter);
        idlArray.merge_partials();
        idlArray.merge_mixins();
      }
    })();
  </script>
