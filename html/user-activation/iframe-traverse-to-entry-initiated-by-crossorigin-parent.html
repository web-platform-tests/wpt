<!DOCTYPE html>
<title>User activation propagation across a traversal to an iframe entry its cross-origin parent navigated to</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/browsing-the-web.html#apply-the-history-step">
<script src="/common/dispatcher/dispatcher.js"></script>
<script src="/common/get-host-info.sub.js"></script>
<script src="/common/utils.js"></script>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-vendor.js"></script>
<script src="/resources/testdriver-actions.js"></script>

<body>
  <iframe id="child" width="200" height="50"></iframe>
</body>

<script>
  'use strict';

  let uuid1 = token();
  let uuid2 = token();

  // Both documents the iframe shows are on the same origin, which is not the
  // origin of this page. The iframe's first entry was navigated to by this page
  // setting src, so that entry records a cross-origin initiator for as long as
  // it lives, and traversing back to it cannot pick up activation.
  let remote_origin = get_host_info().HTTP_REMOTE_ORIGIN;
  let loaded = `${remote_origin}/common/dispatcher/remote-executor.html?uuid=${uuid1}`;
  let navigated_to =
        `${remote_origin}/common/dispatcher/remote-executor.html?uuid=${uuid2}`;

  const getUserActivationState = () =>
    [navigator.userActivation.isActive, navigator.userActivation.hasBeenActive];

  const populateAndGetUserActivationState = () => {
    const state = [navigator.userActivation.isActive,
                   navigator.userActivation.hasBeenActive];

    let elem = document.createElement("div");
    elem.textContent = "Dummy text to make it clickable";
    document.body.appendChild(elem);
    return state;
  };

  function assertUserActivationState(list,
        expected_transient_bit, expected_sticky_bit, msg) {
    assert_equals(list[0], expected_transient_bit, "Transient bit " + msg);
    assert_equals(list[1], expected_sticky_bit, "Sticky bit " + msg);
  }

  promise_test(async test => {
    const child = document.getElementById("child");
    const first = new RemoteContext(uuid1);
    const second = new RemoteContext(uuid2);

    // Load a cross-origin document in the iframe. The executor only answers once
    // the document has loaded, so this doubles as waiting for it.
    child.src = loaded;
    {
      const result = await first.execute_script(populateAndGetUserActivationState);
      assertUserActivationState(result, false, false, "after iframe loaded");
    }

    // Let the iframe navigate itself on, so that the entry it moves to records
    // the iframe as the initiator and only the first entry records this page.
    await first.execute_script(url => {
      executor.suspend(() => {
        location.href = url;
      });
    }, [navigated_to]);

    {
      const result = await second.execute_script(populateAndGetUserActivationState);
      assertUserActivationState(result, false, false, "after iframe navigated");
    }

    // Confirm that the second document gets user activation after a click.
    await test_driver.click(child);
    {
      const result = await second.execute_script(getUserActivationState);
      assertUserActivationState(result, true, true, "after iframe clicked");
    }

    // Traverse back from here. Both entries of the joint session history hold
    // the same document for this page, so only the iframe is navigated, and
    // this test keeps running.
    history.back();

    // Confirm that the iframe's recreated first document does not have user
    // activation. It is same origin with the one that was clicked, so the only
    // thing ruling the carry-over out is the initiator its entry recorded.
    {
      const result = await first.execute_script(getUserActivationState);
      assertUserActivationState(result, false, false,
            "after traversing back to the entry the parent navigated to");
    }
}, "User activation propagation across a traversal to an iframe entry its " +
   "cross-origin parent navigated to");
</script>
