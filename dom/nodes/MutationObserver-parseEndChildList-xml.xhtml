<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<title>MutationObserver: parseEndChildList in XML parser</title>
<link rel="help" href="https://dom.spec.whatwg.org/#dom-mutationobserver-observe"/>
<link rel="help" href="https://dom.spec.whatwg.org/#signal-parse-end"/>
<link rel="help" href="https://html.spec.whatwg.org/#parsing-xhtml-documents"/>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
</head>
<body>
<div id="target"><script>
const xmlParseEvents = [];
const target = document.getElementById("target");
xmlParseEvents.push({ step: "before-end", isParsing: target.isParsing });
const mo = new MutationObserver(records => {
  xmlParseEvents.push({
    step: "mo",
    isParsing: target.isParsing,
    count: records.length,
    empty: records.length === 1 &amp;&amp; records[0].addedNodes.length === 0 &amp;&amp; records[0].removedNodes.length === 0,
  });
});
mo.observe(target, { childList: true, parseEndChildList: true });
</script></div>
<script>
promise_test(async () => {
  await Promise.resolve();
  assert_equals(xmlParseEvents.length, 2);
  assert_equals(xmlParseEvents[0].step, "before-end");
  assert_true(xmlParseEvents[0].isParsing, "isParsing is true before XML end tag");
  assert_equals(xmlParseEvents[1].step, "mo");
  assert_false(xmlParseEvents[1].isParsing, "isParsing is false in MO callback");
  assert_equals(xmlParseEvents[1].count, 1);
  assert_true(xmlParseEvents[1].empty, "empty fallback childList record queued in XML parser");
}, "isParsing and parseEndChildList work in XML parser");
</script>
</body>
</html>
