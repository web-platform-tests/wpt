<!DOCTYPE html>
<meta charset="utf-8">
<title>HTML parser pending text coalescing, flushing, MutationRecords, and children changed steps</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/parsing.html#insert-a-character">
<link rel="help" href="https://html.spec.whatwg.org/multipage/parsing.html#flush-pending-text">
<link rel="help" href="https://html.spec.whatwg.org/multipage/document-lifecycle.html#read-html">
<link rel="help" href="https://html.spec.whatwg.org/multipage/document-lifecycle.html#read-text">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/common/utils.js"></script>
<body>
<script>
"use strict";

function withIframe(t, callback) {
  const iframe = document.createElement("iframe");
  document.body.appendChild(iframe);
  t.add_cleanup(() => iframe.remove());
  return callback(iframe.contentDocument, iframe.contentWindow);
}

test(t => {
  withIframe(t, doc => {
    doc.open();
    doc.write("<!DOCTYPE html><div id='target'>");
    const target = doc.getElementById("target");
    const records = [];
    const observer = new MutationObserver(list => records.push(...list));
    observer.observe(target, {
      childList: true,
      characterData: true,
      characterDataOldValue: true,
      subtree: true,
    });

    doc.write("a&amp;b<1c&lt;d</div>");
    doc.close();
    records.push(...observer.takeRecords());
    observer.disconnect();

    assert_equals(target.childNodes.length, 1);
    assert_equals(target.firstChild.nodeType, Node.TEXT_NODE);
    assert_equals(target.firstChild.data, "a&b<1c<d");

    const childListRecords = records.filter(r => r.type === "childList");
    const charDataRecords = records.filter(r => r.type === "characterData");
    assert_equals(childListRecords.length, 1, "Expected exactly one childList record");
    assert_equals(charDataRecords.length, 0, "Expected zero characterData records for contiguous character tokens");
  });
}, "Contiguous character tokens (including character references and bogus tag-like sequences) coalesce into a single Text node without characterData MutationRecords");

test(t => {
  withIframe(t, doc => {
    doc.open();
    doc.write("<!DOCTYPE html><div id='target'>");
    const target = doc.getElementById("target");
    const records = [];
    const observer = new MutationObserver(list => records.push(...list));
    observer.observe(target, {
      childList: true,
      characterData: true,
      characterDataOldValue: true,
      subtree: true,
    });

    doc.write("first</bogus>second</bogus2>third</div>");
    doc.close();
    records.push(...observer.takeRecords());
    observer.disconnect();

    assert_equals(target.childNodes.length, 1);
    assert_equals(target.firstChild.data, "firstsecondthird");

    const childListRecords = records.filter(r => r.type === "childList");
    const charDataRecords = records.filter(r => r.type === "characterData");
    assert_equals(childListRecords.length, 1, "Expected one childList record for initial Text node");
    assert_equals(charDataRecords.length, 2, "Expected two characterData records for the two subsequent flushed runs");
    assert_equals(charDataRecords[0].target, target.firstChild);
    assert_equals(charDataRecords[0].oldValue, "first");
    assert_equals(charDataRecords[1].target, target.firstChild);
    assert_equals(charDataRecords[1].oldValue, "firstsecond");
  });
}, "Ignored end tags flush pending text and subsequent runs append via replace data (queueing one characterData MutationRecord per run)");

test(t => {

test(t => {
  const container = document.createElement("div");
  container.innerHTML = "a&amp;b</bogus>c<table>\0</table><textarea>hello</textarea>";
  assert_equals(container.firstChild.nodeType, Node.TEXT_NODE);
  assert_equals(container.firstChild.data, "a&bc");
  const table = container.querySelector("table");
  assert_equals(table.childNodes.length, 0);
  const textarea = container.querySelector("textarea");
  assert_equals(textarea.value, "hello");

  const parsedDoc = new DOMParser().parseFromString(
    "<!DOCTYPE html><div id='d'>x&amp;y</bogus>z<table>\0</table></div>",
    "text/html"
  );
  const d = parsedDoc.getElementById("d");
  assert_equals(d.firstChild.nodeType, Node.TEXT_NODE);
  assert_equals(d.firstChild.data, "x&yz");
  assert_equals(d.querySelector("table").childNodes.length, 0);
}, "Fragment parsing (innerHTML) and DOMParser.parseFromString flush pending text at EOF and coalesce text runs");

test(t => {

    const records = [];

    observer.observe(doc, {
      childList: true,
      subtree: true,
    });

    doc.write(" <!--x-->");
    doc.close();
    records.push(...observer.takeRecords());
    observer.disconnect();

    assert_equals(records.length, 2);
    assert_equals(records[0].target, doc.body);
    assert_equals(records[0].addedNodes.length, 1);
    assert_equals(records[0].addedNodes[0].nodeType, Node.TEXT_NODE);
    assert_equals(records[0].addedNodes[0].data, " ");
    assert_equals(records[1].target, doc);

    assert_equals(records[1].addedNodes[0].nodeType, Node.COMMENT_NODE);
    assert_equals(records[1].addedNodes[0].data, "x");
  });
}, "Comment appended to Document in 'after after body' flushes pending whitespace into <body> first");

    assert_equals(doc.documentElement.lastChild.data, "   ");

    const childListRecords = records.filter(r => r.type === "childList");
    const charDataRecords = records.filter(r => r.type === "characterData");
    assert_equals(childListRecords.length, 1);
    assert_equals(charDataRecords.length, 0);
  });
}, "Whitespace run in 'after after frameset' coalesces into a single Text insertion");

promise_test(async t => {

      observer.disconnect();
    }
  });

  const iframe = document.createElement("iframe");

    }, { once: true });
  });

  const chunk2 = " chunk2</div>";

  assert_equals(records.filter(r => r.type === "characterData").length, 0);

  await loadPromise;
  records.push(...observer.takeRecords());

promise_test(async t => {

  t.add_cleanup(() => fetch(`resources/chunked-response.py?action=continue&key=${key}`));

  let observer = null;
  let resolveChunk1;
  const chunk1Flushed = new Promise(resolve => {
    resolveChunk1 = resolve;
  });

  window.onAbortHtmlDoc = d => {
    doc = d;
    observer = new MutationObserver(() => {
      if (doc.getElementById("target")?.firstChild) {
        resolveChunk1();
      }
    });
    observer.observe(doc, { childList: true, subtree: true });
  };
  t.add_cleanup(() => {
    delete window.onAbortHtmlDoc;
    if (observer) {
      observer.disconnect();
    }
  });

  const iframe = document.createElement("iframe");

  const pad = "<!--" + "x".repeat(1024) + "-->";
  const chunk1 = `<!DOCTYPE html>${pad}<head><script>parent.onAbortHtmlDoc(document);<\/script></head><body><div id="target">before-abort`;
