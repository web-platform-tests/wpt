<!doctype html>
<meta charset="utf-8" />
<title>Patching should finalize at EOF</title>
<link rel="help" href="https://github.com/WICG/declarative-partial-updates" />
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
  promise_test(async (t) => {
    await new Promise((resolve) =>
      document.addEventListener("DOMContentLoaded", resolve),
    );
    const placeholder = document.querySelector("#placeholder");
    assert_equals(placeholder.textContent, "New content");
    assert_equals(placeholder.childNodes.length, 1);
  }, "EOF should finalize patching");
</script>
<section id="placeholder"><?start name="p">Old content<?end></section>
<template for="p">New content
