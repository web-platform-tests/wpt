<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Processing instructions in HTML</title>
    <script src="/resources/testharness.js"></script>
    <script src="/resources/testharnessreport.js"></script>
    <script src="/sanitizer-api/support/html5lib-testcase-support.js"></script>
    <script>
      promise_test(async () => {
        const testcases = await html5lib_testcases_from_response(fetch("resources/processing-instructions.dat"));
        testcases.forEach((testcase, index) => {
          for (const method of ["fragment", "iframe", "DOMParser"]) {
            test((t) => {
              let container;
              if (method === "fragment") {
                container = document.createElement("div");
                container.innerHTML = testcase.data;
              } else if (method === "DOMParser") {
                const parser = new DOMParser();
                const doc = parser.parseFromString(
                  `<html><body>${testcase.data}</body></html>`,
                  "text/html"
                );
                container = doc.body;
              } else if (method === "iframe") {
                const iframe = document.createElement("iframe");
                document.body.appendChild(iframe);
                iframe.contentDocument.open();
                iframe.contentDocument.write(testcase.data);
                iframe.contentDocument.close();
                container = iframe.contentDocument.body;
                t.add_cleanup(() => iframe.remove());
              }
              assert_testcase(container, testcase);
            }, `Testcase #${index}, "${testcase.data}" via ${method}`);
          }
        });
      }, "html5lib processing instruction tests");
    </script>
  </head>
  <body>
  </body>
</html>
