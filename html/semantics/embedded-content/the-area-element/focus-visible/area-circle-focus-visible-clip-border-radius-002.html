<!DOCTYPE html>
<meta charset="utf-8">
<title>Focus-visible ring matches the &lt;area> circle geometry</title>
<link rel="author" title="Ibrahim Bendebka" href="https://github.com/sb3nder">
<link rel="help" href="https://html.spec.whatwg.org/multipage/image-maps.html#image-map-processing-model">
<link rel="help" href="https://html.spec.whatwg.org/multipage/interaction.html#dom-focusoptions-focusvisible">
<link rel="match" href="reference/area-circle-clip-border-radius-ref.html">
<link rel="mismatch" href="area-circle-focus-visible-clip-border-radius-002.html?mismatch">
<style>
  #container {
    position: relative;
    width: 400px;
    height: 400px;
    background-color: gray;
  }

  svg {
    position: absolute;
    top: 0;
    left: 0;
  }

  img {
    padding: 60px;
    margin-left: -20px;
    border-radius: 140px;
  }
</style>

<div id="container">
  <img src="/images/transparent-300x300.png" usemap="#map" width="300" height="300">
  <svg id="svg" width="400" height="400">
    <path transform="translate(40,60)"
      d="M 140,0 A 100,100 0 1,1 0,140 L 0,80 A 80,80 0 0,1 80,0 Z" fill="none"
      stroke="green" stroke-width="16" />
  </svg>
</div>
<map name="map">
  <area id="area" shape="circle" coords="80,80,100" tabindex="0" href>
</map>

<script>
  if (location.search.endsWith('mismatch')) {
    container.style.zIndex = -1;
    svg.style.zIndex = -1;
  }
  area.focus({ focusVisible: true });
</script>
