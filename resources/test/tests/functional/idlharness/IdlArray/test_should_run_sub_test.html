  <script src="/resources/testharness.js"></script>

  <script src="/resources/idlharness.js"></script>

<body>
<p>Verify the series of sub-tests that are executed when shouldRunSubTest()
rejects tests.</p>
<script>
"use strict";

// Partials and mixins are merged even if shouldRunSubTest() rejects their tests
(() => {
  const originalShouldRunSubTest = self.shouldRunSubTest;
  const rejected = /^J$/;
  self.shouldRunSubTest = key => !rejected.test(key);

  const idlArray = new IdlArray();
  idlArray.add_idls(`
    [Exposed=Window] interface J { undefined base(); };
    partial interface J { undefined partialJ(); };
    partial interface J { undefined partialJ2(); };
    interface mixin P { undefined mixinJ(); };
    J includes P;
    [Exposed=Window] interface K { undefined base(); };
    partial interface K { undefined partialK(); };
    partial interface K { undefined partialK2(); };
    interface mixin Q { undefined mixinK(); };
    K includes Q;`);
  idlArray.merge_partials();
  idlArray.merge_mixins();
  self.shouldRunSubTest = originalShouldRunSubTest;

  test(() => {
    assert_array_equals(
      idlArray.members.J.members.map(m => m.name), ["base", "partialJ", "partialJ2", "mixinJ"]);
    assert_array_equals(
      idlArray.members.K.members.map(m => m.name), ["base", "partialK", "partialK2", "mixinK"]);
  }, "J and K: members are merged whether or not shouldRunSubTest() rejects the tests");
})();
</script>

{

  },
  "summarized_tests": [
