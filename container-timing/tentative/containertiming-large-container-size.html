<!DOCTYPE HTML>
<meta charset=utf-8>
<title>Container Timing: size does not overflow for large containers</title>
<style>
  html, body { margin: 0; }
  #ct { position: absolute; top: 0; left: 0; }
  /* Fills and exceeds the viewport, so the clipped painted region is the whole
     viewport (well above the ~773x773 px = 597,529 px^2 point at which a 32-bit
     app-units-squared area computation overflows). */
  #big { display: block; width: 2000px; height: 2000px; }
</style>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<div id="ct" containertiming="ct">
  <img id="big" src="/container-timing/resources/square100.png">
</div>
<script>
  async_test(function (t) {
    assert_implements(window.PerformanceContainerTiming,
      "PerformanceContainerTiming not implemented");

    let maxSize = 0;
    const observer = new PerformanceObserver(t.step_func(function (list) {
      for (const entry of list.getEntries()) {
        if (entry.identifier === 'ct') {
          maxSize = Math.max(maxSize, entry.size);
        }
      }
    }));
    observer.observe({ entryTypes: ['container'], buffered: true });

    t.step_timeout(function () {
      const viewportArea = window.innerWidth * window.innerHeight;
      assert_greater_than(maxSize, 0, "expected a container entry");
      // The painted region is clipped to the viewport, so the reported size can
      // never exceed the viewport area. A 32-bit area overflow reports a wildly
      // larger garbage value.
      assert_less_than_equal(maxSize, viewportArea,
        "size must not exceed the viewport area (overflow); got " + maxSize);
      // It should be close to the full viewport (the container covers it), which
      // also confirms the value didn't wrap to something small.
      assert_greater_than(maxSize, viewportArea / 2,
        "size should be roughly the viewport area; got " + maxSize);
      t.done();
    }, 1000);
  }, 'Container size does not overflow for large containers');
</script>
</body>
