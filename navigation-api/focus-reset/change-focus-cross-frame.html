<!doctype html>
<title>Cross-frame focus updates during intercepted navigations</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
async function createSameOriginIframe(t) {
  const iframe = document.body.appendChild(document.createElement("iframe"));
  t.add_cleanup(() => iframe.remove());
  await new Promise(resolve => {
    iframe.onload = resolve;
    iframe.src = "/common/blank.html";
  });
  return iframe;
}

promise_test(async t => {
  const iframe = await createSameOriginIframe(t);
  const childDoc = iframe.contentDocument;
  const childWin = iframe.contentWindow;
  const b1 = childDoc.body.appendChild(childDoc.createElement("button"));
  const b2 = childDoc.body.appendChild(childDoc.createElement("button"));

  b1.focus();
  assert_equals(document.activeElement, iframe);
  assert_equals(childDoc.activeElement, b1);

  let resolveIntercept;
  childWin.navigation.addEventListener("navigate", e => {
    e.intercept({
      handler: () => new Promise(resolve => { resolveIntercept = resolve; }),
      focusReset: "after-transition"
    });
  }, { once: true });

  const finished = childWin.navigation.navigate("#child-internal").finished;
  b2.focus();
  assert_equals(childDoc.activeElement, b2);

  resolveIntercept();
  await finished;
  assert_equals(document.activeElement, iframe);
  assert_equals(childDoc.activeElement, b2,
                "Focus was not reset in the navigating child iframe");
}, "Changing focus inside a navigating iframe suppresses that iframe's focus reset");

promise_test(async t => {
  const iframe = await createSameOriginIframe(t);
  const childDoc = iframe.contentDocument;
  const childWin = iframe.contentWindow;
  const childAutofocus = childDoc.body.appendChild(childDoc.createElement("button"));
  childAutofocus.autofocus = true;
  const b1 = childDoc.body.appendChild(childDoc.createElement("button"));

  b1.focus();
  assert_equals(document.activeElement, iframe);
  assert_equals(childDoc.activeElement, b1);

  let resolveIntercept;
  childWin.navigation.addEventListener("navigate", e => {
    e.intercept({
      handler: () => new Promise(resolve => { resolveIntercept = resolve; }),
      focusReset: "after-transition"
    });
  }, { once: true });

  const finished = childWin.navigation.navigate("#child-reset").finished;

  resolveIntercept();
  await finished;
  assert_equals(document.activeElement, iframe);
  assert_equals(childDoc.activeElement, childAutofocus,
                "Child iframe resets focus when focus did not change during its navigation");
}, "Navigating an iframe without changing focus resets focus inside that iframe");

promise_test(async t => {
  const parentButton1 = document.body.appendChild(document.createElement("button"));
  const parentButton2 = document.body.appendChild(document.createElement("button"));
  t.add_cleanup(() => {
    parentButton1.remove();
    parentButton2.remove();
  });

  const iframe = await createSameOriginIframe(t);
  const childDoc = iframe.contentDocument;
  const childWin = iframe.contentWindow;
  const childAutofocus = childDoc.body.appendChild(childDoc.createElement("button"));
  childAutofocus.autofocus = true;
  childAutofocus.getBoundingClientRect();

  parentButton1.focus();

  let resolveParent, resolveChild;
  navigation.addEventListener("navigate", e => {
    e.intercept({
      handler: () => new Promise(resolve => { resolveParent = resolve; }),
      focusReset: "after-transition"
    });
  }, { once: true });
  childWin.navigation.addEventListener("navigate", e => {
    e.intercept({
      handler: () => new Promise(resolve => { resolveChild = resolve; }),
      focusReset: "after-transition"
    });
  }, { once: true });

  const parentFinished = navigation.navigate("#parent-move").finished;
  const childFinished = childWin.navigation.navigate("#child-unmoved").finished;

  parentButton2.focus();

  resolveParent();
  await parentFinished;
  assert_equals(document.activeElement, parentButton2,
                "Parent focus reset was suppressed because focus changed in parent");

  resolveChild();
  await childFinished;
  assert_equals(childDoc.activeElement, childAutofocus,
                "Changing focus in the parent document did not mark the child iframe's focus as changed");
}, "Changing focus in the parent document marks only the parent document's focus as changed, not a navigating child iframe's");
</script>
</body>
