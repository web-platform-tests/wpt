<!DOCTYPE html>
<title>User activation propagation across a traversal to a cross-origin document</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/browsing-the-web.html#apply-the-history-step">
<script src="/common/dispatcher/dispatcher.js"></script>
<script src="/common/utils.js"></script>
<script src="/html/browsers/browsing-the-web/back-forward-cache/resources/helper.sub.js"></script>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-vendor.js"></script>
<script src="/resources/testdriver-actions.js"></script>

<body>
  <p>Non-zero-sized body to allow clicks.</p>
</body>

<script>
  'use strict';

  let uuid1 = token();
  let uuid2 = token();
  let uuid3 = token();

  let opened = `${originCrossSite}${executorPath}${uuid1}`;
  let navigated_to = `${originCrossSite}${executorPath}${uuid2}`;
  let navigated_on = originSameOrigin + executorPath + uuid3;

  const getUserActivationState = () =>
    [navigator.userActivation.isActive, navigator.userActivation.hasBeenActive];

  const populateWhenShown = async () => {
    await window.pageShowPromise;

    // Not sure why the first click below fails w/o this line!
    document.body.textContent = "";

    let elem = document.createElement("div");
    elem.textContent = "Dummy text to make it clickable";
    document.body.appendChild(elem);
  };

  function assertUserActivationState(list,
        expected_transient_bit, expected_sticky_bit, msg) {
    assert_equals(list[0], expected_transient_bit, "Transient bit " + msg);
    assert_equals(list[1], expected_sticky_bit, "Sticky bit " + msg);
  }

  promise_test(async test => {
    // Walk the window through two cross-origin documents and then a same-origin
    // one, click the last, and traverse back to the second. The entry the
    // traversal lands on was navigated to from the document before it, which is
    // same origin with it, and no redirect is involved, so the only thing ruling
    // the carry-over out is that the two documents the window shows across the
    // traversal are not same origin with each other.
    let w;
    document.body.onclick = () => {
      w = window.open(opened);
    };

    await test_driver.click(document.body);
    assert_true(!!w, "A window is opened");
    // Close the window at the end of the test, so that a later test in the same
    // session cannot click a window this one left behind.
    test.add_cleanup(() => w && w.close());

    const first = new RemoteContext(uuid1);
    const second = new RemoteContext(uuid2);
    const third = new RemoteContext(uuid3);

    // Navigate on to the second cross-origin document, and from there to a
    // same-origin one.
    await first.execute_script(url => {
      prepareNavigation(() => {
        location.href = url;
      });
    }, [navigated_to]);

    await second.execute_script(url => {
      prepareNavigation(() => {
        location.href = url;
      });
    }, [navigated_on]);

    // Populate the same-origin document and give it user activation, so that
    // there is something for the traversal below to carry over.
    await third.execute_script(populateWhenShown);
    await test_driver.click(w.document.body.firstElementChild);
    {
      const result = await third.execute_script(getUserActivationState);
      assertUserActivationState(result, true, true, "after window clicked");
    }

    // Traverse back to the second document.
    await third.execute_script(() => {
      prepareNavigation(() => {
        history.back();
      });
    });

    // Confirm that the cross-origin document the traversal landed on does not
    // have user activation.
    {
      const [url, state] = await second.execute_script(async () => {
        await window.pageShowPromise;
        return [location.href,
                [navigator.userActivation.isActive,
                 navigator.userActivation.hasBeenActive]];
      });
      assert_equals(new URL(url).origin, originCrossSite,
            "Traversed back to the cross-origin document");
      assertUserActivationState(state, false, false, "after traversing back");
    }
}, "User activation propagation across a traversal to a cross-origin document");
</script>
