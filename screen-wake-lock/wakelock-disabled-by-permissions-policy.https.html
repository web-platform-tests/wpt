<!DOCTYPE html>
<body>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-vendor.js"></script>
<script src="/permissions-policy/resources/permissions-policy.js"></script>
<script src="/common/get-host-info.sub.js"></script>
<script>
  "use strict";

  const same_origin_src =
    "/permissions-policy/resources/permissions-policy-screen-wakelock.html";
  const cross_origin_src =
    get_host_info().HTTPS_REMOTE_ORIGIN + same_origin_src;

  const header = 'Permissions-Policy header "screen-wake-lock=()"';

  promise_test(t => {
    return promise_rejects_dom(t, "NotAllowedError", navigator.wakeLock.request("screen"));
  }, `${header} disallows the top-level document.`);

  promise_test(t => {
    return test_feature_availability({
      feature_description: 'navigator.wakeLock.request("screen")',
      test: t,
      src: same_origin_src,
      expect_feature_available: expect_feature_unavailable_default,
      feature_name: 'screen-wake-lock',
      is_promise_test: true,
    });
  }, `${header} disallows same-origin iframes.`);

  promise_test(t => {
    return test_feature_availability({
      feature_description: 'navigator.wakeLock.request("screen")',
      test: t,
      src: cross_origin_src,
      expect_feature_available: expect_feature_unavailable_default,
      feature_name: 'screen-wake-lock',
      is_promise_test: true,
    });
  }, `${header} disallows cross-origin iframes.`);
</script>
</body>
