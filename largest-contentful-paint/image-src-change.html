<!DOCTYPE HTML>
<meta charset=utf-8>
<title>Largest Contentful Paint: src change triggers new entry.</title>

<body>
  <script src="/resources/testharness.js"></script>
  <script src="/resources/testharnessreport.js"></script>
  <script src="resources/largest-contentful-paint-helpers.js"></script>
  <img src='' id='image_id' />
  <script>
    setup({ "hide_test_state": true });
    assert_implements(window.LargestContentfulPaint,
                      "LargestContentfulPaint is not implemented");

    const first_image_src = '/images/black-rectangle.png';
    const second_image_src = '/images/blue.png';
    const image_id = 'image_id';
    const firstUrl = window.location.origin + first_image_src;
    const secondUrl = window.location.origin + second_image_src;
    const firstEntryPromise = observeLCP({url: firstUrl});
    const secondEntryPromise = observeLCP({url: secondUrl});
    let firstBeforeLoad = 0;
    let secondBeforeLoad = 0;

    const image_load_promise = image_element => {
      return new Promise(resolve => {
        image_element.addEventListener('load', resolve, {once: true});
      });
    }

    // This driver is registered before the check tests so that it runs first:
    // promise tests are queued sequentially.
    promise_test(async (t) => {
      const image_element = document.getElementById(image_id);
      firstBeforeLoad = performance.now();
      let promise = image_load_promise(image_element);
      image_element.src = first_image_src;
      await promise;
      // Wait for the first entry before changing the src: a new src replaces
      // the Largest Contentful Paint candidate and can remove the previous
      // entry from the performance buffer.
      await awaitEntry(t, firstEntryPromise,
          'Timed out waiting for the first entry');

      secondBeforeLoad = performance.now();
      promise = image_load_promise(image_element);
      image_element.src = second_image_src;
      await promise;
      await awaitEntry(t, secondEntryPromise,
          'Timed out waiting for the second entry');
    }, 'Changing the src triggers an entry for each image.');

    // black-rectangle.png is 100 x 50, blue.png is 133 x 106.
    promise_test(async () => {
      const entry = await firstEntryPromise;
      checkEntry(entry, firstUrl, image_id, 100 * 50, () => firstBeforeLoad);
    }, 'First image');
    promise_test(async () => {
      const entry = await secondEntryPromise;
      checkEntry(entry, secondUrl, image_id, 133 * 106, () => secondBeforeLoad);
    }, 'Second image');
  </script>
</body>
