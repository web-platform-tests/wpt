<!DOCTYPE html>

<meta charset="utf-8">
<title>CSS-viewport test: zoom does not change outline-width keywords computed values</title>
<link rel="author" title="Ibrahim Bendebka" href="https://github.com/sb3nder">
<meta name="assert"
  content="This test checks that zoom does not change the computed value of outline-width when it is at one of its keywords value.">
<link rel="help" href="https://drafts.csswg.org/css-viewport/#zoom-property">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<style>
  .square {
    outline-style: solid;
    outline-color: blue;

    width: 20px;
    height: 20px;
    margin: 10px;
  }

  .zoomed {
    zoom: 15;
    outline-color: red;
  }

  .thin {
    outline-width: thin;
  }

  .medium {
    outline-width: medium;
  }

  .thick {
    outline-width: thick;
  }
</style>

<div class="square thin"></div>
<div class="square medium"></div>
<div class="square thick"></div>
<hr>
<p>Test passes if below there are 3 squares that are, respectively, 15 times the thickness of the 3 squares above.</p>
<div class="square thin zoomed"></div>
<div class="square medium zoomed"></div>
<div class="square thick zoomed"></div>

<script>
  const keywords = ['thin', 'medium', 'thick'];
  for (const keyword of keywords) {
    test(() => {
      const refEl = document.querySelector(`.${keyword}`);
      const el = document.querySelector(`.${keyword}.zoomed`);
      const refWidth = parseFloat(getComputedStyle(refEl).outlineWidth);
      const width = parseFloat(getComputedStyle(el).outlineWidth);
      assert_approx_equals(width, refWidth, Math.min(1, refWidth / 2));
    }, keyword);
  }
</script>
