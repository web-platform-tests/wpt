<!doctype html>
<title>pointer updates (moveBefore processed source to the end)</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<div id="log"></div>
<div id="holder"><source id="source-s3" src="resources/delayed-broken-video.py?s3"></div>
<script>
var events = [];
var s1 = 0;
var s2 = 0;
var s3 = 0;
</script>
<video id="v"><source id="source-s1" onerror="s1++; events.push('s1')"><source id="source-s2" onerror="s2++; events.push('s2')" src="resources/delayed-broken-video.py"></video>
<script>
promise_test(async function(t) {
  var video = document.getElementById('v');
  var source1 = document.getElementById('source-s1');
  var source2 = document.getElementById('source-s2');
  var source3 = document.getElementById('source-s3');
  assert_implements(typeof video.moveBefore == 'function', 'ParentNode.moveBefore() is required for this test');

  // Once s2 has failed, the pointer is (s2 | end of list).
  await new Promise(function(resolve) { source2.addEventListener('error', resolve); });
  assert_array_equals(events, ['s1', 's2'], 'processed source order before the move');

  // Move the already processed s1 to after the pointer, so it is processed again.
  source1.src = 'resources/delayed-broken-video.py?move-processed-source-to-end';
  source3.onerror = function() { s3++; events.push('s3'); };
  var s3Error = new Promise(function(resolve) { source3.addEventListener('error', resolve); });
  video.moveBefore(source1, null);
  video.moveBefore(source3, null);

  await s3Error;
  assert_equals(s1, 2, 'error events on s1');
  assert_equals(s2, 1, 'error events on s2');
  assert_equals(s3, 1, 'error events on s3');
  assert_array_equals(events, ['s1', 's2', 's1', 's3'], 'processed source order');
});
</script>
