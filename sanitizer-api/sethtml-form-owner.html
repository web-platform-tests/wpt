<!DOCTYPE html>
<head>
<title>Form owner after the form element is replaced with its children</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
</head>
<body>
<script>
const input = '<form id="f"><input name="i"></form>';

test(t => {
  const div = document.createElement("div");
  div.setHTMLUnsafe(input);
  const form = div.firstChild;
  assert_equals(form.localName, "form");
  assert_equals(form.firstChild.form, form);
}, "Without a sanitizer, the input's form owner is the parsed form");

test(t => {
  const div = document.createElement("div");
  div.setHTMLUnsafe(input,
    { sanitizer: { replaceWithChildrenElements: ["form"] } });
  assert_equals(div.childNodes.length, 1);
  const control = div.firstChild;
  assert_equals(control.localName, "input");
  assert_equals(control.name, "i");
  assert_equals(control.form, null);
}, "With the form replaced with its children, the input has no form owner");
</script>
</body>
