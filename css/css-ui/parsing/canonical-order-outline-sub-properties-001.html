<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Basic User Interface: canonical order of outline sub-properties</title>
<link rel="author" title="Gérard Talbot" href="http://www.gtalbot.org/BrowserBugsSection/css21testsuite/">
<link rel="help" href="https://drafts.csswg.org/css-ui-4/#propdef-outline">
<link rel="help" href="https://github.com/w3c/csswg-drafts/issues/7700">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/css/support/computed-testcommon.js"></script>
<div id="target"></div>
<script>
// Specify all three nondefault components to isolate canonical order from
// shorthand default omission (https://github.com/w3c/csswg-drafts/issues/5642).
test_computed_value("outline", "4px dotted blue", "4px dotted rgb(0, 0, 255)");
test_computed_value("outline", "4px blue dotted", "4px dotted rgb(0, 0, 255)");
test_computed_value("outline", "dotted 4px blue", "4px dotted rgb(0, 0, 255)");
test_computed_value("outline", "dotted blue 4px", "4px dotted rgb(0, 0, 255)");
test_computed_value("outline", "blue 4px dotted", "4px dotted rgb(0, 0, 255)");
test_computed_value("outline", "blue dotted 4px", "4px dotted rgb(0, 0, 255)");
</script>
