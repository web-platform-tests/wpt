<!DOCTYPE html>
<meta charset="utf-8">
<title>An &lt;area> used by an hidden image is not focusable</title>
<link rel="author" title="Ibrahim Bendebka" href="https://github.com/sb3nder">
<link rel="help" href="https://html.spec.whatwg.org/multipage/image-maps.html">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>

<img src="/images/grgr-256x256.png" usemap="#map" width="300" height="300" hidden>
<map name="map">
  <area id="area" shape="circle" coords="75,75,75">
</map>

<script>
  test(() => {
    assert_not_equals(document.activeElement, area);
    area.focus();
    assert_not_equals(document.activeElement, area);
  }, 'an <area> used by hidden image is not focusable');
  area.blur();

  test(() => {
    assert_not_equals(document.activeElement, area);
    area.setAttribute('href', '');
    area.focus();
    assert_not_equals(document.activeElement, area);
  }, 'an <area href> used by hidden image is not focusable');
  area.blur();
  area.removeAttribute('href');

  test(() => {
    assert_not_equals(document.activeElement, area);
    area.setAttribute('tabindex', '0');
    area.focus();
    assert_not_equals(document.activeElement, area);
  }, 'an <area tabindex=0> used by hidden image is not focusable');
  area.blur();
  area.removeAttribute('tabindex');

  test(() => {
    assert_not_equals(document.activeElement, area);
    area.setAttribute('tabindex', '-1');
    area.focus();
    assert_not_equals(document.activeElement, area);
  }, 'an <area tabindex=-1> used by hidden image is not focusable');
</script>
