<!doctype html>
<meta charset="utf-8" />
<title>Resized Image Is Not Reconsidered as LCP.</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="resources/largest-contentful-paint-helpers.js"></script>

<body>
  <img src="/images/lcp-256x256.png" id="testpic" height="100" width="50" />
  <script>
    promise_test(async (t) => {
      const entriesPromise = collectLCPEntries(
          t, {filter: {id: "testpic"}, settleMs: 1000});
      // Resize the image once the initial entry has been observed.
      observeLCP({id: "testpic"}).then(() => {
        document.getElementById("testpic").height = 150;
      });

      const entries = await entriesPromise;
      // The image must not be reconsidered as LCP: it's still the same entry,
      // reflecting the initial size with width and height from the img tag.
      assert_equals(entries.length, 1);
      assert_equals(entries[0].id, "testpic");
      assert_equals(entries[0].size, 100 * 50);
    }, "Resized image should not be reconsidered as LCP");
  </script>
</body>
</html>
