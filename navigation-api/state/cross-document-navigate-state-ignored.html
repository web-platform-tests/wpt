<!doctype html>
<link rel="help" href="https://html.spec.whatwg.org/multipage/nav-history-apis.html#dom-navigation-navigate">
<link rel="help" href="https://github.com/web-platform-tests/interop/issues/1441">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<meta name="variant" content="?history=push">
<meta name="variant" content="?history=replace">

<iframe id="i" src="/common/blank.html"></iframe>
<script>
promise_test(async t => {
  await new Promise(resolve => window.onload = resolve);
  const history = new URLSearchParams(location.search).get("history");
  const iframe = document.getElementById("i");

  let destinationState;
  iframe.contentWindow.navigation.onnavigate = t.step_func(e => {
    assert_false(e.destination.sameDocument);
    destinationState = e.destination.getState();
  });
  iframe.contentWindow.navigation.navigate("/common/blank.html?1", { history, state: { key: "value" } });
  await new Promise(resolve => iframe.onload = resolve);

  assert_equals(destinationState?.key, "value", "destination.getState()");
  assert_equals(iframe.contentWindow.location.search, "?1");
  assert_equals(iframe.contentWindow.navigation.currentEntry.getState(), undefined, "currentEntry.getState()");
  assert_equals(iframe.contentWindow.navigation.activation.entry.getState(), undefined, "activation.entry.getState()");
}, "navigate() state is ignored for cross-document navigations");
</script>
