<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Test Reference</title>
<link rel="author" href="mailto:jeroen.zwartepoorte@gmail.com">
<style>
body {
  font: 12px/1.4 sans-serif;
}

.test {
  display: inline-block;
  vertical-align: top;
  width: 130px;
  margin: 0 8px 8px 0;
}

.test > p {
  margin: 2px 0 0;
}

.case {
  position: relative;
  transform: translate(0);
  box-sizing: border-box;
  width: 122px;
  height: 102px;
  border: 1px solid silver;
}

/* The anchor box is (20, 20) to (70, 40) in the case box. */
.anchor {
  position: absolute;
  anchor-name: --a;
  left: 20px;
  top: 20px;
  width: 50px;
  height: 20px;
  background: silver;
}

.parent {
  position: fixed;
  inset: 0;
}

/* Each probe names its default anchor element directly instead of inheriting
   it from its parent with 'match-parent'. */
.probe {
  position: fixed;
  position-anchor: none;
  left: anchor(right, 20px);
  top: anchor(bottom, 70px);
  width: 20px;
  height: 20px;
  background: green;
}
</style>

<div class="test">
  <div class="case">
    <div class="anchor"></div>
    <div class="parent" style="position-anchor: --a">
      <div class="probe" style="position-anchor: --a"></div>
    </div>
  </div>
  <p>Parent gains a default anchor element.</p>
</div>

<div class="test">
  <div class="case">
    <div class="anchor"></div>
    <div class="parent" style="position-anchor: none">
      <div class="probe"></div>
    </div>
  </div>
  <p>Parent loses its default anchor element.</p>
</div>
