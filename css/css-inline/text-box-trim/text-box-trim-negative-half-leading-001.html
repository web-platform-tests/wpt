<!DOCTYPE html>
<title>text-box-trim: trim-both trims negative half-leading</title>
<link rel="help" href="https://drafts.csswg.org/css-inline-3/#text-box-trim">
<link rel="help" href="https://drafts.csswg.org/css-inline-3/#text-box-edge">
<link rel="author" title="Jake Archibald" href="mailto:jarchibald@mozilla.com">
<link rel="match" href="text-box-trim-negative-half-leading-001-ref.html">
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css">
<script src="support/variant-class.js"></script>
<meta name="variant" content="?class=htb,text">
<meta name="variant" content="?class=htb,auto">
<meta name="variant" content="?class=vrl,text">
<meta name="variant" content="?class=vlr,text">
<meta name="assert" content="When line-height is smaller than the text-box-edge metrics, the half-leading is negative, and trim-both trims it just like positive half-leading: the content edges move outward to the specified metric, increasing the logical height of the box.">
<style>
.htb { writing-mode: horizontal-tb; }
.vrl { writing-mode: vertical-rl; }
.vlr { writing-mode: vertical-lr; }
.spacer {
  background: lightgray;
  block-size: 50px;
}
.target {
  /* Ahem's ascent is 0.8em and its descent is 0.2em, so the `text` metrics
     are 1em apart. With a line-height of 0.5em the half-leading is -0.25em
     on each side. */
  font: 100px/50px Ahem;
  background: yellow;
  color: green;
  text-box-trim: trim-both;
}
.text .target { text-box-edge: text; }
.auto .target { text-box-edge: auto; }
</style>
<div class="spacer"></div>
<div class="target">X</div>
<div class="spacer"></div>
