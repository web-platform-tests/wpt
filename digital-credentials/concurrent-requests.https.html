<!doctype html>
<meta charset="utf-8" />
<title>Digital Credential concurrent request rejection tests</title>
<link rel="help" href="https://w3c-fedid.github.io/digital-credentials/" />
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js?feature=bidi"></script>
<script src="/resources/testdriver-vendor.js"></script>

<body></body>
<script type="module">
  import { makeGetOptions } from "./support/helper.js";

  promise_test(async (t) => {
    // Park the first request ("wait") so the second hits the concurrency guard.
    await test_driver.set_virtual_wallet_behavior("wait");
    t.add_cleanup(() => test_driver.set_virtual_wallet_behavior("clear"));

    const abortController = new AbortController();
    const firstOptions = makeGetOptions({ signal: abortController.signal });
    const secondOptions = makeGetOptions();

    await test_driver.bless("user activation for first request");
    const firstRequest = navigator.credentials.get(firstOptions);

    // Use bless's action callback so the second get() is called within
    // the same microtask as activation grant. This prevents the first
    // request's IPC response from completing (clearing the pending state
    // in the browser process) before the second call is dispatched.
    let secondRequest;
    await test_driver.bless("user activation for second request", () => {
      assert_true(navigator.userActivation.isActive);
      secondRequest = navigator.credentials.get(secondOptions);
    });

    await promise_rejects_dom(
      t,
      "NotAllowedError",
      secondRequest,
      "Second concurrent request should be rejected with NotAllowedError",
    );

    abortController.abort();
    await promise_rejects_dom(
      t,
      "AbortError",
      firstRequest,
      "First request should be aborted",
    );
  }, "A second get() call while another is pending should reject with NotAllowedError.");

  promise_test(async (t) => {
    // The concurrency rejection must be queued as a global task on the DOM
    // manipulation task source (per "prepare credential requests"), not settled
    // synchronously. A synchronous rejection would settle the promise within
    // the get() call, scheduling its rejection reaction ahead of a microtask
    // queued in the same tick; a task-queued rejection lets the microtask run
    // first.
    await test_driver.set_virtual_wallet_behavior("wait");
    t.add_cleanup(() => test_driver.set_virtual_wallet_behavior("clear"));

    const abortController = new AbortController();
    await test_driver.bless("user activation for first request");
    const firstRequest = navigator.credentials.get(
      makeGetOptions({ signal: abortController.signal }),
    );

    const order = [];
    let secondRequest;
    await test_driver.bless("user activation for second request", () => {
      secondRequest = navigator.credentials.get(makeGetOptions());
      secondRequest.catch(() => order.push("rejection"));
      Promise.resolve().then(() => order.push("microtask"));
    });

    await promise_rejects_dom(t, "NotAllowedError", secondRequest);
    assert_array_equals(
      order,
      ["microtask", "rejection"],
      "The concurrent-request rejection must be queued as a task, not settled synchronously.",
    );

    abortController.abort();
    await promise_rejects_dom(t, "AbortError", firstRequest);
  }, "A concurrent get() rejection is queued on the DOM manipulation task source, not settled synchronously.");

  promise_test(async (t) => {
    // A pending request whose document is destroyed must return the coordinator
    // to the idle interaction state. If it does not, every later request on this
    // page rejects with NotAllowedError for the lifetime of the page.
    await test_driver.set_virtual_wallet_behavior("wait");
    t.add_cleanup(() => test_driver.set_virtual_wallet_behavior("clear"));

    const iframe = document.createElement("iframe");
    await new Promise((resolve) => {
      iframe.addEventListener("load", resolve, { once: true });
      iframe.src = "about:blank";
      document.body.appendChild(iframe);
    });

    await test_driver.bless(
      "user activation for subframe request",
      null,
      iframe.contentWindow,
    );
    const subframeRequest =
      iframe.contentWindow.navigator.credentials.get(makeGetOptions());
    subframeRequest.catch(() => {});
    iframe.remove();

    const responseData = "served-after-teardown";
    await test_driver.set_virtual_wallet_behavior("respond", "org-iso-mdoc", {
      value: responseData,
    });
    await test_driver.bless("user activation for top-level request");
    const credential = await navigator.credentials.get(
      makeGetOptions({ protocol: "org-iso-mdoc" }),
    );

    assert_equals(
      credential.data.value,
      responseData,
      "A request made after the previous requester's document was destroyed must be served, not rejected as concurrent.",
    );
  }, "Destroying the requesting document returns the coordinator to the idle interaction state.");

  // Additional test: Concurrent create() calls
  promise_test(async (t) => {
    await test_driver.set_virtual_wallet_behavior("wait");
    t.add_cleanup(() => test_driver.set_virtual_wallet_behavior("clear"));

    const abortController = new AbortController();
    const firstOptions = { signal: abortController.signal };
    const secondOptions = {};

    await test_driver.bless("user activation for first create request");
    const firstRequest = navigator.credentials.create(firstOptions);

    let secondRequest;
    await test_driver.bless("user activation for second create request", () => {
      assert_true(navigator.userActivation.isActive);
      secondRequest = navigator.credentials.create(secondOptions);
    });

    await promise_rejects_dom(
      t,
      "NotAllowedError",
      secondRequest,
      "Second concurrent create() call should be rejected with NotAllowedError",
    );

    abortController.abort();
    await promise_rejects_dom(
      t,
      "AbortError",
      firstRequest,
      "First create() request should be aborted",
    );
  }, "A second create() call while another is pending should reject with NotAllowedError.");

  // Additional test: Mixed create() and get() concurrency
  promise_test(async (t) => {
    await test_driver.set_virtual_wallet_behavior("wait");
    t.add_cleanup(() => test_driver.set_virtual_wallet_behavior("clear"));

    const abortController = new AbortController();
    await test_driver.bless("user activation for create request");
    const createRequest = navigator.credentials.create(
      { signal: abortController.signal },
    );

    let getRequest;
    await test_driver.bless("user activation for get request", () => {
      assert_true(navigator.userActivation.isActive);
      getRequest = navigator.credentials.get(makeGetOptions());
    });

    await promise_rejects_dom(
      t,
      "NotAllowedError",
      getRequest,
      "get() call while create() is pending should be rejected with NotAllowedError",
    );

    abortController.abort();
    await promise_rejects_dom(
      t,
      "AbortError",
      createRequest,
      "create() request should be aborted",
    );
  }, "A get() call while create() is pending should reject with NotAllowedError.");

  // Additional test: Three concurrent requests
  promise_test(async (t) => {
    await test_driver.set_virtual_wallet_behavior("wait");
    t.add_cleanup(() => test_driver.set_virtual_wallet_behavior("clear"));

    const abortController = new AbortController();
    await test_driver.bless("user activation for first request");
    const firstRequest = navigator.credentials.get(
      makeGetOptions({ signal: abortController.signal }),
    );

    let secondRequest, thirdRequest;
    await test_driver.bless("user activation for second and third requests", () => {
      assert_true(navigator.userActivation.isActive);
      secondRequest = navigator.credentials.get(makeGetOptions());
      thirdRequest = navigator.credentials.get(makeGetOptions());
    });

    await promise_rejects_dom(t, "NotAllowedError", secondRequest);
    await promise_rejects_dom(t, "NotAllowedError", thirdRequest);

    abortController.abort();
    await promise_rejects_dom(t, "AbortError", firstRequest);
  }, "Three concurrent get() calls should all reject except the first.");

  // Additional test: Concurrent requests across iframes
  promise_test(async (t) => {
    await test_driver.set_virtual_wallet_behavior("wait");
    t.add_cleanup(() => test_driver.set_virtual_wallet_behavior("clear"));

    const iframe = document.createElement("iframe");
    await new Promise((resolve) => {
      iframe.addEventListener("load", resolve, { once: true });
      iframe.src = "about:blank";
      document.body.appendChild(iframe);
    });

    await test_driver.bless(
      "user activation for subframe request",
      null,
      iframe.contentWindow,
    );
    const subframeRequest =
      iframe.contentWindow.navigator.credentials.get(makeGetOptions());

    let topLevelRequest;
    await test_driver.bless("user activation for top-level request", () => {
      assert_true(navigator.userActivation.isActive);
      topLevelRequest = navigator.credentials.get(makeGetOptions());
    });

    await promise_rejects_dom(
      t,
      "NotAllowedError",
      topLevelRequest,
      "Top-level get() while subframe request is pending should be rejected",
    );

    iframe.remove();
    await promise_rejects_dom(t, "AbortError", subframeRequest);
  }, "Concurrent get() calls across iframes should reject all but the first.");

  // Additional test: Concurrent request with different protocols
  promise_test(async (t) => {
    await test_driver.set_virtual_wallet_behavior("wait");
    t.add_cleanup(() => test_driver.set_virtual_wallet_behavior("clear"));

    const abortController = new AbortController();
    await test_driver.bless("user activation for first request");
    const firstRequest = navigator.credentials.get(
      makeGetOptions({ signal: abortController.signal, protocol: "org-iso-mdoc" }),
    );

    let secondRequest;
    await test_driver.bless("user activation for second request", () => {
      assert_true(navigator.userActivation.isActive);
      secondRequest = navigator.credentials.get(
        makeGetOptions({ protocol: "org.example.other" }),
      );
    });

    await promise_rejects_dom(
      t,
      "NotAllowedError",
      secondRequest,
      "Second concurrent request with different protocol should be rejected",
    );

    abortController.abort();
    await promise_rejects_dom(t, "AbortError", firstRequest);
  }, "Concurrent get() calls with different protocols should reject all but the first.");

</script>
</body>
</html>
