<!DOCTYPE html>
<html>
<head>
  <script src="/resources/testharness.js"></script>
  <script src="/resources/testharnessreport.js"></script>
</head>
<body>
<script>
// Test setHTML / setHTMLUnsafe behaviour with unsafe context.
// Specifically, test step 1 of:
// https://wicg.github.io/sanitizer-api/#set-and-filter-html
test(_ => {
  let context = document.createElement("div");
  context.setHTML("abc");
  assert_equals(context.innerHTML, "abc");
}, "setHTML with benign context.");

test(_ => {
  let context = document.createElement("div");
  context.setHTML("abc");
  assert_equals(context.innerHTML, "abc");
}, "setHTMLUnsafe with benign context.");

test(_ => {
  let context = document.createElement("script");
  context.setHTML("abc");
  assert_equals(context.innerHTML, "");
}, "setHTML with script context.");

test(_ => {
  let context = document.createElement("script");
  context.setHTMLUnsafe("abc");
  assert_equals(context.innerHTML, "abc");
}, "setHTMLUnsafe with script context.");

test(_ => {
  let context = document.createElementNS("http://www.w3.org/2000/svg", "script");
  context.setHTML("abc");
  assert_equals(context.innerHTML, "");
}, "setHTML with svg:script context.");

test(_ => {
  let context = document.createElementNS("http://www.w3.org/2000/svg", "script");
  context.setHTMLUnsafe("abc");
  assert_equals(context.innerHTML, "abc");
}, "setHTMLUnsafe with svg:script context.");

test(_ => {
  let context = document.createElementNS("http://www.w3.org/1999/xhtml", "x:script");
  context.setHTML("abc");
  assert_equals(context.innerHTML, "");
}, "setHTML with script with prefix context.");

test(_ => {
  let context = document.createElementNS("http://www.w3.org/1999/xhtml", "x:script");
  context.setHTMLUnsafe("abc");
  assert_equals(context.innerHTML, "abc");
}, "setHTMLUnsafe with script with prefix context.");

test(_ => {
  let context = document.createElementNS("http://www.w3.org/2000/svg", "x:script");
  context.setHTML("abc");
  assert_equals(context.innerHTML, "");
}, "setHTML with svg:script with prefix context.");

test(_ => {
  let context = document.createElementNS("http://www.w3.org/2000/svg", "x:script");
  context.setHTMLUnsafe("abc");
  assert_equals(context.innerHTML, "abc");
}, "setHTMLUnsafe with svg:script with prefix context.");

test(_ => {
  let context = document.createElement("script");
  context.textContent = "var initial = 1;";
  context.setHTML("abc");
  assert_equals(context.textContent, "var initial = 1;");
}, "setHTML with script context preserves existing children when fragment is null.");

test(_ => {
  let context = document.createElementNS("http://www.w3.org/2000/svg", "script");
  context.textContent = "var initial = 1;";
  context.setHTML("abc");
  assert_equals(context.textContent, "var initial = 1;");
}, "setHTML with svg:script context preserves existing children when fragment is null.");

test(_ => {
  let context = document.createElement("script");
  context.textContent = "var initial = 1;";
  if (typeof context.appendHTML === "function") {
    context.appendHTML("abc");
    assert_equals(context.textContent, "var initial = 1;");
  }
}, "appendHTML with script context does not modify script.");

test(_ => {
  let context = document.createElement("script");
  context.textContent = "var initial = 1;";
  if (typeof context.prependHTML === "function") {
    context.prependHTML("abc");
    assert_equals(context.textContent, "var initial = 1;");
  }
}, "prependHTML with script context does not modify script.");

test(_ => {
  let script = document.createElement("script");
  let child = script.appendChild(document.createTextNode("var initial = 1;"));
  if (typeof child.beforeHTML === "function") {
    child.beforeHTML("abc");
    assert_equals(script.textContent, "var initial = 1;");
  }
}, "beforeHTML on child of script element does not insert nodes.");

test(_ => {
  let script = document.createElement("script");
  let child = script.appendChild(document.createTextNode("var initial = 1;"));
  if (typeof child.afterHTML === "function") {
    child.afterHTML("abc");
    assert_equals(script.textContent, "var initial = 1;");
  }
}, "afterHTML on child of script element does not insert nodes.");
</script>
</body>
</html>
