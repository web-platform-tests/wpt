<!doctype html>
<meta charset="utf-8">
<meta name="timeout" content="long">
<meta name="referrer" content="no-referrer">
<title>Downloading a hyperlink: referrerpolicy attribute overrides the document's referrer policy</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/links.html#downloading-hyperlinks">
<link rel="help" href="https://html.spec.whatwg.org/multipage/links.html#attr-hyperlink-referrerpolicy">
<link rel="help" href="https://github.com/whatwg/html/issues/5623">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/common/utils.js"></script>
<script src="/common/dispatcher/dispatcher.js"></script>
<script src="resources/download-referrerpolicy.js"></script>
<body>
<script>
for (const tagName of ["a", "area"]) {
  downloadReferrerTest(tagName, {}, "",
    `<${tagName} download> without referrerpolicy follows the document's no-referrer policy`);
  downloadReferrerTest(tagName, { referrerpolicy: "unsafe-url" }, location.href,
    `<${tagName} download referrerpolicy=unsafe-url> overrides the document's no-referrer policy`);
}
</script>
