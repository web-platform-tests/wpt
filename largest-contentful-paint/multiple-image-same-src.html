<!DOCTYPE HTML>
<meta charset=utf-8>
<title>Largest Contentful Paint:dynamically appended image with different
    dimensions but same src triggers new entry.</title>
<body>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="resources/largest-contentful-paint-helpers.js"></script>
<img src='/images/black-rectangle.png' id='image_id' width="50" />
<script>
  assert_implements(window.LargestContentfulPaint,
                    "LargestContentfulPaint is not implemented");
  const url = window.location.origin + '/images/black-rectangle.png';
  const beforeLoad = performance.now();
  let secondBeforeLoad = 0;
  // black-rectangle.png is 50 x 25.
  const original_rect_size = 50 * 25;
  // The bigger black rectangle is 100 x 50, defined with width="100".
  const bigger_rect_size = 100 * 50;
  const entriesPromise = observeLCPEntries(2, {url});
  promise_test(async () => {
    const entries = await entriesPromise;
    checkEntry(entries[0], url, 'image_id', original_rect_size, beforeLoad,
               ["approximateSize"]);
  }, 'First image');
  promise_test(async () => {
    const entries = await entriesPromise;
    checkEntry(entries[1], url, 'new_image_id', bigger_rect_size, () => secondBeforeLoad);
  }, 'Second image');
  // Creates a new bigger black rectangle once the first has been observed.
  observeLCP({url}).then(() => {
    secondBeforeLoad = performance.now();
    appendImage(url, {id: 'new_image_id', width: 100});
  });
</script>
</body>
