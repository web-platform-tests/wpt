<!DOCTYPE html>
<html class="reftest-wait">
<meta charset="utf-8">
<title>focus() on a shadow host whose focused scrollable region already has focus doesn't scroll</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/interaction.html#dom-focus">
<link rel="help" href="https://html.spec.whatwg.org/multipage/interaction.html#get-the-focusable-area">
<link rel="help" href="https://github.com/whatwg/html/issues/4512">
<link rel="match" href="/css/reference/ref-filled-green-100px-square-only.html">
<meta name="assert" content="Calling focus() on a shadow host with delegatesFocus, when a scrollable region in its shadow tree already has focus, doesn't scroll.">
<style>
  html {
    overflow: hidden;
  }
  #host {
    margin-top: 200vh;
  }
</style>
<p>Test passes if there is a filled green square.</p>
<div id="square" style="width: 100px; height: 100px; background: green;"></div>
<div id="host"></div>
<script src="/common/reftest-wait.js"></script>
<script>
  const square = document.getElementById("square");
  const host = document.getElementById("host");
  const shadowRoot = host.attachShadow({ mode: "open", delegatesFocus: true });
  shadowRoot.innerHTML = `
    <div id="scroller"
        style="overflow: scroll; width: 100px; height: 100px; background: red; outline: none;">
      <div style="height: 300px;"></div>
    </div>`;
  const scroller = shadowRoot.getElementById("scroller");
  const nextFrames = () => new Promise(resolve => {
    requestAnimationFrame(() => requestAnimationFrame(resolve));
  });
  (async () => {
    // The scrollable region only exists once the scroller has a box.
    await nextFrames();
    host.focus();
    await nextFrames();
    // The first focus() has to focus the scrollable region and scroll it into view; otherwise the
    // test checks nothing, so make it fail.
    if (window.scrollY == 0 || shadowRoot.activeElement != scroller)
      square.style.background = "red";
    window.scrollTo(0, 0);
    host.focus();
    await nextFrames();
    if (shadowRoot.activeElement != scroller)
      square.style.background = "red";
    takeScreenshot();
  })();
</script>
</html>
