
<!DOCTYPE HTML>
<meta charset=utf-8>
<title>Long Animation Frame Timing: window attribution</title>
<meta name="timeout" content="long">
<body>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/common/get-host-info.sub.js"></script>
<script src="/common/utils.js"></script>
<script src="/common/dispatcher/dispatcher.js"></script>
<script src="resources/utils.js"></script>
<div id="log"></div>
<script>

const host_info = get_host_info();
const {ORIGIN, REMOTE_ORIGIN, HTTP_NOTSAMESITE_ORIGIN} = host_info;

promise_test (async t => {
  const [entry, script] = await expect_long_frame_with_script((t, busy_wait) => {
    requestAnimationFrame(() => busy_wait());
  }, () => true, t);
  assert_equals(script.windowAttribution, "self");
  assert_equals(script.window, window);
}, 'Scripts in this window should be self-attributed');

promise_test (async t => {
  let found = false;
  for (let i = 0; i < 10 && !found; ++i) {
    const [executor, iframe] = await prepare_exec_iframe(t, ORIGIN);
    const [entry, script] = await expect_long_frame_with_script(() =>
      executor.execute_script(async (duration) => {
        await new Promise(resolve => window.requestAnimationFrame(resolve));
        parent.generate_loaf_now();
      }, [very_long_frame_duration]), () => true, t);

      if (script.windowAttribution === "descendant" && script.window === iframe.contentWindow) {
          found = true;
      }
  }

  assert_true(found);
}, 'Scripts in subframes should be descendant-attributed');

promise_test(async t => {
  const iframe = document.createElement("iframe");
  iframe.src = "/resource-timing/resources/green.html";
  document.body.append(iframe);
  t.add_cleanup(() => iframe.remove());
  const [entry, script] = await expect_long_frame_with_script(
    (t, busy_wait) => requestAnimationFrame(busy_wait), () => true, t);
  const in_iframe = iframe.contentWindow.performance.getEntriesByType("long-animation-frame").some(
    e => e.scripts.some(script_in_iframe => script_in_iframe.invoker === script.invoker)
  );

  assert_false(in_iframe, "IFrame should not receive the LoAF entry");
}, 'A long busy wait in a requestAnimationFrame should not be observable by same-origin iframes');

promise_test(async t => {
  const host_cb = () => busy_wait(very_long_frame_duration);
  const iframe = document.createElement("iframe");
  iframe.src = "/resource-timing/resources/green.html";
  document.body.append(iframe);
  t.add_cleanup(() => iframe.remove());
  await new Promise(resolve => iframe.addEventListener("load", resolve, {once: true}));

  const entryPromise = new Promise(resolve => {
    new iframe.contentWindow.PerformanceObserver(list => {
      for (const entry of list.getEntries()) {
        const script = entry.scripts.find(s => s.invoker === "Window.oncustom");
        if (script) {
          resolve(script);
        }
      }
    }).observe({entryTypes: ["long-animation-frame"]});
  });

  iframe.contentWindow.addEventListener("custom", host_cb, {once: true});
  iframe.contentWindow.setTimeout(() => {
    iframe.contentWindow.dispatchEvent(new iframe.contentWindow.Event("custom"));
  }, 0);

  const script = await entryPromise;
  assert_equals(script.windowAttribution, "ancestor");
  assert_equals(script.window, window);
}, 'Scripts from an ancestor window should be ancestor-attributed');

promise_test(async t => {
  const iframe1 = document.createElement("iframe");
  const iframe2 = document.createElement("iframe");
  iframe1.src = "/resource-timing/resources/green.html";
  iframe2.src = "/resource-timing/resources/green.html";
  document.body.append(iframe1, iframe2);
  t.add_cleanup(() => {
    iframe1.remove();
    iframe2.remove();
  });
  await Promise.all([
    new Promise(resolve => iframe1.addEventListener("load", resolve, {once: true})),
    new Promise(resolve => iframe2.addEventListener("load", resolve, {once: true})),
  ]);

  const sibling_cb = new iframe2.contentWindow.Function(`
    const deadline = performance.now() + ${very_long_frame_duration};
    while (performance.now() < deadline) {}
  `);

  const entryPromise = new Promise(resolve => {
    new iframe1.contentWindow.PerformanceObserver(list => {
      for (const entry of list.getEntries()) {
        const script = entry.scripts.find(s => s.invoker === "Window.oncustom");
        if (script) {
          resolve(script);
        }
      }
    }).observe({entryTypes: ["long-animation-frame"]});
  });

  iframe1.contentWindow.addEventListener("custom", sibling_cb, {once: true});
  iframe1.contentWindow.setTimeout(() => {
    iframe1.contentWindow.dispatchEvent(new iframe1.contentWindow.Event("custom"));
  }, 0);

  const script = await entryPromise;
  assert_equals(script.windowAttribution, "same-page");
  assert_equals(script.window, iframe2.contentWindow);
}, 'Scripts from a sibling iframe should be same-page-attributed');

promise_test(async t => {
  const iframe = document.createElement("iframe");
  iframe.src = "/resource-timing/resources/green.html";
  document.body.append(iframe);
  t.add_cleanup(() => iframe.remove());
  await new Promise(resolve => iframe.addEventListener("load", resolve, {once: true}));

  const [entry, script] = await expect_long_frame_with_script(() => {
    const child_fn = new iframe.contentWindow.Function(`
      const deadline = performance.now() + ${very_long_frame_duration};
      while (performance.now() < deadline) {}
      window.frameElement.remove();
    `);
    requestAnimationFrame(child_fn);
  }, s => s.invokerType === "user-callback", t);

  assert_equals(script.windowAttribution, "other");
  assert_equals(script.window, null);
}, 'Scripts from a detached iframe should have other attribution and null window');

promise_test(async t => {
  const [middleExecutor, middleIframe] = await prepare_exec_iframe(t, REMOTE_ORIGIN);
  const innerUuid = token();
  const innerUrl = new URL("/common/dispatcher/remote-executor.html", ORIGIN);
  innerUrl.searchParams.set("uuid", innerUuid);
  await middleExecutor.execute_script(async (url) => {
    const inner = document.createElement("iframe");
    inner.src = url;
    document.body.appendChild(inner);
    await new Promise(resolve => inner.addEventListener("load", resolve, {once: true}));
  }, [innerUrl.href]);
  const innerExecutor = new RemoteContext(innerUuid);

  const [entry, script] = await expect_long_frame_with_script(() =>
    innerExecutor.execute_script(async (duration) => {
      await new Promise(resolve => window.requestAnimationFrame(resolve));
      const deadline = performance.now() + duration;
      while (performance.now() < deadline) {}
    }, [very_long_frame_duration]),
    s => s.windowAttribution === "descendant", t);

  assert_equals(script.windowAttribution, "descendant");
  assert_not_equals(script.window, null);
}, 'Scripts in a same-origin grandchild nested inside a cross-origin iframe are attributed to the top-level same-origin root');

</script>
</body>
