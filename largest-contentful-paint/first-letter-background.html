<!DOCTYPE HTML>
<meta charset=utf-8>
<title>Largest Contentful Paint: observe element with background image in its first letter</title>
<body>
<style>
div::first-letter {
  background-image: url('/images/black-rectangle.png');
}
div {
  font-size: 12px;
}
</style>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="resources/largest-contentful-paint-helpers.js"></script>
<script>
  setup({"hide_test_state": true});
  assert_implements(window.LargestContentfulPaint,
                    "LargestContentfulPaint is not implemented");
  const imageUrl = window.location.origin + '/images/black-rectangle.png';
  const beforeLoad = performance.now();

  promise_test(async t => {
    const entriesPromise = collectLCPEntries(t, {settleMs: 1000});
    // Once the first entry is observed, add longer text; it will become the
    // new Largest Contentful Paint.
    observeLCP().then(() => {
      const div = document.createElement('div');
      div.id = 'target2';
      div.innerHTML = 'long text will now be LCP';
      document.body.appendChild(div);
    });

    const entries = await entriesPromise;

    // The first entry is either the text of #target or the first-letter
    // background image of #target.
    const first = entries[0];
    assert_greater_than_equal(first.renderTime, beforeLoad);
    assert_equals(first.duration, 0);
    assert_equals(first.id, 'target');
    assert_equals(first.element, document.getElementById('target'));
    if (first.url === '') {
      assert_equals(first.loadTime, 0);
    } else {
      // The first-letter background image is observable, with a positive
      // size.
      assert_equals(first.url, imageUrl);
      assert_greater_than(first.size, 0);
    }

    // Any image entry must be the first-letter background image.
    for (const entry of entries) {
      if (entry.url === '') {
        continue;
      }
      assert_equals(entry.url, imageUrl,
          'The only image entry should be the first-letter background');
      assert_greater_than(entry.size, 0,
          'The first-letter background image size should be positive');
    }

    // The new Largest Contentful Paint must be the text of #target2, not the
    // first-letter background image.
    const newEntries = entries.filter(entry => entry.id !== 'target');
    assert_greater_than(newEntries.length, 0, 'A new LCP entry should be observed.');
    const newEntry = newEntries[0];
    if (newEntry.url !== '')
      assert_unreached('First-letter background should not be LCP!');
    assert_equals(newEntry.entryType, 'largest-contentful-paint');
    assert_greater_than_equal(newEntry.renderTime, beforeLoad);
    assert_approx_equals(newEntry.startTime, newEntry.renderTime, 0.001,
        'startTime should be equal to renderTime to the precision of 1 millisecond.');
    assert_equals(newEntry.loadTime, 0);
    // Estimate the text size: 12 * 100
    assert_greater_than_equal(newEntry.size, 1200);
    assert_equals(newEntry.element, document.getElementById('target2'));
  }, 'Largest Contentful Paint: first-letter is observable.');
</script>
<div id='target'>A</div>
</body>
