<!DOCTYPE html>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="resources/largest-contentful-paint-helpers.js"></script>
<!--
  Transparent text with text stroke decoration should be eligible for LCP.
-->
<style>
  .large-transparent {
    font-size: 200px;
    position: fixed;
    top: 0;
    left: 0;
    padding: 0;
    margin: 0;
    pointer-events: none;
    color: transparent;
    z-index: -999;
    -webkit-text-stroke: 1px blue;
  }
</style>

<body>
  <img src='/images/lcp-133x106.png' id='image' />
  <p id='larger_text' class='large-transparent'>fake LCP</p>

  <script>
    promise_test(async t => {
      assert_implements(window.LargestContentfulPaint, "LargestContentfulPaint is not implemented");

      const lcpEntries = await collectLCPEntries(t, {settleMs: 300});
      const lastEntry = lcpEntries[lcpEntries.length - 1];

      assert_equals(lastEntry.id, 'larger_text',
        "Transparent text with text stroke decoration was included in LCP but not at correct place in timeline.");
      assert_equals(lastEntry.element, document.getElementById('larger_text'),
        "Entry element should be the transparent text element.");
      assert_equals(lastEntry.url, "", "Entry url should be empty for text.");
    }, "Transparent text with text stroke decoration should not be excluded from LCP.")
  </script>
</body>
</html>
