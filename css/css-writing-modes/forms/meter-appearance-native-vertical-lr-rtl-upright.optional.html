<link rel="help" href="https://drafts.csswg.org/css-writing-modes-4/#valdef-text-orientation-upright">
<title>Meter appearance native writing mode vertical-lr, RTL direction & upright text orientation</title>
<meta charset="utf-8">
<link rel="match" href="meter-appearance-native-sideways-lr-rtl-ref.html">
<link rel="mismatch" href="meter-appearance-native-sideways-lr-ref.html">

<!-- 'text-orientation: upright' makes the used 'direction' ltr. The minimum value is on the
     inline-start side, which is therefore the top here, as for vertical-lr with LTR direction. The
     match reference uses that; the mismatch reference uses vertical-lr with RTL direction. -->
<p>The meter element below should match the correct writing mode.</p>
<meter value="70" min="0" max="100" style="writing-mode: vertical-lr; direction: rtl; text-orientation: upright"></meter>
