<svg id="svg-root"
  width="100%" height="100%" viewBox="0 0 480 360"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  xmlns:html="http://www.w3.org/1999/xhtml">
  <g id="testmeta">
    <title>Paint: CSS Color 4 formats for 'color' (a98-rgb)</title>
    <html:link rel="author"
          title="Chris Lilley"
          href="http://svgees.us" /> 
    <html:link rel="help"
          href="https://www.w3.org/TR/SVG2/painting.html#SpecifyingPaint" />
    <html:link rel="help"
          href="https://www.w3.org/TR/css-color-4/#color-syntax" />
    <html:link rel="match"  href="paint-color-4-ref.svg" />
  </g>

  <style id="test-font" type="text/css">
    /* Standard Font (if needed). */
    @font-face {
      font-family: FreeSans;
      src: url("../fonts/FreeSans.woff") format("woff");
    }
    text {
      font-family: FreeSans, sans-serif;
      text-anchor: middle;
      fill: black;
    }
    #title {
      font-size: 24px;
    }
    .label {
      font-size: 18px;
    }
    #test {
      fill: color(a98-rgb 0.3616266 0.5722774 0.4687185);
    }
  </style>


  <g id="test-body-content" font-size="16">
    <rect id="reference" width="120" height="61" x="10" y="10" fill="#339377"/>
    <rect id="test" width="120" height="60" x="10" y="70" fill="red"/>
  </g>

</svg>
