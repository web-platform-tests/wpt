<!DOCTYPE HTML>
<meta charset=utf-8>
<title>Largest Contentful Paint: observe element rendered by MathML</title>
<body>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="resources/largest-contentful-paint-helpers.js"></script>
<style>
mathml {
  font-size: 12px;
}
</style>
<script>
  assert_implements(window.LargestContentfulPaint,
                    "LargestContentfulPaint is not implemented");
  const beforeRender = performance.now();
  // Some lower bound: height of at least 12 px, width of at least 100 px.
  promise_test(async () => {
    const entry = await observeLCP({id: 'mathml'});
    checkEntry(entry, '', 'mathml', 1200, beforeRender, ['text', 'sizeLowerBound']);
  }, 'Element rendered by MathML is observable');
</script>
<math display="block">
  <mrow>
    <msup>
      <mi id="mathml">This is important text! :)</mi>
    </msup>
  </mrow>
</math>
</body>
