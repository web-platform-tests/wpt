version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 1000
- package-ecosystem: pip
  directory: docs/
  schedule:
    interval: monthly
  open-pull-requests-limit: 1000
  # Upgrade sphinx manually only
  ignore:
  - dependency-name: "sphinx"
- package-ecosystem: pip
  directory: resources/test/
  schedule:
    interval: monthly
  open-pull-requests-limit: 1000
- package-ecosystem: pip
  directory: tools/
  schedule:
    interval: daily
  open-pull-requests-limit: 1000
  cooldown:
    default-days: 3
    # Exclude mozbase packages; we also control the upstream, if these are bad
    # then either pypi itself was compromised or we have a worse problem.
    exclude:
      - marionette_driver
      - mozcrash
      - mozdebug
      - mozdevice
      - mozfile
      - mozinfo
      - mozinstall
      - mozleak
      - mozlog
      - mozprocess
      - mozprofile
      - mozrunner
      - mozshellutil
      - mozterm
      - mozversion
