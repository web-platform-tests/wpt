<!DOCTYPE HTML>
<meta charset=utf-8>
<title>Largest Contentful Paint: observe cross-origin images.</title>
<body>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="resources/largest-contentful-paint-helpers.js"></script>
<script>
promise_test(async () => {
  assert_implements(window.LargestContentfulPaint, "LargestContentfulPaint is not implemented");
  const beforeLoad = performance.now();
  const url = 'http://{{domains[www]}}:{{ports[http][1]}}/images/blue.png';
  // blue.png is 133 x 106.
  const size = 133 * 106;
  const entries = await observeLCP({url}, {settleMs: 100});
  assert_equals(entries.length, 1);
  checkImage(entries[0], url, 'image_id', size, beforeLoad, ['renderTimeIs0']);
}, 'Cross-origin image is observable, with renderTime equal to 0.');
</script>

<img src='http://{{domains[www]}}:{{ports[http][1]}}/images/blue.png' id='image_id'/>
</body>
