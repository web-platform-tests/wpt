# This is the configuration file for Azure Pipelines, used to run tests on
# macOS and Windows. Documentation to help understand this setup:
# https://docs.microsoft.com/en-us/azure/devops/pipelines/yaml-schema
# https://docs.microsoft.com/en-us/azure/devops/pipelines/build/triggers
# https://docs.microsoft.com/en-us/azure/devops/pipelines/process/multiple-phases
# https://docs.microsoft.com/en-us/azure/devops/pipelines/process/templates
# https://docs.microsoft.com/en-us/azure/devops/pipelines/process/variables
# https://docs.microsoft.com/en-us/azure/devops/pipelines/tasks/index
#
# In addition to this configuration file, some setup in the Azure DevOps
# project is required:
#  - The "Build pull requests from forks of this repository" setting must be
#    enabled: https://docs.microsoft.com/en-us/azure/devops/pipelines/repos/github#validate-contributions-from-forks

# THROWAWAY BRANCH -- DO NOT MERGE.
#
# Future work step 3.5h: the A/B. Build 158874 made this leg work at last (3,605
# cycles, 8 hits, 8 bundles, 31,647 controls) and put the anomaly on the socket's
# FIRST select() call 9 times out of 9, never on a later one. So this build stops
# observing and starts intervening: legs 1-6 are the control, legs 7-12 push a
# byte through the socketpair before the loop ever polls it. If the rate goes to
# zero, the first-poll invariant is causal and preventable, and the fix can be
# preventative rather than tolerate-and-degrade.
#
# 12 legs rather than 20, because 158874 also calibrated the leg -- see the
# reasoning on `strategy:` below. The control arm doubles as the positive control,
# and a silent control is the outcome that wastes a build, which is the floor on
# how small this can go.
#
# Also carried, as free ride-alongs: the anomalous select()'s ready-set plus a
# listener-ready counter for its base rate (tests H8 -- the listener and the
# wakeup socket share one select(), so a listener event mis-reported against the
# wakeup socket would explain the first-poll invariant), a timestamp isolating
# the recv from the log emit, and the pair's ports on the healthy controls.
#
# Future work step 3.5g: loop the daemon-startup burst, and nothing else.
#
# The earlier arm of this job (still below) loops the real `wpt run`, and its
# rate matches production -- 2 hits in ~268 invocations = 7.5e-3 per run vs
# production's 5.9e-3 per job. But it spends ~214s per trial to expose a ~3s
# window: every observed 997 lands at age_s 0.34-0.57 and select_index 1-2,
# before a single test runs. That is ~1.5% efficiency, i.e. ~0.8 expected hits
# per 20-leg build.
#
# So this leg runs tools/ci/winsock_serve_loop.py instead, which calls the same
# serve.start() that TestEnvironment.__enter__ does (environment.py:154) with
# the same 10 daemons, waits for them, stops them, and repeats. Byte-identical
# where it matters -- ServerProc.start, the spawn bootstrap, create_daemon,
# WebTestServer.__init__, serve_forever's socketpair -- and plausibly 20-50x
# the cycles per agent-minute.
#
# It is a bisection either way it lands. If the rate holds, everything after
# daemon startup is excluded and we have a cheap reproducer that makes 3.5d
# (the AFD trace) viable. If it collapses, the missing fidelity ingredient is
# in what this skips -- the browser, wptrunner's workers, sustained traffic --
# which is itself the answer to the >=750x gap the campaign has never attacked.
#
# Reading the results, both lessons learned the hard way:
#  - Cycle 1 of each process is the only fully faithful cycle. Later ones
#    inherit TIME_WAIT and whatever else the last one left behind, which is
#    exactly how H7 (ephemeral-port pressure) came to look like a lead when it
#    was harness state. Every record carries `cycle`; analyse cycle 1
#    separately before pooling. --restart-every bounds the warmth.
#  - Calibrate before trusting a null. The anchor is 5.9e-3 per 10-daemon run.
#    If cycles come in far below it, find out whether they are less *exposed*
#    before concluding anything about the mechanism.
#
# The evidence file is no longer deleted on a miss (3.5f's follow-on): Change
# 0's readable-pre-recv line fires on every wakeup, so each cycle yields ~9
# healthy control records. That both turns every cycle into control data and
# gives a standing check that the instrumentation still fires -- which a
# zero-hit build otherwise cannot demonstrate at all.
#
# Notes for anyone editing this:
#  - Build 158830 was 3.5g's first attempt and produced NO data at all: the
#    driver was invoked as `python tools/ci/winsock_serve_loop.py`, outside the
#    virtualenv that provides mozlog, so all 20 legs died at import in under a
#    second. It is now a registered wpt subcommand and must be invoked as
#    `python wpt winsock-serve-loop`. Two lessons are baked in below: run the
#    driver through the dispatcher, and fail loudly when a leg produces zero
#    cycles -- continueOnError reported all 20 of those dead legs as SUCCESS.
#  - Build 158837 was the second attempt and ALSO produced no cycles, for a
#    variant of the same cause one level down: the supervisor spawned its
#    children with sys.executable, which is still the base interpreter because
#    Virtualenv.activate() never rebinds it. The zero-cycle guard below did not
#    catch it either, because it only tested that cycles.jsonl existed and the
#    supervisor creates that file before its first child runs. Both are fixed;
#    the guard now counts actual cycle records.
#  - No `dependsOn: decision` and no `condition:`. Every other job gates on
#    dependencies.decision.outputs['test_jobs.*'], and `./wpt test-jobs` has
#    no notion of this job, so gating it would mean it never runs.
#  - System.Debug is set to 'true' so configure_watson.yml's condition fires
#    and LocalDumps collects crash dumps into the artifact staging directory.
#  - continueOnError on the loop step, condition: always() on publish: a
#    cycle hanging or the deadline elapsing mid-run must not lose whatever
#    evidence was already produced.
#  - `strategy: parallel` needs a distinct artifact name per slice --
#    $(System.JobPositionInPhase) is what Azure populates for that.

jobs:
- job: winsock_hunt_win_serve_loop
  displayName: 'WinError 997 hunt: loop serve.start() bursts (throwaway, do not merge)'
  # 60 rather than the loop deadline plus a little: the preamble is a median
  # 399s and has been observed at 541s, and on build 158745 a 30min timeout
  # meant Azure's watchdog cancelled all 20 slices mid-trial, before any
  # natural exit. Headroom here costs nothing -- it is a ceiling, not a
  # schedule, and the driver's own 1500s deadline is what bounds the work.
  timeoutInMinutes: 60
  pool:
    vmImage: 'windows-latest'
  variables:
    System.Debug: true
  strategy:
    # 12, not 20, since build 158874 calibrated this leg: a non-hitting leg runs
    # ~230 cycles at 2.2e-3 per cycle, so it carries 0.51 expected hits and a 0.40
    # chance of hitting. With a 6/6 split that gives ~1380 cycles per arm, i.e.
    # p~0.047 for a clean treatment arm and a 4.7% risk that the control arm is
    # silent -- and a silent control is the outcome that wastes the whole build,
    # which is what stops this going lower. 20 legs bought p~0.006 for 620
    # agent-minutes; this buys p~0.047 for ~370.
    #
    # The design is sequential on purpose. A treatment arm that still hits needs
    # no significance test at all, so only the interesting outcome costs a second
    # build (two 12-leg builds combined: ~2760 cycles/arm, p~0.002). Expected cost
    # is lower than one 20-leg build.
    #
    # Note what retired the case for many legs: cold draws were the scarce
    # resource while this looked per-fresh-VM, but 158874 found no hit at cycle 1
    # and a flat hazard across cycles 1-233, so one leg is ~230 draws rather than
    # one. Do NOT shorten the driver deadline to compensate for fewer legs --
    # preamble is ~6 of ~31 minutes per leg, so that moves the wrong way (6.2
    # cycles/agent-min at 750s vs 7.4 at 1500s). Cut legs, not deadline.
    parallel: 12
  steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.14'
  - template: tools/ci/azure/system_info.yml
  - template: tools/ci/azure/checkout.yml
  - template: tools/ci/azure/update_manifest.yml
  - template: tools/ci/azure/install_certs.yml
  - template: tools/ci/azure/configure_watson.yml
  - template: tools/ci/azure/update_hosts.yml
  # Note what is *not* here: install_edge. This arm starts no browser, so the
  # ~69s Edge install would only add preamble. If 3.5g's rate comes in low,
  # that is one of the first differences to put back -- but as a deliberate
  # arm, not by leaving it in and never testing without it.
  #
  # update_manifest is kept: serve.start() builds real routes, and the route
  # builder reads the manifest.
  #
  # Future work step 3.5b. Runs *before* the loop, so this is a genuine cold
  # boot, but *after* the whole preamble, so the machine state (Winsock
  # catalog, loaded DLLs, certs) matches what a production daemon sees --
  # Run 2's `bare` arm exists precisely because that distinction mattered.
  #
  # 3.5b itself is settled (no gap: all 3 arms x 20 cold boots said the
  # accept()ed end is genuinely blocking), so this now runs for the four
  # older probes and as a canary that the harness still works on this image.
  #
  # No new publish step: $outDir is already published below.
  - powershell: |
      $outDir = "$(Agent.TempDirectory)\trials"
      New-Item -ItemType Directory -Force -Path $outDir | Out-Null
      python tools/ci/winsock_probe.py --mode probes --out "$outDir\probes.jsonl"
    displayName: 'Cold-boot winsock probes'
    continueOnError: true
  # Future work step 3.5d: the Winsock/AFD kernel trace. Throwaway, never merge.
  #
  # Design change from 3.5d as originally written, and it is the whole reason
  # this is now cheap. That text said "trace only the first ~10s of each trial
  # and stop; keep on hit, delete on miss", which suited the `wpt run` loop at
  # ~214s/trial. Under 3.5g a *cycle* is ~6s, so "the first 10s" is the entire
  # cycle, and 231 logman start/stop pairs per leg would add latency to exactly
  # the window being measured. So: one circular-mode session for the whole leg,
  # frozen in-process the instant the anomaly is detected (server.py's
  # _winsock_probe_stop_trace). Constant overhead, no per-cycle perturbation.
  # The ring-buffer machinery 3.5d hoped to avoid is now the simpler option.
  #
  # The .etl lives outside $outDir on purpose: circular mode PREALLOCATES the
  # file to -max, so it is 512MB from the first second and must not land in the
  # artifact that gets downloaded casually. Note that preallocation also kills
  # the obvious "did the trace work" check -- the file never grows, so its size
  # says nothing. Hence the self-test below runs a separate short-lived session.
  - powershell: |
      $etl = "$(Agent.TempDirectory)\afd.etl"
      $session = "wptafd"
      $outDir = "$(Agent.TempDirectory)\trials"
      New-Item -ItemType Directory -Force -Path $outDir | Out-Null

      # Provider NAME, not GUID. logman accepts either, but a mistyped GUID
      # creates a session that captures nothing and is indistinguishable from a
      # clean null -- the exact failure mode that cost this campaign builds
      # 158830 and 158837. Print what actually resolves, so if the name is wrong
      # the log contains the right one.
      Write-Host "=== matching ETW providers on this image ==="
      logman query providers | Select-String -Pattern 'Winsock|AFD|TCPIP'

      # POSITIVE CONTROL, before committing 25 minutes of loop time to a session
      # that might capture nothing. Same machinery as the real session, but
      # short-lived so it can be stopped and decoded immediately. Runs one
      # socketpair through create/poke/recv -- i.e. the very operations the
      # anomaly involves -- and asserts AFD events came back.
      #
      # This is the substitute for a local smoke test, which is impossible here:
      # logman and tracerpt do not exist off Windows. Runs 1 and 2 of 3.5g are
      # the precedent for why an unverifiable new code path gets its own check.
      $probeEtl = "$(Agent.TempDirectory)\afd-selftest.etl"
      logman create trace wptafdtest -ets -o $probeEtl `
        -p "Microsoft-Windows-Winsock-AFD" 0xffffffffffffffff 5 `
        -bs 128 -nb 16 64
      python -c "import socket;a,b=socket.socketpair();b.send(b'x');a.recv(1);a.close();b.close()"
      Start-Sleep -Seconds 2
      logman stop -n wptafdtest -ets
      tracerpt $probeEtl -o "$outDir\afd-selftest.csv" -of CSV `
        -summary "$outDir\afd-selftest-summary.txt" -y
      $events = 0
      if (Test-Path "$outDir\afd-selftest.csv") {
        $events = @(Get-Content "$outDir\afd-selftest.csv").Count
      }
      Write-Host "self-test: $events CSV lines from a single socketpair lifecycle"
      Get-Content "$outDir\afd-selftest-summary.txt" -ErrorAction SilentlyContinue
      if ($events -lt 2) {
        # Loud, but NOT fatal. If the trace cannot work the loop still produces
        # the ordinary 3.5g/3.5h evidence records, and the agent minutes are
        # already committed; losing them as well would be strictly worse. The
        # analysis reads the etw-stop record, so a dead trace cannot be mistaken
        # for a traced miss.
        Write-Host "##vso[task.logissue type=error]ETW self-test captured nothing: the AFD provider name or tracerpt invocation is wrong, and no trace will be usable this build"
      }
      Remove-Item $probeEtl -ErrorAction SilentlyContinue

      # The real session. Circular file mode is the flight-recorder pattern: the
      # file always holds the most recent -max MB, so there is no watcher, no
      # flush-on-detection plumbing, and nothing to size against a 1500s loop.
      #
      # 512MB and 40MB of buffers are guesses -- AFD volume on this image has
      # never been measured, so treat build 1 as partly a calibration build. The
      # canary is Buffers Lost, printed after the loop: if it is nonzero the
      # trace is unreliable and -bs/-nb need raising before believing anything.
      #
      # AFD only, not TCPIP as well. The target is the AFD poll IRP, and adding
      # TCPIP would roughly double the volume for a provider that is only
      # interesting if the AFD trace shows the poll completing with no
      # AFD-visible cause. That is build 2's question, not build 1's.
      logman create trace $session -ets -o $etl -mode Circular -max 512 `
        -p "Microsoft-Windows-Winsock-AFD" 0xffffffffffffffff 5 `
        -bs 128 -nb 64 320
      logman query -n $session -ets
    displayName: 'Start Winsock/AFD ETW trace (3.5d)'
    continueOnError: true
  - powershell: |
      # 25 minutes, leaving room inside the job timeout for the preamble above
      # and the publish steps below.
      $outDir = "$(Agent.TempDirectory)\trials"
      New-Item -ItemType Directory -Force -Path $outDir | Out-Null
      # Future work step 3.5c's minidump is DELIBERATELY OFF for the 3.5d build,
      # and this is a real interaction rather than tidying. write_minidump runs
      # on the faulting thread before collect_evidence and was measured at 1.224s
      # and 27.694s for ~90MB in build 158898. Even with the trace now frozen at
      # the readability rather than at the raise, a 90MB dump competes for disk
      # with the ETW flush at the one moment that matters. One instrument at a
      # time.
      #   $env:WPT_WINSOCK_DUMP_DIR = "$(Build.ArtifactStagingDirectory)"
      #
      # 3.5d: names the session server.py freezes on detection. Absent this var
      # the hook is a no-op, so the commit is identical either way.
      $env:WPT_WINSOCK_ETW_SESSION = "wptafd"
      # One file for the whole leg, never deleted (3.5f's follow-on). Every
      # cycle appends ~9 readable-pre-recv control records; a hit appends an
      # `anomaly` record, which is what the driver watches for, plus an
      # `etw-stop` record recording whether the trace was actually frozen.
      $env:WPT_WINSOCK_EVIDENCE_PATH = "$outDir\evidence.jsonl"
      # 3.5h is DONE and negative -- the pre-loop handshake does not stop the
      # anomaly (3 occurrences in 1,027 treatment cycles against 4 in 690
      # control, p~0.29 conditional on 7). So all 12 legs run the untreated
      # shape here: splitting them again would halve the traced population for
      # an arm already known not to work. WPT_WINSOCK_PAIR_HANDSHAKE is left
      # unset, which is what makes server.py's handshake a no-op.
      Write-Host "3.5d arm: all legs untreated, ETW session wptafd"
      # --restart-every 25 rather than one long-lived process: the driver's own
      # process accumulates state across cycles too, and cycle 1 after a
      # re-exec is closer to a cold start than cycle 200 of the same process.
      # It is not as cold as a fresh VM boot -- nothing inside a job is -- which
      # is why the cycle index is recorded rather than assumed away.
      #
      # Run it as a child with a hard wait rather than inline, because the
      # silent-park class is real (3.5b measured a recv on exactly this socket
      # parking indefinitely): a wedged driver would otherwise run to the 60min
      # job timeout, and a *cancelled* job skips the publish steps below even
      # though they say condition: always(). 1800s is 300s past the driver's
      # own deadline, so this only fires if the driver itself is stuck.
      #
      # `python wpt winsock-serve-loop`, NOT `python tools/ci/...` directly:
      # mozlog lives in the virtualenv the wpt dispatcher builds, and build
      # 158830 lost all 20 legs to ModuleNotFoundError at import -- in under a
      # second each, reported SUCCESS by continueOnError.
      $proc = Start-Process -FilePath python -ArgumentList @(
        "wpt", "winsock-serve-loop",
        "--deadline", "1500",
        "--restart-every", "25",
        "--out", "$outDir\cycles.jsonl"
      ) -RedirectStandardOutput "$outDir\driver.log" `
        -RedirectStandardError "$outDir\driver.err" -PassThru -NoNewWindow
      if (-not $proc.WaitForExit(1800 * 1000)) {
        Write-Host "driver did not exit; killing so the artifacts still publish"
        Stop-Process -Id $proc.Id -Force
      }
      # A leg that produced no cycles is a broken leg, not a clean null.
      # Count actual `cycle` records, do NOT merely test the file exists: the
      # supervisor writes supervisor-start before launching its first child,
      # so build 158837 produced a 5-line cycles.jsonl holding nothing but a
      # start, a generation and an abort -- and sailed through the Test-Path
      # guard that was added after 158830 to catch exactly this.
      #
      # The trailing quote in the pattern matters: it counts `"kind": "cycle"`
      # and deliberately NOT `"kind": "cycle-error"`. A leg whose every cycle
      # raised measured no exposure either, so it should also fail loudly.
      $cycles = 0
      if (Test-Path "$outDir\cycles.jsonl") {
        $cycles = @(Select-String -Path "$outDir\cycles.jsonl" `
                      -Pattern '"kind": "cycle"' -SimpleMatch).Count
      }
      Write-Host "cycle records: $cycles"
      if ($cycles -eq 0) {
        Write-Host "##vso[task.logissue type=error]no cycle records: the driver never ran a cycle"
        Get-Content "$outDir\driver.err" -ErrorAction SilentlyContinue
      }
    displayName: 'Loop serve.start() daemon bursts'
    continueOnError: true
  # Future work step 3.5d, second half. Throwaway, never merge.
  #
  # Keep-on-hit / delete-on-miss, exactly as the loop already does for logs --
  # but the discriminator is the `etw-stop` record server.py writes, NOT the
  # presence of the .etl. Circular mode preallocates the file to 512MB, so on a
  # miss there is a full-size .etl full of nothing in particular, and treating
  # its existence as evidence would publish 12 x 512MB of noise.
  - powershell: |
      $etl = "$(Agent.TempDirectory)\afd.etl"
      $session = "wptafd"
      $outDir = "$(Agent.TempDirectory)\trials"

      # Buffers Lost is the canary for whether this trace can be trusted at all.
      # Print it BEFORE stopping, and tolerate failure: on a hit the in-process
      # hook has already stopped the session, so this query is expected to fail
      # in exactly the interesting case.
      Write-Host "=== session state at end of loop (fails if already frozen) ==="
      logman query -n $session -ets
      $frozen = 0
      if (Test-Path "$outDir\evidence.jsonl") {
        $frozen = @(Select-String -Path "$outDir\evidence.jsonl" `
                      -Pattern '"kind": "etw-stop"' -SimpleMatch).Count
      }
      Write-Host "etw-stop records: $frozen"
      logman stop -n $session -ets
      if ($frozen -eq 0) {
        Write-Host "no occurrence this leg: discarding the ring buffer"
        Remove-Item $etl -ErrorAction SilentlyContinue
      } else {
        # CSV, not XML: tracerpt's XML is roughly an order of magnitude larger
        # for the same events, and the point of decoding on the agent at all is
        # that the result must be readable without a Windows box. The .etl goes
        # alongside it compressed, so nothing is lost -- full fidelity survives
        # for anyone who can open it properly later.
        tracerpt $etl -o "$outDir\afd.csv" -of CSV `
          -summary "$outDir\afd-summary.txt" -y
        Get-Content "$outDir\afd-summary.txt" -ErrorAction SilentlyContinue
        if (Test-Path "$outDir\afd.csv") {
          $lines = @(Get-Content "$outDir\afd.csv").Count
          $mb = [math]::Round((Get-Item "$outDir\afd.csv").Length / 1MB, 1)
          Write-Host "decoded $lines CSV lines ($mb MB)"
        } else {
          Write-Host "##vso[task.logissue type=error]the trace was frozen but tracerpt produced no CSV"
        }
        # Into the staging directory rather than $outDir, so the trials artifact
        # stays casually downloadable. This build that artifact carries traces
        # rather than minidumps, since 3.5c is switched off above -- any .dmp in
        # it is a genuine Watson crash dump from configure_watson.yml, which
        # 158874's three access violations show does happen.
        Compress-Archive -Path $etl `
          -DestinationPath "$(Build.ArtifactStagingDirectory)\afd-etl.zip" -Force
      }
    displayName: 'Stop and decode Winsock/AFD ETW trace (3.5d)'
    condition: always()
    continueOnError: true
  # Must run *after* the loop, not with the probes before it: the events worth
  # having are the ones from during the daemon-startup bursts (tcpip/afd driver
  # complaints, resource pressure -- Run 2 produced one real WSAENOBUFS
  # pair-create failure, so this image is not always resource-comfortable).
  # Exporting at the start of the job would capture the boot and nothing else.
  - powershell: |
      $outDir = "$(Agent.TempDirectory)\trials"
      New-Item -ItemType Directory -Force -Path $outDir | Out-Null
      wevtutil epl System "$outDir\System.evtx" /ow:true
      wevtutil epl Application "$outDir\Application.evtx" /ow:true
      # Future work step 3.5e. The .evtx above is the archival form, but its
      # message strings live in the provider's message table and so cannot be
      # rendered off Windows -- identifying Tcpip 4231/4266 took external
      # documentation rather than the artifact itself, which is a defect in the
      # artifact. Render the network-stack providers here, where the message
      # tables exist.
      #
      # /f:Text, not /f:RenderedText: the valid values are XML, Text and
      # RenderedXml. Build 158830 used RenderedText on all 20 legs and got
      # "Invalid value for option f." / exit 87, leaving both files empty --
      # and, because this step comes before the publish steps, it also turned
      # the whole step red. Out-File rather than `>` so the encoding is utf8
      # instead of PowerShell 5.1's default UTF-16LE.
      wevtutil qe System /q:"*[System[Provider[@Name='Tcpip']]]" /f:Text |
        Out-File -Encoding utf8 "$outDir\System-Tcpip.txt"
      wevtutil qe System /q:"*[System[(Level=1 or Level=2 or Level=3)]]" /f:Text |
        Out-File -Encoding utf8 "$outDir\System-warnings.txt"
    displayName: 'Export Windows event logs'
    condition: always()
    continueOnError: true
  - publish: $(Agent.TempDirectory)\trials
    artifact: winsock-serve-loop-$(System.JobPositionInPhase)
    condition: always()
    continueOnError: true
  # Crash dumps, if configure_watson.yml's LocalDumps caught anything.
  - publish: $(Build.ArtifactStagingDirectory)
    artifact: winsock-serve-loop-dumps-$(System.JobPositionInPhase)
    condition: always()
    continueOnError: true
