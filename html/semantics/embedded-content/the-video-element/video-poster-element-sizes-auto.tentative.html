<!DOCTYPE html>
<link rel="author" title="Squarespace" href="https://www.squarespace.com/">
<link rel="help" href="https://github.com/whatwg/html/pull/12585">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="resources/poster-utils.js"></script>

<body></body>

<script>
  // Each candidate's w descriptor is its slot width scaled by the device pixel
  // ratio, so a slot-wide video selects that slot's candidate at any DPR.
  const SLOTS = [50, 200, 800];
  const SRCSET = SLOTS.map(
    (slot) => `/media/poster.png?slot=${slot} ${Math.ceil(slot * devicePixelRatio)}w`
  ).join(', ');
  const slotUrl = (slot) => new URL(`/media/poster.png?slot=${slot}`, location.href).href;

  // sizes="auto" is only honored for lazy-loaded images.
  const createSizesAutoVideo = (t, { width, videoLoading, imgLoading }) => {
    const video = document.createElement('video');
    video.width = width;
    video.height = Math.round(width * 0.75);
    if (videoLoading) video.loading = videoLoading;

    const img = document.createElement('img');
    if (imgLoading) img.loading = imgLoading;
    img.sizes = 'auto';
    img.srcset = SRCSET;
    video.appendChild(createPoster(img));
    t.add_cleanup(() => video.remove());
    document.body.appendChild(video);
    return { video, img };
  };

  promise_test(async function (t) {
    assertCurrentPosterSupported();
    const { video, img } = createSizesAutoVideo(t, { width: 200, imgLoading: 'lazy' });
    img.width = 800;
    img.height = 600;

    await t.step_wait(() => img.currentSrc === slotUrl(200),
      'sizes=auto should select the candidate matching the video width, not the img width attribute');
    assert_equals(video.currentPoster, slotUrl(200));
  }, 'sizes=auto on the poster image uses the width of the video');

  promise_test(async function (t) {
    assertCurrentPosterSupported();
    const { video, img } = createSizesAutoVideo(t, { width: 50, imgLoading: 'lazy' });
    await t.step_wait(() => img.currentSrc === slotUrl(50));

    video.width = 200;
    video.height = 150;

    await t.step_wait(() => img.currentSrc === slotUrl(200),
      'resizing the video should re-run source selection for the poster image');
    assert_equals(video.currentPoster, slotUrl(200));
  }, 'sizes=auto on the poster image reselects when the video is resized');

  promise_test(async function (t) {
    assertCurrentPosterSupported();
    const { video, img } = createSizesAutoVideo(t, { width: 50, videoLoading: 'lazy' });

    await t.step_wait(() => img.currentSrc === slotUrl(50),
      'The poster image inherits loading=lazy from the video, so sizes=auto uses the video width');
    assert_equals(video.currentPoster, slotUrl(50));
  }, 'sizes=auto applies to a poster image that inherits loading=lazy from the video');

  promise_test(async function (t) {
    assertCurrentPosterSupported();
    const { img } = createSizesAutoVideo(t, { width: 50, videoLoading: 'eager' });

    await settled(img);
    assert_not_equals(img.currentSrc, slotUrl(50), 'sizes=auto is ignored for an eager poster image');
  }, 'sizes=auto is ignored for a poster image in a video with loading=eager');

  promise_test(async function (t) {
    assertCurrentPosterSupported();
    const { img } = createSizesAutoVideo(t, { width: 50, videoLoading: 'lazy', imgLoading: 'eager' });

    await settled(img);
    assert_not_equals(img.currentSrc, slotUrl(50), 'The poster image loading=eager overrides the video');
  }, 'sizes=auto is ignored for a poster image with loading=eager in a video with loading=lazy');

  promise_test(async function (t) {
    assertCurrentPosterSupported();
    const { video, img } = createSizesAutoVideo(t, { width: 50, videoLoading: 'lazy' });
    await t.step_wait(() => img.currentSrc === slotUrl(50));

    video.loading = 'eager';

    await t.step_wait(() => img.currentSrc !== slotUrl(50),
      'sizes=auto stops applying once the poster image is eager');
  }, 'Changing the video from loading=lazy to loading=eager stops sizes=auto from applying');
</script>
