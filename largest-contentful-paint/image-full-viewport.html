<!DOCTYPE HTML>
<meta charset=utf-8>
<title>Largest Contentful Paint: size when image overflows</title>
<!-- In this test, an image with an intrinsic size of 100 x 50 is added, but
  scaled up in order to overflow the viewport. It should not be reported. -->
<body>
<style>
body {
  margin: 0px;
}
</style>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="resources/largest-contentful-paint-helpers.js"></script>
<script>
  setup({"hide_test_state": true});
  assert_implements(window.LargestContentfulPaint,
                    "LargestContentfulPaint is not implemented");
  const viewportWidth = document.documentElement.clientWidth;
  const viewportHeight = document.documentElement.clientHeight;
  const beforeLoad = performance.now();
  // The overflowing image must not be reported; the text added below remains
  // the LCP candidate.
  assertNoLCPEntry(entry => entry.url !== '', {duration: 1000,
      name: 'The overflowing image is not an LCP candidate'});
  promise_test(async () => {
    const entry = await observeLCP(entry => entry.url === '');
    checkEntry(entry, '', '', undefined, beforeLoad, ['text', 'skipSize', 'skipElement']);
  }, 'The intersectionRect of an img element overflowing is computed correctly');
  // Add an image, setting width and height equal to viewport.
  const img = appendImage('/images/lcp-100x50.png', {
    id: 'image_id',
    width: viewportWidth * 2,
    height: viewportHeight * 2,
  });
  img.onload = () => {
    const p = document.createElement('p');
    p.innerHTML = 'a';
    p.style = 'position: absolute; top: 10px; left: 10px;';
    document.body.appendChild(p);
  }
</script>
</body>
