<!DOCTYPE HTML>
<html>
<head>
  <script src="/resources/testharness.js"></script>
  <script src="/resources/testharnessreport.js"></script>
  <script src="/resources/testdriver.js"></script>
  <script src="/resources/testdriver-vendor.js"></script>
</head>
<body>

<div id="host1">
  <template shadowrootmode="open"></template>
</div>

<div id="host2">
  <template shadowrootmode="open" shadowrootreferencetarget></template>
</div>

<div id="host3">
  <template shadowrootmode="open" shadowrootreferencetarget="targetID"></template>
</div>

<script>

test(() => {
  const shadow1 = document.querySelector("#host1").shadowRoot;
  assert_equals(shadow1.referenceTarget, null);
}, "ShadowRoot.referenceTarget defaults to null when shadow is created declaratively");

test(() => {
  const shadow2 = document.querySelector("#host2").shadowRoot;
  assert_equals(shadow2.referenceTarget, "");
}, "Empty shadowrootreferencetarget attribute is reflected as empty string");

test(() => {
  const shadow1 = document.querySelector("#host3").shadowRoot;
  assert_equals(shadow1.referenceTarget, "targetID");
}, "<template> shadowrootreferencetarget sets referenceTarget on shadow root");

test(() => {
  const host1 = document.createElement("div");
  const shadow1 = host1.attachShadow({"mode": "open"});
  assert_equals(shadow1.referenceTarget, null);

  const host2 = document.createElement("div");
  const shadow2 = host2.attachShadow({"mode": "open", "referenceTarget": null});
  assert_equals(shadow2.referenceTarget, null);
}, "ShadowRoot.referenceTarget defaults to null when shadow is created imperatively");

test(() => {
  const host3 = document.createElement("div");
  const shadow3 = host3.attachShadow({"mode": "open", "referenceTarget": ""});
  assert_equals(shadow3.referenceTarget, "");
}, "Passing empty string referencetarget in ShadowRootInit is reflected as empty string");

test(() => {
  const host1 = document.createElement("div");
  const shadow1 = host1.attachShadow({"mode": "open", "referenceTarget": "targetID"});
  assert_equals(shadow1.referenceTarget, "targetID");

  const host2 = document.createElement("div");
  const shadow2 = host2.attachShadow({"mode": "open", "referenceTarget": 42});
  assert_equals(shadow2.referenceTarget, "42");

  const host3 = document.createElement("div");
  const shadow3 = host3.attachShadow({"mode": "open", "referenceTarget": true});
  assert_equals(shadow3.referenceTarget, "true");

  const host4 = document.createElement("div");
  const shadow4 = host4.attachShadow({"mode": "open", "referenceTarget": {"foo": "bar"}});
  assert_equals(shadow4.referenceTarget, "[object Object]");
}, "ShadowRootInitDict can be used to set referenceTarget on shadow root");

test(() => {
  const host1 = document.createElement("div");
  host1.attachShadow({"mode": "open", "clonable": true, "referenceTarget": "targetID"});
  const clone1 = host1.cloneNode(true);
  assert_not_equals(clone1.shadowRoot, null);
  assert_equals(clone1.shadowRoot.referenceTarget, "targetID");

  const host2 = document.createElement("div");
  host2.attachShadow({"mode": "open", "clonable": true});
  const clone2 = host2.cloneNode(true);
  assert_not_equals(clone2.shadowRoot, null);
  assert_equals(clone2.shadowRoot.referenceTarget, null);
}, "Cloning a host copies the referenceTarget of its clonable shadow root");

test(() => {
  const container = document.createElement("div");
  container.setHTMLUnsafe(`<div><template shadowrootmode="open" shadowrootclonable shadowrootreferencetarget="targetID"></template></div>`);
  const host = container.firstChild;
  assert_equals(host.shadowRoot.referenceTarget, "targetID");
  const clone = host.cloneNode(true);
  assert_not_equals(clone.shadowRoot, null);
  assert_equals(clone.shadowRoot.referenceTarget, "targetID");
}, "Cloning a host copies the referenceTarget of its clonable declarative shadow root");

test(() => {
  const host = document.createElement("div");
  const shadow = host.attachShadow({"mode": "open", "clonable": true, "referenceTarget": "targetID"});
  shadow.referenceTarget = "otherID";
  assert_equals(host.cloneNode(true).shadowRoot.referenceTarget, "otherID");
  shadow.referenceTarget = null;
  assert_equals(host.cloneNode(true).shadowRoot.referenceTarget, null);
}, "Cloning a host copies the current referenceTarget of its clonable shadow root");

test(() => {
  const container = document.createElement("div");
  container.setHTMLUnsafe(`<div><template shadowrootmode="open" shadowrootreferencetarget="targetID"></template></div>`);
  const host = container.firstChild;
  const declarativeShadow = host.shadowRoot;
  const shadow = host.attachShadow({"mode": "open", "referenceTarget": "otherID"});
  assert_equals(shadow, declarativeShadow);
  assert_equals(shadow.referenceTarget, "targetID");
}, "attachShadow() on a host with a declarative shadow root does not change its referenceTarget");

test(() => {
  const container = document.createElement("div");
  container.setHTMLUnsafe(`<div><template shadowrootmode="open"></template></div>`);
  const host = container.firstChild;
  const declarativeShadow = host.shadowRoot;
  const shadow = host.attachShadow({"mode": "open", "referenceTarget": "otherID"});
  assert_equals(shadow, declarativeShadow);
  assert_equals(shadow.referenceTarget, null);
}, "attachShadow() on a host with a declarative shadow root without shadowrootreferencetarget does not set referenceTarget");

</script>
</body>
</html>
