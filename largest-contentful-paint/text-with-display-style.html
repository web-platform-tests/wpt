<!DOCTYPE HTML>
<meta charset=utf-8>
<title>Largest Contentful Paint: observe text with display style.</title>
<body>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="resources/largest-contentful-paint-helpers.js"></script>
<style>
#title {
  display: flex;
}
</style>
<h1 id='title'>I am a title!</h1>
<script>
  assert_implements(window.LargestContentfulPaint,
                    "LargestContentfulPaint is not implemented");
  /* The first header uses 'display: flex'. On each observed entry the header
   * is replaced with the next one, respectively styled 'display: grid' and
   * 'display: block', and each one must be observed in turn.
   */
  const titles = [
    {id: 'title', style: 'display: flex'},
    {id: 'title2', style: 'display: grid'},
    {id: 'title3', style: 'display: block'},
  ];
  const beforeRenders = [performance.now()];
  const entriesPromise = observeLCPEntries(titles.length, entry => entry.url === '');

  let index = 0;
  new PerformanceObserver(entryList => {
    for (const entry of entryList.getEntries()) {
      if (entry.url !== '')
        continue;
      index++;
      if (index >= titles.length)
        continue;
      const previous = document.getElementById(titles[index - 1].id);
      if (previous)
        previous.remove();
      const next = document.createElement('h1');
      next.id = titles[index].id;
      next.style = titles[index].style;
      next.innerHTML = titles[index].id === 'title2' ? 'I am a second title!' :
          'I am the third and last title!';
      beforeRenders[index] = performance.now();
      document.body.appendChild(next);
    }
  }).observe({type: 'largest-contentful-paint', buffered: true});

  for (let i = 0; i < titles.length; i++) {
    // The first two titles are removed once their entries are observed, so
    // their entry.element is already null by the time the subtests run; only
    // the last title is still in the document.
    const options = ['text', 'sizeLowerBound'];
    if (i < titles.length - 1)
      options.push('skipElement');
    // TODO: find a good way to bound text size.
    promise_test(async () => {
      const entries = await entriesPromise;
      checkEntry(entries[i], '', titles[i].id, 500, () => beforeRenders[i], options);
    }, `Text with ${titles[i].style} is observable`);
  }
</script>
</body>
