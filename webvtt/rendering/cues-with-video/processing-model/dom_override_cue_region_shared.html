<!DOCTYPE html>
<html class="reftest-wait">
<title>WebVTT rendering, it is possible to move a cue into the region of another cue with the DOM APIs</title>
<link rel="match" href="dom_override_cue_region_shared-ref.html">
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css" />
<link rel="stylesheet" href="support/webvtt-test.css">
<script src="/common/reftest-wait.js"></script>
<script>
    var i = 0;
    function updateCue() {
        i++;
        if (i !== 2) {
            return;
        }
        var t = document.getElementById('track');
        var c1 = t.track.cues[0];
        var c2 = t.track.cues[1];
        c2.region = c1.region;
        updateRendering();
    }
    function updateRendering() {
        var v = document.getElementById('video');
        v.onplaying = function() {
            this.onplaying = null;
            this.pause();
            takeScreenshotDelayed(1000);
        };
        v.play();
    }
</script>
<video id="video" autoplay onplaying="this.onplaying = null; this.pause(); updateCue();">
    <source src="/media/white.webm" type="video/webm">
    <source src="/media/white.mp4" type="video/mp4">
    <track id="track" src="support/region_and_non_region_cue.vtt" onload="updateCue();">
    <script>
    document.getElementsByTagName('track')[0].track.mode = 'showing';
    </script>
</video>
</html>
