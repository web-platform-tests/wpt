<!DOCTYPE html>
<meta charset="utf-8">
<title>play() resumes loading of a deferred loading=lazy video</title>
<link rel="help" href="https://html.spec.whatwg.org/#dom-media-play">
<link rel="help" href="https://html.spec.whatwg.org/#lazy-load-resumption-steps">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<div id="log"></div>
<div style="height: 1000vh"></div>
<video id="video" loading="lazy" muted src="/media/A4.webm?play"></video>
<script>
const loaded = new Promise(resolve => window.addEventListener("load", resolve));

promise_test(async () => {
  await loaded;
  // By the time the load event fires, the video has been deferred.
  assert_equals(video.readyState, HTMLMediaElement.HAVE_NOTHING,
                "precondition: the video has not fetched anything");
  // play() invokes the lazy load resumption steps, so this should fetch the
  // video and start playback without the video being scrolled into view.
  await video.play();
  assert_greater_than_equal(video.readyState, HTMLMediaElement.HAVE_FUTURE_DATA);
  assert_false(video.paused);
}, "play() on a deferred below-viewport loading=lazy video loads and plays it");
</script>
