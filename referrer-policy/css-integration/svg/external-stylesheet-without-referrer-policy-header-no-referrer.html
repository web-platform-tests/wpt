<!DOCTYPE html>
<html>
  <head>
    <title>CSS integration - styling SVG from external stylesheet without Referrer-Policy header - no-referrer</title>
    <meta name="timeout" content="long">
    <link rel="help" href="https://w3c.github.io/webappsec-referrer-policy/#integration-with-css">
    <link rel="help" href="https://html.spec.whatwg.org/multipage/browsers.html#policy-container-referrer-policy">
    <script src="/resources/testharness.js"></script>
    <script src="/resources/testharnessreport.js"></script>
    <script src="/common/utils.js"></script>
    <!-- Common global functions for referrer-policy tests. -->
    <script src="/common/security-features/resources/common.sub.js"></script>
    <!-- Helper functions for referrer-policy css tests. -->
    <script src="/referrer-policy/css-integration/css-test-helper.js"></script>
    <script src="/referrer-policy/css-integration/resources/external-stylesheet-without-referrer-policy-header.js"></script>
    <meta name="referrer" content="no-referrer">
  </head>
  <body>
    <p>Check that resources from an external stylesheet served without a
    Referrer-Policy header are loaded with the default referrer policy
    (strict-origin-when-cross-origin), not with the referrer policy of the
    document.</p>

    <script>
      document.body.appendChild(createSvg());
      for (const property of svg_test_properties) {
        testExternalStyleSheetWithoutReferrerPolicyHeader({
          sheet: "without-referrer-policy-header-svg",
          params: {property},
          subresource_handler: "svg.py",
          expected: "the style sheet origin",
        }, "SVG resource from an external stylesheet without a Referrer-Policy header uses the default referrer policy, not the document's no-referrer policy: " + property);
      }
    </script>

    <div id="log"></div>
  </body>
</html>
