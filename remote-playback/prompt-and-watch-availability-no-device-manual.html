<!DOCTYPE html>
<html>
  <title>
    Test that watchAvailability() runs the callback with false when there is no device for the user to select
  </title>
  <script src="/resources/testharness.js"></script>
  <script src="/resources/testharnessreport.js"></script>
  <script src="/common/media.js"></script>
  <script src="./utils.js"></script>
  <script>
    setup({ explicit_timeout: true });
  </script>
  <body>
    <div id="prep">
      <p>Please make sure <b>no device is available</b> for remote playback.</p>
      <button id="prompt-button-prep">Show devices</button>
      <button id="start-button">Start test</button>
    </div>
    <div id="pick-device" style="display: none">
      <p>
        Click the button below to prompt for a remote playback device. If a
        device picker is shown, <b>cancel</b> it!
      </p>
      <button id="prompt-button">Pick device</button>
    </div>
  </body>
  <script src="./prepare-device.js"></script>
  <script>
    let v = document.createElement("video");
    v.src = getVideoURI("/media/movie_300");
    let promptButton = document.getElementById("prompt-button");
    // The prompt button is enabled below, once availability is known.
    promptButton.disabled = true;
    const metadataLoaded = enablePromptAfterMetadataLoaded(
        v, document.getElementById("prompt-button-prep"));

    async_test(t => {
      // Start watching availability once metadata has loaded, since remote
      // playback availability for the media element may depend on it.
      metadataLoaded.then(t.step_func(() => {
        // The callback is invoked with the current availability in a task
        // queued after the Promise returned by watchAvailability() resolves,
        // so availability must be checked in the callback and not when the
        // Promise resolves.
        v.remote.watchAvailability(t.step_func(available => {
          assert_false(available,
                       "Remote playback must be unavailable for this test.");
          promptButton.disabled = false;
        })).catch(t.unreached_func("watchAvailability() must not reject."));
      }), t.unreached_func("Media metadata must load."));

      promptButton.onclick = t.step_func(() => {
        // prompt() requires transient activation, so it must be called
        // synchronously from the click handler.
        v.remote.prompt().then(
          t.unreached_func("prompt() must not resolve without a device."),
          t.step_func_done(error => {
            // If the user agent knows that remote playback is unavailable,
            // prompt() rejects with NotFoundError without showing any UI.
            // However, the user agent may still show UI to select a device
            // (e.g., because it cannot determine that remote playback will
            // remain unavailable); in that case the user cancels it, and
            // prompt() rejects with NotAllowedError.
            assert_true(error instanceof DOMException,
                        "prompt() must reject with a DOMException.");
            assert_in_array(error.name, ["NotFoundError", "NotAllowedError"]);
          })
        );
      });
    }, "Test that watchAvailability() runs the callback with false when there is no device for the user to select.");
  </script>
</html>
