<!DOCTYPE html>
<html>
<body>
<meta name="author" title="Siye Liu" href="mailto:siliu@microsoft.com">
<meta name="assert" content="Document's caretPositionFromPoint should return a CaretPosition inside Shadow Root which is provided as argument.">
<link rel="help" href="https://www.w3.org/TR/cssom-view-1/#dom-document-caretpositionfrompoint">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
textarea {
  font: 20px/1 Ahem;
  border: none;
  padding: 0;
}
</style>

<div id="container"></div>
<script>

test(() => {
    assert_throws_js(TypeError, () => { document.caretPositionFromPoint(5, 5, "foo"); });
    assert_throws_js(TypeError, () => { document.caretPositionFromPoint(5, 5, 6); });
  }, "document.caretPositionFromPoint() throws when called without the correct parameters");

test(() => {
    container.setHTMLUnsafe(`<span>hello, world</span>`);
    const rect = container.firstChild.getBoundingClientRect();
    const characterWidth = rect.width / container.textContent.length;
    const characterIndex = 2
    // Get x and y coordinate at `he|llo, world`.
    const x = rect.left + characterWidth * characterIndex;
    const y = rect.top + rect.height / 2;
    const caretPosition = document.caretPositionFromPoint(x, y, {});
    assert_true(caretPosition instanceof CaretPosition);
    assert_true(caretPosition.offsetNode instanceof Text);
    assert_equals(typeof(caretPosition.offset), "number");
    assert_equals(caretPosition.offsetNode, container.firstChild.firstChild);
    assert_equals(caretPosition.offset, characterIndex);
}, "document.caretPositionFromPoint() should return a CaretPosition at the specified location");

test(() => {
    container.setHTMLUnsafe(`<input value='text inside input' />`);
    const rect = container.firstChild.getBoundingClientRect();
    // Get x and y coordinate at left-most location inside input element.
    const x = rect.left + 1;
    const y = rect.top + rect.height / 2;
    const caretPosition = document.caretPositionFromPoint(x, y);
    assert_true(caretPosition instanceof CaretPosition);
    assert_true(caretPosition.offsetNode instanceof Node);
    assert_equals(typeof(caretPosition.offset), "number");
    assert_equals(caretPosition.offsetNode, container.firstChild);
    assert_equals(caretPosition.offset, 0);
}, "document.caretPositionFromPoint() should return a CaretPosition at the specified location pointing to an input element which is the offsetNode.");

promise_test(async () => {
    container.setHTMLUnsafe(`<textarea rows="3" cols="4">12345678\n901234567890</textarea>`);
    await document.fonts.ready;
    const rect = container.firstChild.getBoundingClientRect();
    // Get x and y coordinate at "1234|5678..."
    const x = rect.left + 1;
    const y = rect.top + rect.height * 0.5;
    const caretPosition = document.caretPositionFromPoint(x, y);
    assert_true(caretPosition instanceof CaretPosition);
    assert_true(caretPosition.offsetNode instanceof Node);
    assert_equals(typeof(caretPosition.offset), "number");
    assert_equals(caretPosition.offsetNode, container.firstChild);
    assert_equals(caretPosition.offset, 4);
}, "document.caretPositionFromPoint() should return a CaretPosition at the specified location pointing to a textarea element which is the offsetNode.");

promise_test(async () => {
    container.setHTMLUnsafe(`<textarea rows="3" cols="4">12345678\n901234567890</textarea>`);
    await document.fonts.ready;
    const element = container.firstChild;
    const rect = element.getBoundingClientRect();
    const fontSize = parseInt(getComputedStyle(element).fontSize.match(/\d+/)[0]);

    // Check a position after a forced break.
    const caretPosition = document.caretPositionFromPoint(
        rect.left + fontSize + 2, rect.bottom - fontSize / 2);
    // caretPosition should point between '9' and '0'.
    assert_equals(caretPosition.offsetNode, element);
    assert_equals(caretPosition.offset, 10, 'offset');
    const caretRect = caretPosition.getClientRect();
    assert_equals(caretRect.left, rect.left + fontSize, 'caretRect.left');
    assert_greater_than(caretRect.bottom, rect.top + rect.height * 0.9,
        'caretRect.bottom');
}, "document.caretPositionFromPoint() for a point after a forced break should return a CaretPosition at the specified location pointing to a textarea element which is the offsetNode.");

test(() => {

    const shadowRoot = host.attachShadow({mode: 'closed'});
    shadowRoot.setHTMLUnsafe(`<span>hello, world</span>`);
    const rect = shadowRoot.firstChild.getBoundingClientRect();
    const characterWidth = rect.width / shadowRoot.textContent.length;
    const characterIndex = 2
    // Get x and y coordinate at `he|llo, world`.
    const x = rect.left + characterWidth * characterIndex;
    const y = rect.top + rect.height / 2;
    const caretPosition = document.caretPositionFromPoint(x, y, {shadowRoots: [shadowRoot]});
    assert_true(caretPosition instanceof CaretPosition);
    assert_true(caretPosition.offsetNode instanceof Text);
    assert_equals(typeof(caretPosition.offset), "number");
    assert_equals(caretPosition.offsetNode, shadowRoot.firstChild.firstChild);
    assert_equals(caretPosition.offset, characterIndex);
}, 'document.caretPositionFromPoint() should return a CaretPosition at the specified location pointing to a closed shadow tree when the shadow tree is specified as an argument');

                    </template>

                <div>world</div>
            </template>
        </div>b`);

    const innerShadowRoot = outerShadowRoot.getElementById('innerHost').shadowRoot;
    const innerShadowRootSpanElement = innerShadowRoot.querySelector("span");
    const rect = innerShadowRootSpanElement.getBoundingClientRect();
    const characterWidth = rect.width / innerShadowRootSpanElement.textContent.length;
    const characterIndex = 2
    // Get x and y coordinate at `so|me text`.
    const x = rect.left + characterWidth * characterIndex;
    const y = rect.top + rect.height / 2;
    const caretPosition = document.caretPositionFromPoint(x, y);
    assert_true(caretPosition instanceof CaretPosition);
    assert_true(caretPosition.offsetNode instanceof Node);
    assert_equals(typeof(caretPosition.offset), "number");
    assert_equals(caretPosition.offsetNode, container);
    assert_equals(caretPosition.offset, 1);
}, 'document.caretPositionFromPoint() should return a CaretPosition at the specified location pointing to the outer shadow host\'s parent when the point is in an inner shadow tree and no shadow tree is specified as an argument');

// Additional test: Coordinates outside the viewport
test(() => {
    container.setHTMLUnsafe(`<div id="test">hello</div>`);
    const rect = document.getElementById('test').getBoundingClientRect();
    // Point far outside the viewport
    const x = rect.right + 10000;
    const y = rect.bottom + 10000;
    const caretPosition = document.caretPositionFromPoint(x, y);
    assert_equals(caretPosition, null);
}, 'document.caretPositionFromPoint() should return null when coordinates are outside the viewport');

// Additional test: Negative coordinates
test(() => {
    container.setHTMLUnsafe(`<div id="test">hello</div>`);
    const caretPosition = document.caretPositionFromPoint(-100, -100);
    assert_equals(caretPosition, null);
}, 'document.caretPositionFromPoint() should return null for negative coordinates');

// Additional test: Very large coordinates
test(() => {
    container.setHTMLUnsafe(`<div id="test">hello</div>`);
    const caretPosition = document.caretPositionFromPoint(999999, 999999);
    assert_equals(caretPosition, null);
}, 'document.caretPositionFromPoint() should return null for very large coordinates');

// Additional test: shadowRoots with non-shadow-root objects
test(() => {
    container.setHTMLUnsafe(`<div id="host"></div>`);
    // shadowRoots is a sequence<ShadowRoot>; passing a non-ShadowRoot object
    // must fail WebIDL conversion with a TypeError.
    assert_throws_js(TypeError, () => {
        document.caretPositionFromPoint(0, 0, {shadowRoots: [document.body]});
    });
}, 'document.caretPositionFromPoint() should throw TypeError for non-shadow-root objects in shadowRoots array');

// Additional test: Duplicate shadowRoots in array
test(() => {
    container.setHTMLUnsafe(`<div id="host"></div>`);
    const shadowRoot = host.attachShadow({mode: 'open'});
    shadowRoot.setHTMLUnsafe(`<span>hello</span>`);
    const rect = shadowRoot.firstChild.getBoundingClientRect();
    const characterWidth = rect.width / shadowRoot.textContent.length;
    const characterIndex = 1;
    const x = rect.left + characterWidth * characterIndex;
    const y = rect.top + rect.height / 2;
    // Pass duplicate shadowRoots
    const caretPosition = document.caretPositionFromPoint(x, y, {shadowRoots: [shadowRoot, shadowRoot]});
    assert_true(caretPosition instanceof CaretPosition);
    assert_true(caretPosition.offsetNode instanceof Text);
    assert_equals(caretPosition.offsetNode, shadowRoot.firstChild.firstChild);
    assert_equals(caretPosition.offset, characterIndex);
}, 'document.caretPositionFromPoint() should handle duplicate shadowRoots in array');

// Additional test: Element with display:none
test(() => {
    container.setHTMLUnsafe(`<div id="hidden" style="display:none">hidden text</div>`);
    const hiddenElement = document.getElementById('hidden');
    // display:none elements have no rect, so caretPositionFromPoint should not return them
    const caretPosition = document.caretPositionFromPoint(0, 0);
    assert_true(caretPosition instanceof CaretPosition);
    assert_not_equals(caretPosition.offsetNode, hiddenElement);
}, 'document.caretPositionFromPoint() should not return CaretPosition for display:none elements');

// Additional test: Multiple nested shadow roots at different levels
test(() => {
    container.setHTMLUnsafe(`
        <div id="level1">
            <template shadowrootmode=open>
                <div id="level2">
                    <template shadowrootmode=open>
                        <span>deep text</span>
                    </template>
                </div>
            </template>
        </div>`);
    const level1ShadowRoot = document.getElementById('level1').shadowRoot;
    const level2Host = level1ShadowRoot.getElementById('level2');
    const level2ShadowRoot = level2Host.shadowRoot;
    const deepSpan = level2ShadowRoot.querySelector('span');
    const rect = deepSpan.getBoundingClientRect();
    const characterWidth = rect.width / deepSpan.textContent.length;
    const characterIndex = 2;
    const x = rect.left + characterWidth * characterIndex;
    const y = rect.top + rect.height / 2;
    // Specify only level1 shadow root - should not reach level2
    const caretPosition = document.caretPositionFromPoint(x, y, {shadowRoots: [level1ShadowRoot]});
    assert_true(caretPosition instanceof CaretPosition);
    assert_equals(caretPosition.offsetNode, level1ShadowRoot);
}, 'document.caretPositionFromPoint() should not traverse into nested shadow trees when only outer shadow root is specified');
