<!DOCTYPE html>
<html>
  <head>
    <title>CSS integration - Child css from external stylesheet without Referrer-Policy header - unsafe-url</title>
    <link rel="help" href="https://w3c.github.io/webappsec-referrer-policy/#integration-with-css">
    <link rel="help" href="https://fetch.spec.whatwg.org/#main-fetch">
    <script src="/resources/testharness.js"></script>
    <script src="/resources/testharnessreport.js"></script>
    <script src="/common/utils.js"></script>
    <!-- Common global functions for referrer-policy tests. -->
    <script src="/common/security-features/resources/common.sub.js"></script>
    <script src="/referrer-policy/css-integration/resources/external-stylesheet-without-referrer-policy-header.js"></script>
    <meta name="referrer" content="unsafe-url">
  </head>
  <body>
    <p>Check that resources from an external stylesheet served without a
    Referrer-Policy header are loaded with the referrer policy of the
    document.</p>

    <script>
      testExternalStyleSheetWithoutReferrerPolicyHeader({
        sheet: "without-referrer-policy-header-import",
        subresource_handler: "stylesheet.py",
        expected: "the style sheet URL",
      }, "Child css from an external stylesheet without a Referrer-Policy header uses the document's referrer policy (unsafe-url).");
    </script>

    <div id="log"></div>
  </body>
</html>
