<!doctype html>
<meta charset="utf-8">
<title>HTML partial updates - cross-document throw-on-dynamic-markup-insertion counter</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/scripting.html#prepare-content-patching">
<link rel="help" href="https://html.spec.whatwg.org/multipage/parsing.html#create-an-element-for-the-token">
<link rel="help" href="https://html.spec.whatwg.org/multipage/dynamic-markup-insertion.html#throw-on-dynamic-markup-insertion-counter">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
function createFrame(t) {
  const frame = document.createElement("iframe");
  document.body.appendChild(frame);
  t.add_cleanup(() => frame.remove());
  return frame;
}

const dynamicMarkupMethods = [
  ["document.open()", (doc) => doc.open()],
  ["document.write()", (doc) => doc.write("<p>injected")],
  ["document.writeln()", (doc) => doc.writeln("<p>injected")],
  ["document.close()", (doc) => doc.close()],
];

for (const [methodName, invoke] of dynamicMarkupMethods) {
  test((t) => {
    const parserFrame = createFrame(t);
    const targetFrame = createFrame(t);
    const parserDoc = parserFrame.contentDocument;
    const targetWin = targetFrame.contentWindow;
    const targetDoc = targetFrame.contentDocument;

    parserDoc.open();
    parserDoc.write(`<div id="target"><?start name="outer">old<?end></div>`);
    parserDoc.write(`<template for="outer"><?start name="inner"><iframe></iframe><?end>`);
    targetDoc.body.appendChild(parserDoc.getElementById("target"));

    let pagehideRan = false;
    let caught = null;
    targetDoc.querySelector("#target iframe").contentWindow.onpagehide = () => {
      pagehideRan = true;
      try {
        invoke(targetDoc);
      } catch (e) {
        caught = e;
      }
    };

    parserDoc.write(`<template for="inner">New</template></template>`);
    parserDoc.close();

    assert_true(pagehideRan, "pagehide should have fired");
    assert_throws_dom("InvalidStateError", targetWin.DOMException, () => {
      if (caught !== null) {
        throw caught;
      }
    });
    assert_equals(targetDoc.getElementById("target").textContent, "New");
    targetDoc.close();
  }, `${methodName} on scope's Document throws InvalidStateError in pagehide when patch target moved to another document`);

  promise_test(async (t) => {
    const initialFrame = createFrame(t);
    const targetFrame = createFrame(t);
    const initialDoc = initialFrame.contentDocument;
    const targetWin = targetFrame.contentWindow;
    const targetDoc = targetFrame.contentDocument;

    const container = initialDoc.createElement("div");
    initialDoc.body.appendChild(container);
    const writer = container.streamAppendHTMLUnsafe().getWriter();
    await writer.write(`<?start name="p"><iframe></iframe><?end>`);

    targetDoc.body.appendChild(container);

    let pagehideRan = false;
    let targetCaught = null;
    let initialCaught = null;
    container.querySelector("iframe").contentWindow.onpagehide = () => {
      pagehideRan = true;
      try {
        invoke(targetDoc);
      } catch (e) {
        targetCaught = e;
      }
      try {
        invoke(initialDoc);
      } catch (e) {
        initialCaught = e;
      }
    };

    await writer.write(`<template for="p">New</template>`);
    await writer.close();

    assert_true(pagehideRan, "pagehide should have fired");
    assert_throws_dom("InvalidStateError", targetWin.DOMException, () => {
      if (targetCaught !== null) {
        throw targetCaught;
      }
    });
    assert_equals(initialCaught, null);
    assert_equals(container.textContent, "New");
    targetDoc.close();
  }, `${methodName} throws InvalidStateError on current scope Document (and not initial Document) during streamAppendHTMLUnsafe after cross-document move`);
}

test((t) => {
  const parserFrame = createFrame(t);
  const targetFrame = createFrame(t);
  const thirdFrame = createFrame(t);
  const parserDoc = parserFrame.contentDocument;
  const targetWin = targetFrame.contentWindow;
  const targetDoc = targetFrame.contentDocument;
  const thirdDoc = thirdFrame.contentDocument;

  parserDoc.open();
  parserDoc.write(`<div id="target"><?start name="outer">old<?end></div>`);
  parserDoc.write(
    `<template for="outer"><?start name="inner">` +
    `<iframe id="f1"></iframe><iframe id="f2"></iframe><?end>`
  );
  const target = parserDoc.getElementById("target");
  targetDoc.body.appendChild(target);

  let f2PagehideRan = false;
  let targetCaught = null;
  target.querySelector("#f1").contentWindow.onpagehide = () => {
    thirdDoc.body.appendChild(target);
  };
  target.querySelector("#f2").contentWindow.onpagehide = () => {
    f2PagehideRan = true;
    try {
      targetDoc.open();
    } catch (e) {
      targetCaught = e;
    }
  };

  parserDoc.write(`<template for="inner">New</template></template>`);
  parserDoc.close();

  assert_true(f2PagehideRan, "second iframe pagehide should have fired");
  assert_throws_dom("InvalidStateError", targetWin.DOMException, () => {
    if (targetCaught !== null) {
      throw targetCaught;
    }
  });
  assert_equals(target.ownerDocument, thirdDoc);
  assert_equals(target.textContent, "New");
  targetDoc.close();
  thirdDoc.close();
}, "Adopting scope into a third document mid-removal-loop still decrements the original scope Document's counter");

for (const callbackType of ["constructor", "attributeChangedCallback"]) {
  for (const [methodName, invoke] of dynamicMarkupMethods) {
    test((t) => {
      const parserFrame = createFrame(t);
      const targetFrame = createFrame(t);
      const parserWin = parserFrame.contentWindow;
      const parserDoc = parserFrame.contentDocument;
      const targetWin = targetFrame.contentWindow;
      const targetDoc = targetFrame.contentDocument;

      let ran = false;
      let parserCaught = null;
      let targetCaught = null;
      targetWin.customElements.define("x-patch-probe", class extends targetWin.HTMLElement {
        static observedAttributes = ["title"];
        constructor() {
          super();
          if (callbackType === "constructor") {
            ran = true;
            try {
              invoke(parserDoc);
            } catch (e) {
              parserCaught = e;
            }
            try {
              invoke(targetDoc);
            } catch (e) {
              targetCaught = e;
            }
          }
        }
        attributeChangedCallback() {
          if (callbackType === "attributeChangedCallback") {
            ran = true;
            try {
              invoke(parserDoc);
            } catch (e) {
              parserCaught = e;
            }
            try {
              invoke(targetDoc);
            } catch (e) {
              targetCaught = e;
            }
          }
        }
      });

      parserDoc.open();
      parserDoc.write(`<div id="target"><?marker name="m"></div>`);
      parserDoc.write(`<template for="m">`);
      targetDoc.body.appendChild(parserDoc.getElementById("target"));
      parserDoc.write(`<x-patch-probe title="val"></x-patch-probe></template>`);
      parserDoc.write(`<span id="after">ok</span>`);
      parserDoc.close();

      assert_true(ran, `${callbackType} should have run synchronously`);
      assert_throws_dom("InvalidStateError", parserWin.DOMException, () => {
        if (parserCaught !== null) {
          throw parserCaught;
        }
      });
      assert_throws_dom("InvalidStateError", targetWin.DOMException, () => {
        if (targetCaught !== null) {
          throw targetCaught;
        }
      });
      assert_not_equals(targetDoc.querySelector("#target > x-patch-probe"), null);
      assert_not_equals(parserDoc.getElementById("after"), null);
      targetDoc.close();
    }, `${methodName} throws InvalidStateError on both parser and target Documents in ${callbackType} inside cross-document <template for>`);
  }
}
</script>
</body>
