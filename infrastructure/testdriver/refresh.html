<!DOCTYPE html>
<meta charset="utf-8">
<title>TestDriver refresh method</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-vendor.js"></script>
<script src="/common/utils.js"></script>

<script>
// Resolves with the navigation type the target page posts on its next load
function next_load(t, bc) {
    return new Promise((resolve, reject) => {
        bc.addEventListener("message", e => resolve(e.data), {once: true});
        t.step_timeout(() => reject(new Error("no message from the target page")), 5000);
    });
}

promise_test(async t => {
    const channel = token();
    const bc = new BroadcastChannel(channel);
    t.add_cleanup(() => bc.close());
    const url = new URL(`refresh_target.html?channel=${channel}`, location.href).href;

    const handle = await test_driver.create_window();
    let loaded = next_load(t, bc);
    await test_driver.navigate(url, handle);
    assert_equals(await loaded, "navigate", "first load");

    loaded = next_load(t, bc);
    await test_driver.refresh(handle);
    assert_equals(await loaded, "reload", "load after refresh");
}, "refresh reloads the document of the given context");
</script>
