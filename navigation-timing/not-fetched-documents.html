<!DOCTYPE html>
<meta charset="utf-8">
<title>Navigation timing entry for documents that are not fetched</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/document-lifecycle.html#initialise-the-document-object">
<link rel="help" href="https://w3c.github.io/navigation-timing/#dfn-create-the-navigation-timing-entry">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
function nextLoad(iframe) {
  return new Promise(resolve => iframe.addEventListener("load", resolve, { once: true }));
}

function assertNavigationEntry(iframe) {
  const win = iframe.contentWindow;
  const entries = win.performance.getEntriesByType("navigation");
  assert_equals(entries.length, 1, "number of navigation entries");

  const entry = entries[0];
  assert_true(entry instanceof win.PerformanceNavigationTiming, "entry is a PerformanceNavigationTiming");
  assert_equals(entry.name, iframe.contentDocument.URL, "name");
  assert_equals(entry.startTime, 0, "startTime");
  assert_equals(entry.type, "navigate", "type");
  assert_equals(entry.redirectCount, 0, "redirectCount");
  assert_greater_than(entry.domContentLoadedEventStart, 0, "domContentLoadedEventStart");

  // The time origin is the time the iframe's document was created, which is after the time origin
  // of this document and before now.
  assert_greater_than(win.performance.timeOrigin, performance.timeOrigin, "timeOrigin lower bound");
  assert_less_than_equal(win.performance.timeOrigin, performance.timeOrigin + performance.now(),
                         "timeOrigin upper bound");
}

promise_test(async t => {
  const iframe = document.createElement("iframe");
  t.add_cleanup(() => iframe.remove());
  iframe.srcdoc = "<!DOCTYPE html><p>srcdoc document";
  const loaded = nextLoad(iframe);
  document.body.append(iframe);
  await loaded;

  assert_equals(iframe.contentDocument.URL, "about:srcdoc");
  assertNavigationEntry(iframe);
}, "about:srcdoc document has a navigation timing entry");

promise_test(async t => {
  const iframe = document.createElement("iframe");
  t.add_cleanup(() => iframe.remove());
  document.body.append(iframe);

  const loaded = nextLoad(iframe);
  iframe.src = `javascript:"<!DOCTYPE html><p>javascript: URL document"`;
  await loaded;

  assert_equals(iframe.contentDocument.body.textContent, "javascript: URL document");
  assertNavigationEntry(iframe);
}, "javascript: URL document has a navigation timing entry");
</script>
