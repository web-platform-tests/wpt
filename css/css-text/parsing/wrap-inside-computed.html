<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS Text: getComputedStyle().wrapInside</title>
<link rel="author" title="Tim Nguyen" href="https://github.com/nt1m">
<link rel="help" href="https://drafts.csswg.org/css-text-4/#wrap-inside">
<meta name="assert" content="wrap-inside computed value is the specified keyword; it is not inherited.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/css/support/computed-testcommon.js"></script>
<script src="/css/support/inheritance-testcommon.js"></script>
</head>
<body>
<div id="container">
  <div id="target"></div>
</div>
<script>
test_computed_value("wrap-inside", "auto");
test_computed_value("wrap-inside", "avoid");

assert_not_inherited("wrap-inside", "auto", "avoid");
</script>
</body>
</html>
