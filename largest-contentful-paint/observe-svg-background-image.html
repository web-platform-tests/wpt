<!DOCTYPE HTML>
<meta charset=utf-8>
<title>Largest Contentful Paint: observe image.</title>
<style>
  #target {
    background-image: url('/images/green.svg');
    width: 100px;
    height: 50px;
  }
</style>
<body>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="resources/largest-contentful-paint-helpers.js"></script>
<script>
promise_test(async t => {
  assert_implements(window.LargestContentfulPaint, "LargestContentfulPaint is not implemented");
  const beforeLoad = performance.now();
  const url = window.location.origin + '/images/green.svg';
  // green.svg is 100 by 50
  const size = 100 * 50;
  const entries = await awaitEntry(t, observeLCP({url}, {settleMs: 100}),
      'The image should have triggered an LCP entry.', 1000);
  assert_equals(entries.length, 1);
  checkImage(entries[0], url, 'target', size, beforeLoad);
}, 'Same-origin SVG background image is observable.');
</script>

<div id="target" width="100" height="50"></div>
</body>
