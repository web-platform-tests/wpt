<!DOCTYPE html>
<meta charset="utf-8" />
<meta viewport="width=device-width, initial-scale=1" />
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-vendor.js"></script>
<script type="module">
import { makeCleanup, getOppositeOrientation } from "./resources/orientation-utils.js";

promise_test(async t => {
  t.add_cleanup(makeCleanup());
  await test_driver.bless("request full screen");
  await document.documentElement.requestFullscreen();

  try {
    await screen.orientation.lock('any');
  } catch (err) {
    if (err.name === "NotSupportedError") {
      assert_implements_optional(false, "Screen orientation locking is not supported on this platform");
    }
    throw err;
  }

  screen.orientation.unlock();
  await document.exitFullscreen();
  assert_equals(document.fullscreenElement, null);
  assert_equals(document.visibilityState, "visible");

  await promise_rejects_dom(
    t,
    "SecurityError",
    screen.orientation.lock(getOppositeOrientation())
  );
}, "lock() rejects with SecurityError when the document is not fullscreen");
</script>
