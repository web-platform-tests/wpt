<!DOCTYPE HTML>
<meta charset=utf-8>
<title>Largest Contentful Paint: largest text is reported.</title>

<body>
  <script src="/resources/testharness.js"></script>
  <script src="/resources/testharnessreport.js"></script>
  <script src="resources/largest-contentful-paint-helpers.js"></script>
  <style type="text/css">
    #text2 {
      position: absolute;
      width: auto;
      white-space: nowrap;
    }

  </style>
  <!-- These are some text and some tiny images. We care about the largest text. -->
  <img id='image1' />
  <div id='text1'></div>
  <div id='text2'></div>
  <img id='image2' />
  <script>
    assert_implements(window.LargestContentfulPaint,
                      "LargestContentfulPaint is not implemented");
    let beforeRender = 0;

    const load_image = async (id, url) => {
      await new Promise(resolve => {
        const image = document.getElementById(id);
        image.addEventListener('load', resolve, {once: true});
        image.src = url;
      });
    }

    const load_text = (id, text) => {
      let div = document.getElementById(id);
      div.innerHTML = text;
    }

    const entryPromise = observeLCP({id: 'text2'});

    // This driver is registered before the check tests so that it runs first:
    // promise tests are queued sequentially.
    promise_test(async (t) => {
      beforeRender = performance.now();

      // Load images and add texts.
      await load_image('image1', '/images/lcp-1x1.png');

      load_text('text1', 'This is some text.');

      load_text('text2', 'This is more text so it will be the Largest Contentful Paint!');

      await load_image('image2', '/images/lcp-2x2.png');

      await awaitEntry(t, entryPromise,
          'Timed out waiting for the text2 entry');
    }, 'The largest text is reported as the Largest Contentful Paint.');

    promise_test(async () => {
      const entry = await entryPromise;
      checkEntry(entry, '', 'text2', () => {
        // The div styling makes it approximate the text size.
        const div = document.getElementById('text2');
        return [(div.clientHeight - 5) * (div.clientWidth - 5),
                (div.clientHeight + 1) * (div.clientWidth + 1)];
      }, () => beforeRender, ['text', 'sizeRange']);
    }, 'Largest Contentful Paint: largest text is reported.');
  </script>
</body>
