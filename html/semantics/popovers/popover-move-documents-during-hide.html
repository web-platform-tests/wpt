<!doctype html>
<meta charset="utf-8" />
<title>Moving a popover to another document while it is being hidden</title>
<link rel="author" href="mailto:wpt@keithcirkel.co.uk" />
<link
  rel="help"
  href="https://html.spec.whatwg.org/multipage/popover.html#hide-popover-algorithm"
/>
<link rel="help" href="https://github.com/whatwg/html/pull/13001" />
<link rel="help" href="https://github.com/whatwg/html/pull/13045" />
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-actions.js"></script>
<script src="/resources/testdriver-vendor.js"></script>
<script src="resources/popover-utils.js"></script>

<body>
  <script>
    async function setup(t) {
      const iframe = document.createElement("iframe");
      document.body.append(iframe);
      t.add_cleanup(() => iframe.remove());
      await new Promise((resolve) => {
        iframe.addEventListener("load", resolve, { once: true });
        iframe.src = "/common/blank.html";
      });
      const createPopover = () => {
        const popover = document.createElement("div");
        popover.popover = "auto";
        document.body.append(popover);
        t.add_cleanup(() => popover.remove());
        return popover;
      };
      return { otherDoc: iframe.contentDocument, iframe, createPopover };
    }

    function moveAndShowOnBeforeToggle(listenOn, popover, otherDoc) {
      listenOn.addEventListener(
        "beforetoggle",
        () => {
          otherDoc.body.append(popover);
          popover.showPopover();
        },
        { once: true },
      );
    }

    promise_test(async (t) => {
      const { otherDoc, createPopover } = await setup(t);
      const popover = createPopover();
      popover.showPopover();
      moveAndShowOnBeforeToggle(popover, popover, otherDoc);

      assert_throws_dom("InvalidStateError", () => popover.hidePopover());
      assert_equals(popover.ownerDocument, otherDoc);
      assert_true(popover.matches(":popover-open"));
    }, "hidePopover() does not hide a popover moved and re-shown by its own beforetoggle");

    promise_test(async (t) => {
      const { otherDoc, createPopover } = await setup(t);
      const parent = createPopover();
      const invoker = parent.appendChild(document.createElement("button"));
      const child = createPopover();
      parent.showPopover();
      child.showPopover({ source: invoker });
      moveAndShowOnBeforeToggle(child, parent, otherDoc);

      assert_throws_dom("InvalidStateError", () => parent.hidePopover());
      assert_false(child.matches(":popover-open"), "child");
      assert_equals(parent.ownerDocument, otherDoc);
      assert_true(parent.matches(":popover-open"), "parent");
    }, "hidePopover() does not hide a popover moved and re-shown by its child's beforetoggle");

    promise_test(async (t) => {
      const { otherDoc, iframe, createPopover } = await setup(t);
      const popover = createPopover();
      popover.showPopover();
      moveAndShowOnBeforeToggle(popover, popover, otherDoc);
      assert_throws_dom("InvalidStateError", () => popover.hidePopover());

      await waitForRender();
      await test_driver.send_keys(iframe, "\uE00C");
      await waitForRender();
      assert_false(popover.matches(":popover-open"));
    }, "A popover moved and re-shown in another document closes on Escape there");

    function showChain(createPopover, types) {
      const chain = [];
      for (const type of types) {
        const popover = createPopover();
        popover.popover = type;
        const source = chain
          .at(-1)
          ?.appendChild(document.createElement("button"));
        popover.showPopover({ source });
        chain.push(popover);
      }
      return chain;
    }

    function moveAndReshowOnBeforeToggle(listenOn, popover, otherDoc, type) {
      const events = [];
      listenOn.addEventListener(
        "beforetoggle",
        () => {
          otherDoc.body.append(popover);
          popover.popover = type;
          popover.showPopover();
          popover.addEventListener("beforetoggle", (e) =>
            events.push(e.newState),
          );
        },
        { once: true },
      );
      return events;
    }

    const stackHiders = {
      "Calling hidePopover() on the root": (t, root) => root.hidePopover(),
      "Showing an unrelated popover": (t, root, createPopover) =>
        createPopover().showPopover(),
      "Light dismiss": async (t) => {
        const outside = document.body.appendChild(
          document.createElement("button"),
        );
        t.add_cleanup(() => outside.remove());
        outside.textContent = "outside";
        await clickOn(outside);
      },
    };

    for (const [description, hideStack] of Object.entries(stackHiders)) {
      for (const reshowAs of ["auto", "manual"]) {
        promise_test(async (t) => {
          const { otherDoc, createPopover } = await setup(t);
          const [root, child, grandchild] = showChain(createPopover, [
            "auto",
            "auto",
            "auto",
          ]);
          const childEvents = moveAndReshowOnBeforeToggle(
            grandchild,
            child,
            otherDoc,
            reshowAs,
          );

          await hideStack(t, root, createPopover);
          assert_false(root.matches(":popover-open"), "root");
          assert_false(grandchild.matches(":popover-open"), "grandchild");
          assert_equals(child.ownerDocument, otherDoc);
          assert_true(child.matches(":popover-open"), "child");
          assert_array_equals(childEvents, [], "child beforetoggle events");
        }, `${description} leaves a later popover moved and re-shown as ${reshowAs} in another document`);
      }
    }

    promise_test(async (t) => {
      const { otherDoc, createPopover } = await setup(t);
      const [root, hint, nestedHint] = showChain(createPopover, [
        "auto",
        "hint",
        "hint",
      ]);
      const hintEvents = moveAndReshowOnBeforeToggle(
        nestedHint,
        hint,
        otherDoc,
        "hint",
      );

      root.hidePopover();
      assert_false(root.matches(":popover-open"), "root");
      assert_false(nestedHint.matches(":popover-open"), "nested hint");
      assert_equals(hint.ownerDocument, otherDoc);
      assert_true(hint.matches(":popover-open"), "hint");
      assert_array_equals(hintEvents, [], "hint beforetoggle events");
    }, "Hiding a hint stack leaves a later hint popover moved and re-shown in another document");
  </script>
</body>
