<!DOCTYPE HTML>
<html>
<head>
  <meta charset=utf-8>
  <title>Largest Contentful Paint: observe video.</title>
  <script src="/resources/testharness.js"></script>
  <script src="/resources/testharnessreport.js"></script>
  <script src="../resources/largest-contentful-paint-helpers.js"></script>
</head>
<body>
  <script>
    assert_implements(window.LargestContentfulPaint,
                      "LargestContentfulPaint is not implemented");
    const beforeLoad = performance.now();
    const url = window.location.origin +
                `/media/test-1s.webm?pipe=trickle(1500:d${delay_pipe_value})`;
    // test-1s.webm is 320 by 240.
    // TODO(yoav): Validate the load and render times as well. They are
    // currently skipped by 'skipTiming'.
    promise_test(async () => {
      const entry = await load_video_and_observe(url);
      checkEntry(entry, url, 'video_id', 320 * 240, beforeLoad, ["skipTiming"]);
    }, "Same-origin video is observable and has a first frame.");
  </script>
</body>
</html>
