<!DOCTYPE html>
<title>Reference for WebVTT rendering, left and right aligned cues with and without snap to lines turned on</title>
<link rel="stylesheet" href="/fonts/ahem.css">
<link rel="stylesheet" href="support/webvtt-ref.css">
<div class="video">
    <div class="cue" style="text-align:left; top:0;"><span class="cue-background">left</span></div>
    <div class="cue" style="text-align:right; top:5%;"><span class="cue-background">right</span></div>
    <div class="cue" style="text-align:left;"><span class="cue-background">left</span></div>
    <div class="cue" style="text-align:right; bottom: 5%;"><span class="cue-background">right</span></div>
</div>
