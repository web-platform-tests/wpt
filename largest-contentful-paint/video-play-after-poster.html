<!doctype html>
<html>
<title>This test verifies a video element only triggers a single LCP entry</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="resources/largest-contentful-paint-helpers.js"></script>

<body>
  <video muted src="/images/pattern.webm" poster="/images/lcp-16x16.png" width="600"></video>
  <script>
    // Collect every entry from the start, including any delivered in the same
    // batch as the poster.
    const entries = [];
    const observer = new PerformanceObserver(list => {
      entries.push(...list.getEntries());
    });
    observer.observe({type: 'largest-contentful-paint', buffered: true});

    promise_test(async t => {
      // Ensure that the first LCP is the poster image.
      const entry = await awaitEntry(t, observeLCP(),
          'Timed out waiting for the poster entry');
      assert_true(entry.url.endsWith('lcp-16x16.png'),
          "LCP Entry should be poster, but we got " + entry.url);

      // Start the video; playing it must not produce a second LCP entry.
      document.querySelector('video').play();

      await new Promise(resolve => t.step_timeout(resolve, 500));
      observer.disconnect();
      assert_equals(entries.length, 1,
          "There should be exactly one LCP entry (the poster), but got: " +
          entries.map(e => e.url).join(', '));
    }, "Video with poster should not emit a second LCP entry after playing.")
  </script>
</body>

</html>
