<!DOCTYPE HTML>
<meta charset=utf-8>
<title>Largest Contentful Paint: observe cross-origin images.</title>
<body>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="resources/largest-contentful-paint-helpers.js"></script>
<script>
  assert_implements(window.LargestContentfulPaint,
                    "LargestContentfulPaint is not implemented");
  const url = 'http://{{domains[www]}}:{{ports[http][1]}}/images/blue.png';
  const beforeLoad = performance.now();
  // blue.png is 133 x 106.
  promise_test(async () => {
    const entry = await observeLCP({url});
    checkEntry(entry, url, 'image_id', 133 * 106, beforeLoad);
  }, 'Cross-origin image is observable.');
</script>

<img src='http://{{domains[www]}}:{{ports[http][1]}}/images/blue.png' id='image_id'/>
</body>
