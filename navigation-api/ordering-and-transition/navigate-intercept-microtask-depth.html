<!doctype html>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<meta name="variant" content="?no-currententrychange">
<meta name="variant" content="?currententrychange">

<script type="module">
import { Recorder, hasVariant } from "./resources/helpers.mjs";

// This test verifies that the "wait for all" algorithm
// (https://webidl.spec.whatwg.org/#wait-for-all) provides the correct microtask
// timing: navigatesuccess fires as a direct PerformPromiseThen reaction on the
// handler promise, not deferred to a separate task or via a wrapper promise.
//
// Because the wait-for-all reaction is queued during navigate() (before
// navigate() returns), it fires before any microtasks queued after navigate()
// returns, such as committed.then() reactions or user Promise.resolve().then()
// microtasks.

promise_test(async t => {
  // Wait for after the load event so that the navigation doesn't get converted
  // into a replace navigation.
  await new Promise(resolve => window.onload = () => t.step_timeout(resolve, 0));

  const from = navigation.currentEntry;

  const recorder = new Recorder({
    skipCurrentChange: !hasVariant("currententrychange"),
    finalExpectedEvent: "transition.finished fulfilled"
  });

  recorder.setUpNavigationAPIListeners();

  navigation.addEventListener("navigate", e => {
    e.intercept({ handler() { recorder.record("handler run"); } });
  });

  const result = navigation.navigate("#1");
  recorder.setUpResultListeners(result);

  Promise.resolve().then(() => recorder.record("promise microtask"));
  Promise.resolve().then(() => {
    Promise.resolve().then(() => recorder.record("double promise microtask"));
  });

  await recorder.readyToAssert;

  recorder.assert([
    /* event name, location.hash value, navigation.transition properties */
    ["navigate", "", null],
    ["currententrychange", "#1", { from, navigationType: "push" }],
    ["handler run", "#1", { from, navigationType: "push" }],
    ["navigatesuccess", "#1", { from, navigationType: "push" }],
    ["committed fulfilled", "#1", null],
    ["transition.committed fulfilled", "#1", null],
    ["promise microtask", "#1", null],
    ["finished fulfilled", "#1", null],
    ["transition.finished fulfilled", "#1", null],
    ["double promise microtask", "#1", null],
  ]);
}, "navigatesuccess fires as a direct microtask from wait-for-all, before other queued microtasks");
</script>
